// ---------- Word Window Attack System ----------

function shouldStartWordWindowAttack() {
  // Check if wave is still active
  if (waveState !== 'fighting') return false;
  
  // Check wave requirements - only waves 12-15 in 15-wave structure
  // Waves 9-11 are dead pixel phase, word window returns in waves 12-15
  const minWave = TEST_WORD_WINDOW_ATTACKS ? 1 : 12;
  if (wave < minWave) return false;
  
  // Skip word window during dead pixel phase (waves 9-11)
  if(wave >= 9 && wave <= 11) return false;
  
  // Check if already active
  if (wordWindowAttack.active) return false;
  
  // Check if we have a word window
  if (!wordWindowAttack.window) return false;
  
  // Check if at least 2 seconds have passed since wave start
  const timeSinceWaveStart = MIN_WAVE_DURATION - waveTimer;
  if (timeSinceWaveStart < 2.0) return false;
  
  // Calculate max attacks per wave based on wave number
  let maxAttacks = 1;
  if (wave >= 15) maxAttacks = 2;
  if (wave >= 18) maxAttacks = 3;
  
  // Check if we've already fired max attacks this wave
  if (wordWindowAttack.projectilesFiredThisWave >= maxAttacks) return false;
  
  // Random chance to start attack (more frequent in later waves)
  const baseChance = 0.002; // Base chance per frame
  const waveBonus = (wave - minWave) * 0.0003; // Increases with wave
  const chance = baseChance + waveBonus;
  
  return Math.random() < chance;
}

function startWordWindowAttack() {
  if (!wordWindowAttack.window) return;
  
  wordWindowAttack.active = true;
  wordWindowAttack.phase = 'typing';
  wordWindowAttack.text = "Dodge This!";
  wordWindowAttack.typedText = "";
  wordWindowAttack.timer = 0;
  
  // Calculate direction from window to player
  const win = wordWindowAttack.window;
  const centerX = win.x + win.width / 2;
  const centerY = win.y + win.height / 2;
  
  const dx = player.x - centerX;
  const dy = player.y - centerY;
  const angle = Math.atan2(dy, dx);
  
  // Add some randomness to the angle to make it less predictable
  const randomAngle = angle + (Math.random() - 0.5) * 0.5; // ±0.25 radians variation
  
  // Find where this direction intersects with the screen edge
  const margin = 50; // Target slightly off-screen
  let targetX, targetY;
  
  // Calculate intersection with screen bounds
  const cos = Math.cos(randomAngle);
  const sin = Math.sin(randomAngle);
  
  // Find which edge this direction will hit first
  const tRight = (W + margin - centerX) / cos;
  const tLeft = (-margin - centerX) / cos;
  const tBottom = (H + margin - centerY) / sin;
  const tTop = (-margin - centerY) / sin;
  
  // Find the smallest positive t (first intersection)
  const tValues = [];
  if (cos > 0) tValues.push(tRight);
  if (cos < 0) tValues.push(tLeft);
  if (sin > 0) tValues.push(tBottom);
  if (sin < 0) tValues.push(tTop);
  
  const t = Math.min(...tValues);
  targetX = centerX + cos * t;
  targetY = centerY + sin * t;
  
  wordWindowAttack.targetX = targetX;
  wordWindowAttack.targetY = targetY;
}

function updateWordWindowAttack(dt) {
  if (!wordWindowAttack.active) return;
  
  const win = wordWindowAttack.window;
  if (!win) {
    wordWindowAttack.active = false;
    return;
  }
  
  wordWindowAttack.timer += dt;
  
  switch(wordWindowAttack.phase) {
    case 'typing':
      // Type out text character by character (slower)
      const typeSpeed = 0.12; // Slower typing speed
      const charsToType = Math.floor(wordWindowAttack.timer / typeSpeed);
      if (charsToType <= wordWindowAttack.text.length) {
        wordWindowAttack.typedText = wordWindowAttack.text.substring(0, charsToType);
      } else {
        wordWindowAttack.typedText = wordWindowAttack.text;
        wordWindowAttack.phase = 'warning';
        wordWindowAttack.timer = 0;
      }
      break;
      
    case 'warning':
      // Update target to slowly track player (smooth homing)
      const win = wordWindowAttack.window;
      const centerX = win.x + win.width / 2;
      const centerY = win.y + win.height / 2;
      
      // Calculate current target direction
      const currentDx = wordWindowAttack.targetX - centerX;
      const currentDy = wordWindowAttack.targetY - centerY;
      const currentAngle = Math.atan2(currentDy, currentDx);
      
      // Calculate desired angle toward player
      const playerDx = player.x - centerX;
      const playerDy = player.y - centerY;
      const targetAngle = Math.atan2(playerDy, playerDx);
      
      // Smoothly interpolate toward player angle
      const lerpFactor = 0.05; // How fast it tracks (lower = slower)
      const lerpedAngle = currentAngle + (targetAngle - currentAngle) * lerpFactor;
      
      // Recalculate target based on lerped angle
      const cos = Math.cos(lerpedAngle);
      const sin = Math.sin(lerpedAngle);
      
      const margin = 50;
      const tRight = (W + margin - centerX) / cos;
      const tLeft = (-margin - centerX) / cos;
      const tBottom = (H + margin - centerY) / sin;
      const tTop = (-margin - centerY) / sin;
      
      const tValues = [];
      if (cos > 0) tValues.push(tRight);
      if (cos < 0) tValues.push(tLeft);
      if (sin > 0) tValues.push(tBottom);
      if (sin < 0) tValues.push(tTop);
      
      const t = Math.min(...tValues);
      wordWindowAttack.targetX = centerX + cos * t;
      wordWindowAttack.targetY = centerY + sin * t;
      
      // Show red line for longer before firing (2.5 seconds)
      if (wordWindowAttack.timer >= 2.5) {
        wordWindowAttack.phase = 'firing';
        wordWindowAttack.timer = 0;
        fireWordWindowProjectile();
      }
      break;
      
    case 'firing':
      // Projectile already fired, transition to laughing phase
      if (wordWindowAttack.timer >= 0.5) {
        wordWindowAttack.phase = 'laughing';
        wordWindowAttack.timer = 0;
        wordWindowAttack.laughFrame = 1;
        wordWindowAttack.laughTimer = 0;
      }
      break;
      
    case 'laughing':
      // Alternate laugh frames at 2.5fps (0.4s per frame)
      wordWindowAttack.laughTimer += dt;
      if (wordWindowAttack.laughTimer >= 0.4) {
        wordWindowAttack.laughTimer = 0;
        wordWindowAttack.laughFrame = wordWindowAttack.laughFrame === 1 ? 2 : 1;
      }
      
      // Laugh for 3 seconds then return to idle
      if (wordWindowAttack.timer >= 3.0) {
        wordWindowAttack.active = false;
        wordWindowAttack.phase = 'idle';
        wordWindowAttack.projectilesFiredThisWave++;
      }
      break;
  }
}

function fireWordWindowProjectile() {
  if (!wordWindowAttack.window) return;
  
  const win = wordWindowAttack.window;
  const centerX = win.x + win.width / 2;
  const centerY = win.y + win.height / 2;
  
  // Calculate direction to target
  const dx = wordWindowAttack.targetX - centerX;
  const dy = wordWindowAttack.targetY - centerY;
  const dist = Math.hypot(dx, dy);
  const dirX = dx / dist;
  const dirY = dy / dist;
  
  // Create projectile
  windowProjectiles.push({
    x: centerX,
    y: centerY,
    vx: dirX * 8, // Speed of projectile
    vy: dirY * 8,
    width: 384,
    height: 244,
    damage: 25, // Big damage
    rotation: Math.atan2(dirY, dirX)
  });
  
  SFX.enemyShoot();
}

function updateWindowProjectiles(dt) {
  for (const proj of windowProjectiles) {
    proj.x += proj.vx;
    proj.y += proj.vy;
    
    // Check collision with player
    if (player.invuln <= 0) {
      const projCenterX = proj.x + proj.width / 2;
      const projCenterY = proj.y + proj.height / 2;
      const dist = Math.hypot(projCenterX - player.x, projCenterY - player.y);
      
      if (dist < Math.max(proj.width, proj.height) / 2 + player.radius) {
        takeDamage(proj.damage);
        player.invuln = 1.0;
        shake = 10;
        proj.dead = true;
        floatText(player.x, player.y - 20, "WINDOW SLAM!", '#ff0000');
      }
    }
  }
  
  // Remove dead or off-screen projectiles
  windowProjectiles = windowProjectiles.filter(p => 
    !p.dead && p.x > -500 && p.x < W + 500 && p.y > -500 && p.y < H + 500
  );
}

function checkWindowCollision(obj, isPlayer){
  for(const win of windows){
    // Simple AABB collision
    if(obj.x + obj.radius > win.x && 
       obj.x - obj.radius < win.x + win.width &&
       obj.y + obj.radius > win.y && 
       obj.y - obj.radius < win.y + win.height){
      
      // Calculate which edge is closest
      const distLeft = obj.x - win.x;
      const distRight = (win.x + win.width) - obj.x;
      const distTop = obj.y - win.y;
      const distBottom = (win.y + win.height) - obj.y;
      
      const minDist = Math.min(distLeft, distRight, distTop, distBottom);
      const bounceStrength = 8;
      
      // Push toward the closest edge
      if(minDist === distLeft){
        obj.x = win.x - obj.radius - bounceStrength;
        if(obj.vx) obj.vx *= -0.5;
      } else if(minDist === distRight){
        obj.x = win.x + win.width + obj.radius + bounceStrength;
        if(obj.vx) obj.vx *= -0.5;
      } else if(minDist === distTop){
        obj.y = win.y - obj.radius - bounceStrength;
        if(obj.vy) obj.vy *= -0.5;
      } else {
        obj.y = win.y + win.height + obj.radius + bounceStrength;
        if(obj.vy) obj.vy *= -0.5;
      }
      
      // You take damage
      if(isPlayer && player.invuln <= 0){
        takeDamage(5);
        player.invuln = 0.3;
        shake = 4;
      }
      
      return true;
    }
  }
  return false;
}

function damageEnemy(en, amount, source){
  if(en.dead) return;
  en.hp -= amount;
  spawnParticles(en.x, en.y, 6, '#ffffff');
  SFX.hit();
  // Show damage number
  floatText(en.x, en.y - 15, Math.round(amount).toString(), '#ffffff');
  if(en.hp <= 0){
    // Corrupted enemies have special death handling
    if(en.isCorrupted && !en.deathTell){
      en.deathTell = true;
      en.deathTellTimer = 0.8;
      return; // Don't kill yet, let update handle the explosion
    }
    // If corrupted enemy is already in death tell and gets hit again, explode immediately
    if(en.isCorrupted && en.deathTell){
      killEnemy(en, -en.hp, source); // Trigger immediate explosion
      return;
    }
    killEnemy(en, -en.hp, source); // overflow = how far past 0 this hit pushed it
  }
}

function killEnemy(en, overflow, source){
  // Corrupted enemies have special death handling - skip if already handling death tell
  if(en.isCorrupted && en.deathTell){
    return; // Already handled in update
  }
  
  en.dead = true;
  kills++;
  killTextEl.textContent = "Kills " + kills;
  spawnParticles(en.x, en.y, 16, '#ffffff');
  SFX.death();

  // Corrupted enemy explosion
  if(en.isCorrupted){
    // Deal damage to you if in radius
    if(player.invuln <= 0 && dist(en.x, en.y, player.x, player.y) < en.explosionRadius){
      takeDamage(5);
      player.invuln = 0.6;
      shake = 4;
      floatText(player.x, player.y - 20, "EXPLOSION!", '#000');
    }
    // Show explosion effect
    spawnRing(en.x, en.y, '#ffffff');
    shake = 4;
  }

  // ---- ultimate charge from kills ----
  // Overkill bonus never applies to ultimate kills - the ultimate already
  // one-shots everything it touches, so it would otherwise refund its own cost.
  let gain = (4 + en.level*2);
  const isOverkill = source !== 'ultimate' && overflow >= en.maxHp * OVERKILL_MULT;
  if(isOverkill){
    gain *= 1.5;
    SFX.overkill();
    floatText(en.x, en.y - 10, "TERMINATED!", '#ff0000');
  }
  gain *= player.ultGainMult;
  player.ultCharge = clamp(player.ultCharge + gain, 0, 500);
  
  // ---- backup power healing on kill ----
  if(player.backupPower > 0 && (source === 'basic' || source === 'charged')){
    player.hp = clamp(player.hp + player.backupPower, 0, player.maxHp);
    hpFill.style.width = clamp(player.hp/player.maxHp,0,1)*100 + '%';
  }
  
  // ---- cascade failure: chain explosion to nearest enemy ----
  if(player.cascadeChance > 0 && Math.random() < player.cascadeChance){
    // Find nearest enemy
    let nearestEnemy = null;
    let nearestDist = Infinity;
    for(const other of enemies){
      if(other === en || other.dead) continue;
      const d = dist(en.x, en.y, other.x, other.y);
      if(d < nearestDist){
        nearestDist = d;
        nearestEnemy = other;
      }
    }
    if(nearestEnemy && nearestDist < 150){
      // Chain explosion
      damageEnemy(nearestEnemy, 2, 'cascade');
      spawnRing(nearestEnemy.x, nearestEnemy.y, '#ffffff');
      floatText(nearestEnemy.x, nearestEnemy.y - 10, "CASCADE!", '#ffff00');
    }
  }

  // ---- Drop system: IP or MEM (mutually exclusive) ----
  // Base drop chance scales with wave, but reduces with high enemy counts to prevent overflow
  // Target: roughly 4-6 IP drops per wave regardless of enemy count
  const baseDropChance = 0.2 + (Math.min(wave, 20) - 1) * 0.03;
  const enemyCountFactor = Math.max(1, enemiesToSpawn / 15); // Normalize to 15 enemies as baseline
  const dropChance = baseDropChance / enemyCountFactor;
  
  // Corrupted enemies have 2x drop chance to compensate for their danger
  const finalDropChance = en.isCorrupted ? dropChance * 2 : dropChance;
  const ipDropChance = finalDropChance + (player.ipDropRateBonus || 0);
  
  // Rare MEM drop chance (also scales with enemy count to maintain ~2-3 MEM drops per wave)
  const baseMemDropChance = 0.15 + (Math.min(wave, 20) - 1) * 0.02;
  const memDropChance = (baseMemDropChance / enemyCountFactor) + (player.memDropRateBonus || 0);
  
  // Corrupted enemies get 2x MEM drop chance as well
  const finalMemDropChance = en.isCorrupted ? memDropChance * 2 : memDropChance;
  
  if(Math.random() < ipDropChance){
    // Determine if this drop is MEM (rare) or IP (common)
    const isMemDrop = Math.random() < finalMemDropChance;
    
    let dropType, amount;
    if(isMemDrop){
      dropType = 'mem';
      // MEM amount scales with wave (3 + wave/2, up to 13 at wave 20)
      amount = Math.round(3 + wave/2 + Math.random() * 3);
    } else {
      dropType = 'ip';
      amount = Math.round((8 + Math.random()*6) * player.ipGainMult);
    }
    
    // Find spawn position - first try enemy location, then use quadrant-based if inside window
    let dropX = en.x, dropY = en.y;
    let validPosition = false;
    let tries = 0;
    const margin = 30; // Additional margin around windows
    
    // First check if enemy position is safe
    let needsReposition = false;
    for(const win of windows){
      if(dropX + margin > win.x && dropX - margin < win.x + win.width &&
         dropY + margin > win.y && dropY - margin < win.y + win.height){
        needsReposition = true;
        break;
      }
    }
    
    // Only reposition if enemy died inside window
    if(needsReposition){
      // Calculate quadrants sorted by distance to enemy death
      const quadrants = [
        { name: 'left', x: W/6, y: H/2 },
        { name: 'right', x: (W*5)/6, y: H/2 },
        { name: 'top', x: W/2, y: H/6 },
        { name: 'bottom', x: W/2, y: (H*5)/6 }
      ];
      
      // Sort quadrants by distance to enemy death
      quadrants.sort((a, b) => {
        const distA = dist(en.x, en.y, a.x, a.y);
        const distB = dist(en.x, en.y, b.x, b.y);
        return distA - distB;
      });
      
      while(!validPosition && tries < 100){
        validPosition = true;
        
        // Use quadrant based on sorted order
        const quadrantIndex = tries % 4;
        const quadrant = quadrants[quadrantIndex];
        
        switch(quadrant.name){
          case 'left': // Try spawning in left side
            dropX = margin + Math.random() * (W / 3);
            dropY = margin + Math.random() * (H - 2 * margin);
            break;
          case 'right': // Try spawning in right side
            dropX = (W * 2 / 3) + Math.random() * (W / 3 - margin);
            dropY = margin + Math.random() * (H - 2 * margin);
            break;
          case 'top': // Try spawning in top area
            dropX = margin + Math.random() * (W - 2 * margin);
            dropY = margin + Math.random() * (H / 3);
            break;
          case 'bottom': // Try spawning in bottom area
            dropX = margin + Math.random() * (W - 2 * margin);
            dropY = (H * 2 / 3) + Math.random() * (H / 3 - margin);
            break;
        }
        
        // Check if position is inside any window
        for(const win of windows){
          if(dropX + margin > win.x && dropX - margin < win.x + win.width &&
             dropY + margin > win.y && dropY - margin < win.y + win.height){
            validPosition = false;
            break;
          }
        }
        tries++;
      }
    } else {
      validPosition = true;
    }
    
    pickups.push({ x: dropX, y: dropY, amount: amount, type: dropType, life: 14, bob: Math.random()*Math.PI*2, vx:0, vy:0 });
  }
}

function spawnParticles(x,y,n,color){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 40 + Math.random()*160;
    particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.4 + Math.random()*0.4, maxLife: 0.8,
      color: '#ffffff', size: 1.5 + Math.random()*2.5
    });
  }
}
function spawnRing(x,y,color){
  particles.push({ x, y, ring:true, r:0, maxR: 150, life:0.35, maxLife:0.35, color: '#ffffff' });
}

// ---------- Targeting ----------
// Nearest enemy; ties (within a small pixel epsilon) broken by lowest HP;
// remaining ties fall back to whichever was encountered first (stable failsafe).
function findTarget(){
  let best = null, bestD = Infinity;
  for(const en of enemies){
    if(en.dead) continue;
    const d = dist(player.x, player.y, en.x, en.y);
    if(d < bestD - 1e-6){
      bestD = d; best = en;
    } else if(Math.abs(d - bestD) < 2){
      if(best && en.hp < best.hp){ best = en; bestD = Math.min(bestD, d); }
    }
  }
  return best;
}

// ---------- LMB resolution ----------
function fireBasicShot(){
  const cursorStats = CURSOR_TYPES[player.cursorType];
  
  // Check cooldown
  const effectiveCooldown = Math.max(0, cursorStats.basicCooldown - player.basicCooldownReduction);
  if(player.basicCooldownTimer > 0){
    floatText(player.x, player.y - 15, "COOLDOWN", '#ff0000');
    return;
  }
  
  const target = player.currentTarget;
  let dx, dy;
  if(target){ dx = target.x - player.x; dy = target.y - player.y; }
  else { dx = Math.cos(player.aimAngle); dy = Math.sin(player.aimAngle); }
  const len = Math.hypot(dx,dy) || 1;
  const speed = cursorStats.projectileSpeed;
  
  // Null Pointer: chance for basic shots to pierce
  const pierce = (player.basicPierceChance > 0 && Math.random() < player.basicPierceChance) ? 1 : 0;
  
  if(player.cursorType === 'default'){
    // Default cursor: single target shot
    playerBullets.push({
      x: player.x, y: player.y,
      vx: dx/len*speed, vy: dy/len*speed,
      radius: 4, dmg: cursorStats.baseDamage * player.basicDmgMult, pierce: pierce,
      type: 'default',
      maxRange: cursorStats.projectileRange,
      distanceTraveled: 0
    });
  } else if(player.cursorType === 'shotgun'){
    // Shotgun cursor: spread shot to target + nearby enemies
    const nearbyEnemies = enemies.filter(en => !en.dead && dist(en.x, en.y, target?.x || player.x, target?.y || player.y) < 150);
    const targets = nearbyEnemies.slice(0, cursorStats.pelletCount);
    
    if(targets.length === 0 && target){
      targets.push(target);
    }
    
    for(const t of targets){
      const tdx = t.x - player.x, tdy = t.y - player.y;
      const tlen = Math.hypot(tdx, tdy) || 1;
      const spreadAngle = (Math.random() - 0.5) * 0.3; // Small spread for each pellet
      const spreadX = tdx * Math.cos(spreadAngle) - tdy * Math.sin(spreadAngle);
      const spreadY = tdx * Math.sin(spreadAngle) + tdy * Math.cos(spreadAngle);
      
      playerBullets.push({
        x: player.x, y: player.y,
        vx: spreadX/tlen*speed, vy: spreadY/tlen*speed,
        radius: 3, dmg: cursorStats.baseDamage * player.basicDmgMult, pierce: 0,
        type: 'shotgun',
        maxRange: cursorStats.projectileRange,
        distanceTraveled: 0
      });
    }
  } else if(player.cursorType === 'grenade'){
    // Grenade cursor: single explosive projectile
    playerBullets.push({
      x: player.x, y: player.y,
      vx: dx/len*speed, vy: dy/len*speed, // Slower projectile
      radius: 6, dmg: cursorStats.baseDamage * player.basicDmgMult, pierce: 0,
      type: 'grenade',
      splashRadius: cursorStats.grenadeSplashRadius,
      maxRange: cursorStats.projectileRange,
      distanceTraveled: 0
    });
  } else if(player.cursorType === 'laser'){
    // Laser cursor: instant beam with ricochet
    const beamDuration = cursorStats.beamDuration;
    playerBullets.push({
      x: player.x, y: player.y,
      vx: dx/len*speed, vy: dy/len*speed,
      radius: 2, dmg: cursorStats.baseDamage * player.basicDmgMult, pierce: 0,
      type: 'laser',
      ricochetCount: cursorStats.ricochetCount,
      duration: beamDuration,
      maxDuration: beamDuration,
      ricochets: [],
      maxRange: cursorStats.projectileRange,
      distanceTraveled: 0
    });
  }
  
  // Set cooldown
  player.basicCooldownTimer = effectiveCooldown;
  
  SFX.basic();
}

function fireChargedShot(heldTime){
  const t = clamp(heldTime, CHARGE_THRESHOLD, MAX_CHARGE);
  const power = (t - CHARGE_THRESHOLD) / (MAX_CHARGE - CHARGE_THRESHOLD);
  const cursorStats = CURSOR_TYPES[player.cursorType];
  
  // Check cooldown
  const effectiveCooldown = Math.max(0, cursorStats.chargeCooldown - player.chargeCooldownReduction);
  if(player.chargeCooldownTimer > 0){
    floatText(player.x, player.y - 15, "CHARGE COOLDOWN", '#ff0000');
    return;
  }
  
  const target = player.currentTarget;
  let dx, dy;
  if(target){ dx = target.x - player.x; dy = target.y - player.y; }
  else { dx = Math.cos(player.aimAngle); dy = Math.sin(player.aimAngle); }
  const len = Math.hypot(dx,dy) || 1;
  const speed = cursorStats.projectileSpeed;
  
  if(player.cursorType === 'default'){
    // Default cursor: piercing line shot
    playerBullets.push({
      x: player.x, y: player.y,
      vx: dx/len*speed, vy: dy/len*speed,
      radius: 7 + power*6,
      dmg: cursorStats.chargeDamage * player.chargeDmgMult,
      pierce: cursorStats.chargePierce + player.chargedPierceBonus,
      type: 'default',
      maxRange: cursorStats.projectileRange,
      distanceTraveled: 0
    });
  } else if(player.cursorType === 'shotgun'){
    // Shotgun cursor: wider spread, more pellets
    const nearbyEnemies = enemies.filter(en => !en.dead && dist(en.x, en.y, target?.x || player.x, target?.y || player.y) < 200);
    const targets = nearbyEnemies.slice(0, cursorStats.chargePelletCount);
    
    if(targets.length === 0 && target){
      targets.push(target);
    }
    
    for(const t of targets){
      const tdx = t.x - player.x, tdy = t.y - player.y;
      const tlen = Math.hypot(tdx, tdy) || 1;
      const spreadAngle = (Math.random() - 0.5) * 0.5; // Wider spread for charge
      const spreadX = tdx * Math.cos(spreadAngle) - tdy * Math.sin(spreadAngle);
      const spreadY = tdx * Math.sin(spreadAngle) + tdy * Math.cos(spreadAngle);
      
      playerBullets.push({
        x: player.x, y: player.y,
        vx: spreadX/tlen*speed, vy: spreadY/tlen*speed,
        radius: 3, dmg: cursorStats.chargeDamage * player.chargeDmgMult, pierce: 0,
        type: 'shotgun',
        maxRange: cursorStats.projectileRange,
        distanceTraveled: 0
      });
    }
  } else if(player.cursorType === 'grenade'){
    // Grenade cursor: charge fan attack (not auto-aimed, uses locked direction)
    const aimAngle = target ? Math.atan2(target.y - player.y, target.x - player.x) : player.aimAngle;
    const grenadeCount = Math.min(4, Math.floor(power * 3.5) + 2); // 2-4 grenades based on charge
    const grenadeSpeed = cursorStats.projectileSpeed; // Use cursor speed
    
    const fanAngle = Math.PI / 4; // 45 degrees
    const angleStep = fanAngle / (grenadeCount - 1 || 1);
    
    for(let i = 0; i < grenadeCount; i++){
      const angle = aimAngle - fanAngle/2 + i * angleStep;
      playerBullets.push({
        x: player.x, y: player.y,
        vx: Math.cos(angle) * grenadeSpeed * 0.6, vy: Math.sin(angle) * grenadeSpeed * 0.6,
        radius: 6, dmg: cursorStats.chargeDamage * player.chargeDmgMult, pierce: 0,
        type: 'grenade',
        splashRadius: cursorStats.grenadeSplashRadius,
        maxRange: cursorStats.projectileRange,
        distanceTraveled: 0
      });
    }
  } else if(player.cursorType === 'laser'){
    // Laser cursor: thicker beam, more damage, longer ricochet
    const beamDuration = cursorStats.chargeBeamDuration;
    playerBullets.push({
      x: player.x, y: player.y,
      vx: dx/len*speed, vy: dy/len*speed,
      radius: 3, dmg: cursorStats.chargeDamage * player.chargeDmgMult, pierce: 0,
      type: 'laser',
      ricochetCount: cursorStats.chargeRicochetCount,
      duration: beamDuration,
      maxDuration: beamDuration,
      ricochets: [],
      maxRange: cursorStats.projectileRange,
      distanceTraveled: 0
    });
  }
  
  // Set cooldown
  player.chargeCooldownTimer = effectiveCooldown;
  
  spawnRing(player.x, player.y, '#7fe3ff');
  SFX.charged(power);
}

function resolveMarqueeUltimate(x1,y1,x2,y2){
  const cursorStats = CURSOR_TYPES[player.cursorType];
  
  if(player.ultCharge < 500){
    SFX.denied();
    floatText(x2, y2-10, "PURGE NOT CHARGED", '#ffffff');
    return;
  }
  
  if(player.cursorType === 'default'){
    // Default cursor: selection box damage
    const rx = Math.min(x1,x2), ry = Math.min(y1,y2);
    const rw = Math.abs(x2-x1), rh = Math.abs(y2-y1);
    let hitAny = false;
    for(const en of enemies){
      if(en.dead) continue;
      if(en.x > rx && en.x < rx+rw && en.y > ry && en.y < ry+rh){
        damageEnemy(en, cursorStats.ultDamage, 'ultimate');
        hitAny = true;
      }
    }
    player.ultCharge = 0;
    SFX.ult();
    spawnParticles((rx+rx+rw)/2, (ry+ry+rh)/2, 24, '#ffffff');
    if(!hitAny) floatText((x1+x2)/2, (y1+y2)/2, "NO TARGETS", '#888');
  } else if(player.cursorType === 'shotgun'){
    // Shotgun cursor: Radial Sweep - 360° spread
    const centerX = player.x, centerY = player.y;
    const radius = 400; // Large radius for radial sweep
    let hitAny = false;
    
    for(const en of enemies){
      if(en.dead) continue;
      if(dist(centerX, centerY, en.x, en.y) < radius){
        if(en.type === 'corrupted'){
          damageEnemy(en, 80, 'ultimate'); // 80 damage to corrupted
        } else {
          damageEnemy(en, 9999, 'ultimate'); // Instant kill non-corrupted
        }
        hitAny = true;
      }
    }
    player.ultCharge = 0;
    SFX.ult();
    spawnRing(centerX, centerY, '#ff4444');
    if(!hitAny) floatText(centerX, centerY, "NO TARGETS", '#888');
  } else if(player.cursorType === 'grenade'){
    // Grenade cursor: Screen.FloodFill() - drop mines
    const mineCount = cursorStats.ultMineCount;
    for(let i = 0; i < mineCount; i++){
      // Find safe position for mine - first try random, then use quadrant-based if inside window
      let mineX = 50 + Math.random() * (W - 100);
      let mineY = 50 + Math.random() * (H - 100);
      let validPosition = false;
      let tries = 0;
      const margin = 30;
      
      // First check if random position is safe
      let needsReposition = false;
      for(const win of windows){
        if(mineX + margin > win.x && mineX - margin < win.x + win.width &&
           mineY + margin > win.y && mineY - margin < win.y + win.height){
          needsReposition = true;
          break;
        }
      }
      
      // Only reposition if random position is inside window
      if(needsReposition){
        // Calculate quadrants sorted by distance to original spawn point
        const quadrants = [
          { name: 'left', x: W/6, y: H/2 },
          { name: 'right', x: (W*5)/6, y: H/2 },
          { name: 'top', x: W/2, y: H/6 },
          { name: 'bottom', x: W/2, y: (H*5)/6 }
        ];
        
        // Sort quadrants by distance to original spawn point
        quadrants.sort((a, b) => {
          const distA = dist(mineX, mineY, a.x, a.y);
          const distB = dist(mineX, mineY, b.x, b.y);
          return distA - distB;
        });
        
        while(!validPosition && tries < 100){
          validPosition = true;
          
          // Use quadrant based on sorted order
          const quadrantIndex = tries % 4;
          const quadrant = quadrants[quadrantIndex];
          
          switch(quadrant.name){
            case 'left': // Try spawning in left side
              mineX = margin + Math.random() * (W / 3);
              mineY = margin + Math.random() * (H - 2 * margin);
              break;
            case 'right': // Try spawning in right side
              mineX = (W * 2 / 3) + Math.random() * (W / 3 - margin);
              mineY = margin + Math.random() * (H - 2 * margin);
              break;
            case 'top': // Try spawning in top area
              mineX = margin + Math.random() * (W - 2 * margin);
              mineY = margin + Math.random() * (H / 3);
              break;
            case 'bottom': // Try spawning in bottom area
              mineX = margin + Math.random() * (W - 2 * margin);
              mineY = (H * 2 / 3) + Math.random() * (H / 3 - margin);
              break;
          }
          
          // Check if position is inside any window
          for(const win of windows){
            if(mineX + margin > win.x && mineX - margin < win.x + win.width &&
               mineY + margin > win.y && mineY - margin < win.y + win.height){
              validPosition = false;
              break;
            }
          }
          tries++;
        }
      }
      
      pickups.push({
        x: mineX, y: mineY,
        type: 'mine',
        radius: 20,
        life: 999, // Mines don't expire
        bob: Math.random()*Math.PI*2
      });
    }
    player.ultCharge = 0;
    SFX.ult();
    floatText(player.x, player.y - 20, "MINES DEPLOYED", '#ff0000');
  } else if(player.cursorType === 'laser'){
    // Laser cursor: System Overload - rapid fire charged beams
    const targetCount = 6;
    const nearestEnemies = enemies
      .filter(en => !en.dead)
      .sort((a, b) => dist(player.x, player.y, a.x, a.y) - dist(player.x, player.y, b.x, b.y))
      .slice(0, targetCount);
    
    for(const en of nearestEnemies){
      const dx = en.x - player.x, dy = en.y - player.y;
      const len = Math.hypot(dx, dy) || 1;
      const speed = cursorStats.projectileSpeed;
      
      playerBullets.push({
        x: player.x, y: player.y,
        vx: dx/len*speed, vy: dy/len*speed,
        radius: 4, dmg: cursorStats.ultDamage, pierce: 0,
        type: 'laser',
        ricochetCount: 10, // Maximum ricochets for ULT
        duration: 5, // Long duration for ULT
        maxDuration: 5,
        ricochets: [],
        maxRange: cursorStats.projectileRange,
        distanceTraveled: 0
      });
    }
    player.ultCharge = 0;
    SFX.ult();
    spawnRing(player.x, player.y, '#00ffff');
  }
}

function resolveLmbRelease(){
  if(gameOver || waveState==='upgrade') return;
  const heldTime = performance.now() - lmbDownTime;
  const d = dist(mouse.x, mouse.y, lmbDownX, lmbDownY);
  if(heldTime > CHARGE_THRESHOLD){
    fireChargedShot(heldTime);
  } else {
    fireBasicShot();
  }
}

function resolveRmbRelease(){
  if(gameOver || waveState==='upgrade') return;
  const d = dist(mouse.x, mouse.y, rmbDownX, rmbDownY);
  if(d > DRAG_THRESHOLD){
    // Check if purge meter is fully charged before allowing
    if(player.ultCharge >= 500){
      resolveMarqueeUltimate(rmbDownX, rmbDownY, mouse.x, mouse.y);
    } else {
      floatText(mouse.x, mouse.y - 30, "Can't Purge yet", '#fff');
    }
  } else {
    castSelectedSpell();
  }
}

// ---------- Game loop ----------
let lastTime = performance.now();

function update(dt){
  if(gameOver || waveState === 'upgrade' || !pointerLocked) return;

  // wave spawning for button swarms
  updateWaveSpawning(dt);
  
  // word window attack system
  if (shouldStartWordWindowAttack()) {
    startWordWindowAttack();
  }
  updateWordWindowAttack(dt);
  updateWindowProjectiles(dt);
  
  // dead pixel trap system (waves 9-15)
  if(wave >= 9 && wave <= 15){
    updateDeadPixels(dt);
  }
  
  // wave timer (minimum duration)
  if(waveState === 'fighting'){
    waveTimer = Math.max(0, waveTimer - dt);
  }
  
  // ---- antivirus aura damage ----
  if(player.antivirusDamage > 0 && player.antivirusRadius > 0){
    const auraTick = 0.5; // Damage every 0.5 seconds
    if(!player.lastAuraTick) player.lastAuraTick = 0;
    player.lastAuraTick += dt;
    if(player.lastAuraTick >= auraTick){
      player.lastAuraTick = 0;
      for(const en of enemies){
        if(dist(player.x, player.y, en.x, en.y) < player.antivirusRadius){
          damageEnemy(en, player.antivirusDamage, 'aura');
        }
      }
    }
  }
  
  // ---- system beacon pickup attraction ----
  if(player.systemBeaconRadius > 0){
    // Pull IP drops
    for(const p of pickups){
      const d = dist(player.x, player.y, p.x, p.y);
      if(d < player.systemBeaconRadius && d > player.pickupRadius){
        const pullStrength = 200 * dt;
        const a = Math.atan2(player.y - p.y, player.x - p.x);
        p.x += Math.cos(a) * pullStrength;
        p.y += Math.sin(a) * pullStrength;
      }
    }
    // Pull encrypted files
    for(const c of caches){
      const d = dist(player.x, player.y, c.x, c.y);
      if(d < player.systemBeaconRadius && d > c.radius + player.radius){
        const pullStrength = 150 * dt;
        const a = Math.atan2(player.y - c.y, player.x - c.x);
        c.x += Math.cos(a) * pullStrength;
        c.y += Math.sin(a) * pullStrength;
      }
    }
  }

  // movement direction fallback (used only when no target exists)
  const mdx = mouse.x - player.x, mdy = mouse.y - player.y;
  if(Math.hypot(mdx,mdy) > 0.5){
    const l = Math.hypot(mdx,mdy);
    player.lastDx = mdx/l; player.lastDy = mdy/l;
  }
  player.x = mouse.x;
  player.y = mouse.y;
  
  // Check window collision for you (skip if invulnerable)
  if(player.invuln <= 0){
    checkWindowCollision(player, true);
  }

  player.trail.push({x:player.x, y:player.y});
  if(player.trail.length > 10) player.trail.shift();

  // ---- targeting / aim rotation ----
  const target = findTarget();
  player.currentTarget = target;
  let desiredAngle;
  if(target){ desiredAngle = Math.atan2(target.y-player.y, target.x-player.x); }
  else { desiredAngle = Math.atan2(player.lastDy, player.lastDx); }
  player.aimAngle = desiredAngle; // Instant rotation to always point at target

  if(player.invuln > 0) player.invuln -= dt;
  
  // Cooldown timers
  if(player.basicCooldownTimer > 0) player.basicCooldownTimer -= dt;
  if(player.chargeCooldownTimer > 0) player.chargeCooldownTimer -= dt;
  
  // Iframes during ult selection
  if(isDraggingUlt){
    player.invuln = 0.5; // 0.5 seconds of invulnerability while selecting
  }
  if(player.shieldActive){
    player.shieldTimer -= dt;
    if(player.shieldTimer <= 0) player.shieldActive = false;
  }

  // obstacle collision (disabled for Visi On era)
  // if(player.invuln <= 0 && circleRectCollide(player.x,player.y,player.radius, obstacle.x,obstacle.y,obstacle.w,obstacle.h)){
  //   takeDamage(10);
  //   player.invuln = 1.0;
  //   shake = 8;
  // }

  // enemies - use enemy type system
  for(const en of enemies){
    const type = ENEMY_TYPES[en.type];
    if(type && type.update){
      type.update(en, dt);
    }
    
    // Enemy-to-enemy collision for all enemy types
    resolveEnemyCollisions(en);
    
    // Handle corrupted enemy death tell here
    if(en.isCorrupted && en.deathTell){
      en.deathTellTimer -= dt;
      // Violent vibration
      en.x += (Math.random() - 0.5) * 8;
      en.y += (Math.random() - 0.5) * 8;
      if(en.deathTellTimer <= 0){
        // Actually kill the enemy
        en.dead = true;
        kills++;
        killTextEl.textContent = "Kills " + kills;
        spawnParticles(en.x, en.y, 16, '#ffffff');
        SFX.death();

        // Corrupted enemy explosion
        if(player.invuln <= 0 && dist(en.x, en.y, player.x, player.y) < en.explosionRadius){
          takeDamage(5);
          player.invuln = 0.6;
          shake = 4;
          floatText(player.x, player.y - 20, "CRASH!", '#000');
        }
        // Show explosion effect
        spawnRing(en.x, en.y, '#ffffff');
        shake = 4;

        // Ultimate charge
        let gain = (4 + en.level*2);
        gain *= player.ultGainMult;
        player.ultCharge = clamp(player.ultCharge + gain, 0, 500);
        
        // ---- backup power healing on kill ----
        if(player.backupPower > 0){
          player.hp = clamp(player.hp + player.backupPower, 0, player.maxHp);
          hpFill.style.width = clamp(player.hp/player.maxHp,0,1)*100 + '%';
        }

        // IP drop
        // Base drop chance scales with wave, but reduces with high enemy counts to prevent overflow
        // Target: roughly 4-6 IP drops per wave regardless of enemy count
        const baseDropChance = 0.2 + (Math.min(wave, 20) - 1) * 0.03;
        const enemyCountFactor = Math.max(1, enemiesToSpawn / 15); // Normalize to 15 enemies as baseline
        const dropChance = baseDropChance / enemyCountFactor;
        if(Math.random() < dropChance){
          const amt = Math.round((8 + Math.random()*6) * player.ipGainMult);
          
          // Find spawn position - first try enemy location, then use quadrant-based if inside window
          let dropX = en.x, dropY = en.y;
          let validPosition = false;
          let tries = 0;
          const margin = 30; // Additional margin around windows
          
          // First check if enemy position is safe
          let needsReposition = false;
          for(const win of windows){
            if(dropX + margin > win.x && dropX - margin < win.x + win.width &&
               dropY + margin > win.y && dropY - margin < win.y + win.height){
              needsReposition = true;
              break;
            }
          }
          
          // Only reposition if enemy died inside window
          if(needsReposition){
            // Calculate quadrants sorted by distance to enemy death
            const quadrants = [
              { name: 'left', x: W/6, y: H/2 },
              { name: 'right', x: (W*5)/6, y: H/2 },
              { name: 'top', x: W/2, y: H/6 },
              { name: 'bottom', x: W/2, y: (H*5)/6 }
            ];
            
            // Sort quadrants by distance to enemy death
            quadrants.sort((a, b) => {
              const distA = dist(en.x, en.y, a.x, a.y);
              const distB = dist(en.x, en.y, b.x, b.y);
              return distA - distB;
            });
            
            while(!validPosition && tries < 100){
              validPosition = true;
              
              // Use quadrant based on sorted order
              const quadrantIndex = tries % 4;
              const quadrant = quadrants[quadrantIndex];
              
              switch(quadrant.name){
                case 'left': // Try spawning in left side
                  dropX = margin + Math.random() * (W / 3);
                  dropY = margin + Math.random() * (H - 2 * margin);
                  break;
                case 'right': // Try spawning in right side
                  dropX = (W * 2 / 3) + Math.random() * (W / 3 - margin);
                  dropY = margin + Math.random() * (H - 2 * margin);
                  break;
                case 'top': // Try spawning in top area
                  dropX = margin + Math.random() * (W - 2 * margin);
                  dropY = margin + Math.random() * (H / 3);
                  break;
                case 'bottom': // Try spawning in bottom area
                  dropX = margin + Math.random() * (W - 2 * margin);
                  dropY = (H * 2 / 3) + Math.random() * (H / 3 - margin);
                  break;
              }
              
              // Check if position is inside any window
              for(const win of windows){
                if(dropX + margin > win.x && dropX - margin < win.x + win.width &&
                   dropY + margin > win.y && dropY - margin < win.y + win.height){
                  validPosition = false;
                  break;
                }
              }
              tries++;
            }
          } else {
            validPosition = true;
          }
          
          pickups.push({ x: dropX, y: dropY, amount: amt, life: 14, bob: Math.random()*Math.PI*2, vx:0, vy:0 });
        }
      }
    }
  }
  enemies = enemies.filter(en => !en.dead);

  // player bullets (with cursor-specific logic)
  for(const b of playerBullets){
    const moveDist = Math.hypot(b.vx, b.vy) * dt;
    b.x += b.vx*dt; b.y += b.vy*dt;
    
    // Track distance traveled for range limits
    if(b.maxRange !== undefined && b.maxRange !== Infinity){
      b.distanceTraveled = (b.distanceTraveled || 0) + moveDist;
      if(b.distanceTraveled >= b.maxRange){
        b.dead = true;
        continue;
      }
    }
    
    if(b.type === 'default' || b.type === 'shotgun'){
      // Default and shotgun: basic hit detection
      for(const en of enemies){
        if(!en.dead && dist(b.x,b.y,en.x,en.y) < en.radius + b.radius){
          damageEnemy(en, b.dmg, 'bullet');
          if(b.pierce > 0){ b.pierce--; } else { b.dead = true; }
          break;
        }
      }
    } else if(b.type === 'grenade'){
      // Grenade: explosive on contact
      for(const en of enemies){
        if(!en.dead && dist(b.x,b.y,en.x,en.y) < en.radius + b.radius){
          // Explosion damage to hit enemy
          damageEnemy(en, b.dmg, 'grenade');
          // Splash damage to nearby enemies
          for(const nearby of enemies){
            if(nearby !== en && !nearby.dead && dist(b.x,b.y,nearby.x,nearby.y) < b.splashRadius){
              damageEnemy(nearby, b.dmg * 0.5, 'grenade');
            }
          }
          spawnRing(b.x, b.y, '#ff0000');
          b.dead = true;
          break;
        }
      }
      // Explode on screen edge too
      if(b.x < 0 || b.x > W || b.y < 0 || b.y > H){
        spawnRing(b.x, b.y, '#ff0000');
        b.dead = true;
      }
    } else if(b.type === 'laser'){
      // Laser: instant hit + ricochet logic
      b.duration -= dt;
      if(b.duration <= 0){
        b.dead = true;
        continue;
      }
      
      // Find first enemy in laser path
      let hitEnemy = null;
      let hitDist = Infinity;
      for(const en of enemies){
        if(!en.dead){
          const d = dist(b.x, b.y, en.x, en.y);
          if(d < hitDist){
            hitDist = d;
            hitEnemy = en;
          }
        }
      }
      
      if(hitEnemy && !b.ricochets.includes(hitEnemy)){
        damageEnemy(hitEnemy, b.dmg, 'laser');
        b.ricochets.push(hitEnemy);
        if(b.ricochets.length >= b.ricochetCount){
          b.dead = true;
        } else {
          // Calculate next ricochet direction
          const nextEnemy = enemies.find(en => !en.dead && en !== hitEnemy && dist(hitEnemy.x, hitEnemy.y, en.x, en.y) < 200);
          if(nextEnemy){
            const ndx = nextEnemy.x - hitEnemy.x, ndy = nextEnemy.y - hitEnemy.y;
            const nlen = Math.hypot(ndx, ndy) || 1;
            const laserSpeed = b.maxRange === Infinity ? 500 : 300;
            b.vx = ndx/nlen * laserSpeed;
            b.vy = ndy/nlen * laserSpeed;
            b.x = hitEnemy.x; b.y = hitEnemy.y;
            b.dmg *= 0.7; // Damage decay per ricochet
          } else {
            b.dead = true;
          }
        }
      }
    }
  }
  playerBullets = playerBullets.filter(b => !b.dead && b.x>-20 && b.x<W+20 && b.y>-20 && b.y<H+20);

  // enemy bullets
  for(const b of enemyBullets){
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(player.invuln <= 0 && dist(b.x,b.y,player.x,player.y) < player.radius + b.radius){
      if(player.shieldActive){
        // Active Firewall: damage attacker if shield blocks
        if(player.activeFirewall){
          // Find nearest enemy to damage back
          let nearestEnemy = null;
          let nearestDist = Infinity;
          for(const en of enemies){
            const d = dist(player.x, player.y, en.x, en.y);
            if(d < nearestDist){
              nearestDist = d;
              nearestEnemy = en;
            }
          }
          if(nearestEnemy && nearestDist < 100){
            damageEnemy(nearestEnemy, 1, 'shield');
          }
        }
        player.shieldActive = false;
        spawnRing(player.x, player.y, '#ffffff');
      } else {
        takeDamage(8);
        player.invuln = 0.5;
      }
      b.dead = true;
      shake = 5;
    }
  }
  enemyBullets = enemyBullets.filter(b => !b.dead && b.x>-20 && b.x<W+20 && b.y>-20 && b.y<H+20);

  // pickups (IP orbs, MEM drops, and mines from grenade ULT)
  for(const p of pickups){
    p.life -= dt;
    
    // Handle mine pickups (from grenade ULT)
    if(p.type === 'mine'){
      for(const en of enemies){
        if(!en.dead && dist(p.x, p.y, en.x, en.y) < p.radius + en.radius){
          // Mine detonates
          damageEnemy(en, 15, 'mine');
          spawnRing(p.x, p.y, '#ff0000');
          spawnParticles(p.x, p.y, 12, '#ff0000');
          
          // Cascade failure to nearby enemies
          for(const nearby of enemies){
            if(nearby !== en && !nearby.dead && dist(p.x, p.y, nearby.x, nearby.y) < 80){
              if(player.cascadeChance > 0 && Math.random() < player.cascadeChance){
                damageEnemy(nearby, 8, 'cascade');
                spawnRing(nearby.x, nearby.y, '#ff8800');
              }
            }
          }
          
          p.dead = true;
          break;
        }
      }
      pickups = pickups.filter(p => !p.dead && p.life > 0);
      continue;
    }
    
    // Handle normal pickups (IP/MEM)
    const d = dist(p.x,p.y,player.x,player.y);
    if(d < player.pickupRadius * 2.2){
      const ang = Math.atan2(player.y-p.y, player.x-p.x);
      p.vx += Math.cos(ang) * 500 * dt;
      p.vy += Math.sin(ang) * 500 * dt;
    }
    p.vx *= 0.9; p.vy *= 0.9;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(d < player.pickupRadius){
      if(p.type === 'mem'){
        // MEM drop: restore health
        player.hp = clamp(player.hp + p.amount, 0, player.maxHp);
        hpFill.style.width = clamp(player.hp/player.maxHp,0,1)*100 + '%';
        floatText(p.x, p.y-10, "+" + p.amount + " MEM", '#ffffff');
      } else {
        // IP drop: add to IP
        player.ip = clamp(player.ip + p.amount, 0, 300);
        updateIpHud();
        floatText(p.x, p.y-10, "+" + p.amount + " IP", '#ffffff');
      }
      SFX.pickup();
      p.dead = true;
    }
  }
  pickups = pickups.filter(p => !p.dead && p.life > 0);

  // encrypted files: spawn on a timer (one at a time), expire if not decrypted
  if(waveState === 'fighting'){
    if(caches.length === 0){
      cacheSpawnTimer -= dt;
      if(cacheSpawnTimer <= 0){
        spawnCache();
        cacheSpawnTimer = 9 + Math.random()*6;
      }
    }
  }
  for(const c of caches){
    c.life -= dt;
    // Check if you are touching the file
    if(dist(c.x,c.y,player.x,player.y) < c.radius + player.radius){
      c.decrypting = true;
      // Apply faster decrypt reduction
      const decryptSpeed = 1 + player.fasterDecrypt;
      c.decryptProgress += dt * decryptSpeed;
      
      // Check if decryption is complete
      if(c.decryptProgress >= c.decryptTime){
        c.opened = true;
        if(c.kind === 'ip'){
          player.ip = clamp(player.ip + c.amount, 0, 300);
          updateIpHud();
          floatText(c.x, c.y-20, "DECRYPTED +" + c.amount + " IP", '#ffffff');
          floatText(c.x, c.y-40, "LEVEL " + c.level + " FILE", '#00ff00');
        } else {
          player.hp = clamp(player.hp + c.amount, 0, player.maxHp);
          floatText(c.x, c.y-20, "RESTORED +" + c.amount + " MEM", '#ffffff');
          floatText(c.x, c.y-40, "LEVEL " + c.level + " FILE", '#00ff00');
          hpFill.style.width = clamp(player.hp/player.maxHp,0,1)*100 + '%';
        }
        SFX.pickup();
        spawnParticles(c.x, c.y, 14, '#ffffff');
      }
    } else {
      c.decrypting = false;
      // Progress resets if you move away
      c.decryptProgress = Math.max(0, c.decryptProgress - dt * 2); // Faster decay
    }
  }
  caches = caches.filter(c => !c.opened && c.life > 0);

  // particles
  for(const p of particles){
    if(p.ring){ p.r += (p.maxR/p.maxLife)*dt; }
    else { p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.92; p.vy *= 0.92; }
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  if(shake > 0) shake = Math.max(0, shake - dt*40);
  
  // Update debounce timer
  if(player.debounceTimer > 0){
    player.debounceTimer = Math.max(0, player.debounceTimer - dt);
  }

  // wave state machine
  if(waveState === 'fighting' && enemies.length === 0 && deadPixels.length === 0 && enemiesSpawned >= enemiesToSpawn && hasStartedSpawning && waveTimer <= 0 && !gameOver){
    waveState = 'banner';
    bannerTimer = 2.7;
    // Clean up all drops at wave end
    pickups = [];
    caches = [];
    deadPixels = []; // Clean up dead pixels
  } else if(waveState === 'banner'){
    bannerTimer = Math.max(0, bannerTimer - dt);
    if(bannerTimer <= 0){
      showUpgradeChoices();
    }
  } else if(waveState === 'upgrade'){
    // Game complete after wave 15
    if(wave >= 15){
      // Victory condition for Visi On era
      waveState = 'victory';
      // Show victory screen
      overlayTitle.textContent = "STAGE COMPLETE";
      overlaySub.textContent = "Visi On Era Cleared  " + kills + " kills";
      overlay.classList.remove('hidden');
    }
  }

  // HUD
  hpFill.style.width = clamp(player.hp/player.maxHp,0,1)*100 + '%';
  ultFill.style.width = clamp(player.ultCharge/5,0,100) + '%';
  ultBarWrap.classList.toggle('ready', player.ultCharge >= 500);
}

function takeDamage(amount){
  // Check dodge buffer first
  if(player.dodgeBuffer > 0 && Math.random() < player.dodgeBuffer){
    floatText(player.x, player.y - 20, "DODGED!", '#00ff00');
    return; // No damage taken
  }
  
  // Check debounce immunity
  if(player.debounceTimer > 0){
    return; // No damage during debounce window
  }
  
  // Apply armor plating reduction
  const reducedAmount = Math.max(0, amount - player.armorPlating);
  
  player.hp -= reducedAmount;
  SFX.hurt();
  
  // Show damage number
  floatText(player.x, player.y - 15, Math.round(reducedAmount).toString(), '#ff0000');
  
  // Apply debounce if you have it
  if(player.debounceWindow > 0){
    player.debounceTimer = player.debounceWindow;
  }
  
  if(player.hp <= 0 && !gameOver){
    player.hp = 0;
    gameOver = true;
    if(document.exitPointerLock) document.exitPointerLock();
    overlayTitle.textContent = "SYSTEM CRASH";
    overlaySub.textContent = "Survived " + (wave) + " waves  " + kills + " kills";
    overlay.classList.remove('hidden');
  }
}

function updateMenuButton(en, dt){
  switch(en.state){
    case 'spawning': {
      en.stateTimer -= dt;
      en.blink = (en.blink + dt * 15) % (Math.PI * 2);
      if(en.stateTimer <= 0){
        en.state = 'jumping';
        en.stateTimer = 0.2; // Jump duration
        // Calculate jump direction toward you
        const dx = player.x - en.x;
        const dy = player.y - en.y;
        const len = Math.hypot(dx, dy) || 1;
        const speed = en.isCorrupted ? 270 : 180;
        en.vx = (dx / len) * speed;
        en.vy = (dy / len) * speed;
      }
      
      // Check collision with you during spawning
      if(player.invuln <= 0 && dist(en.x, en.y, player.x, player.y) < en.radius + player.radius){
        const damage = en.isCorrupted ? 8 : 10;
        takeDamage(damage);
        player.invuln = 0.4;
        en.dead = true;
        shake = 6;
      }
      break;
    }
    case 'jumping': {
      en.stateTimer -= dt;
      en.x += en.vx * dt;
      en.y += en.vy * dt;
      
      // Check collision with you
      if(player.invuln <= 0 && dist(en.x, en.y, player.x, player.y) < en.radius + player.radius){
        const damage = en.isCorrupted ? 8 : 10;
        takeDamage(damage);
        player.invuln = 0.4;
        en.dead = true;
        shake = 6;
      }
      
      if(en.stateTimer <= 0){
        en.state = 'rushing';
      }
      break;
    }
    case 'rushing': {
      // Continue rushing toward you
      const dx = player.x - en.x;
      const dy = player.y - en.y;
      const len = Math.hypot(dx, dy) || 1;
      const speed = en.isCorrupted ? 225 : 150;
      en.vx = (dx / len) * speed;
      en.vy = (dy / len) * speed;
      
      en.x += en.vx * dt;
      en.y += en.vy * dt;
      
      // Check collision with you
      if(player.invuln <= 0 && dist(en.x, en.y, player.x, player.y) < en.radius + player.radius){
        const damage = en.isCorrupted ? 8 : 10;
        takeDamage(damage);
        player.invuln = 0.4;
        en.dead = true;
        shake = 6;
      }
      
      // Remove if off screen
      if(en.x < -20 || en.x > W + 20 || en.y < -20 || en.y > H + 20){
        en.dead = true;
      }
      break;
    }
  }
}

function resolveEnemyCollisions(en){
  for(const other of enemies){
    if(other === en || other.dead) continue;
    
    const d = dist(en.x, en.y, other.x, other.y);
    const minDist = en.radius + other.radius;
    
    if(d < minDist && d > 0){
      // Push enemies apart
      const overlap = minDist - d;
      const dx = (en.x - other.x) / d;
      const dy = (en.y - other.y) / d;
      
      // Move both enemies apart equally
      const push = overlap / 2;
      en.x += dx * push;
      en.y += dy * push;
      other.x -= dx * push;
      other.y -= dy * push;
    }
  }
}

// Check if a path is blocked by any window
function isPathBlocked(x1, y1, x2, y2){
  for(const win of windows){
    if(lineIntersectsRect(x1, y1, x2, y2, win.x, win.y, win.width, win.height)){
      return true;
    }
  }
  return false;
}

// Check if a line segment intersects with a rectangle
function lineIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh){
  // Check intersection with each edge of the rectangle
  return lineIntersectsLine(x1, y1, x2, y2, rx, ry, rx + rw, ry) || // top
         lineIntersectsLine(x1, y1, x2, y2, rx + rw, ry, rx + rw, ry + rh) || // right
         lineIntersectsLine(x1, y1, x2, y2, rx, ry + rh, rx + rw, ry + rh) || // bottom
         lineIntersectsLine(x1, y1, x2, y2, rx, ry, rx, ry + rh); // left
}

// Check if two line segments intersect
function lineIntersectsLine(x1, y1, x2, y2, x3, y3, x4, y4){
  const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
  if(denom === 0) return false;
  
  const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
  const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
  
  return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
}

function drawWordWindowAttack() {
  if (!wordWindowAttack.active || !wordWindowAttack.window) return;
  
  const win = wordWindowAttack.window;
  
  // Draw typing text on the word window
  if (wordWindowAttack.phase === 'typing' || wordWindowAttack.phase === 'warning') {
    ctx.save();
    ctx.font = 'bold 28px "DOS VGA", "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // Text position with specified offsets, centered in the text area
    const textX = win.x + 20 + (win.width - 50) / 2; // Left offset + half of available width
    const textY = win.y + 44 + (win.height - 74) / 2; // Top offset + half of available height (44 + 30 = 74)
    
    ctx.fillText(wordWindowAttack.typedText, textX, textY);
    ctx.restore();
  }
  
  // Draw red warning line
  if (wordWindowAttack.phase === 'warning' || wordWindowAttack.phase === 'firing') {
    const centerX = win.x + win.width / 2;
    const centerY = win.y + win.height / 2;
    
    ctx.save();
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 5]);
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(wordWindowAttack.targetX, wordWindowAttack.targetY);
    ctx.stroke();
    ctx.restore();
  }
  
  // Draw laugh animation
  if (wordWindowAttack.phase === 'laughing') {
    const laughImage = wordWindowAttack.laughFrame === 1 ? laugh1Image : laugh2Image;
    
    // Shrink by 40% horizontally, stretch vertically by 15%
    const scaleX = 0.6; // 60% of original width
    const scaleY = 0.6 * 1.15; // 60% width stretched 15% vertically = 69% of original height
    const scaledWidth = win.width * scaleX;
    const scaledHeight = win.height * scaleY;
    const offsetX = (win.width - scaledWidth) / 2;
    const offsetY = (win.height - scaledHeight) / 2;
    
    ctx.save();
    if (laughImage && laughImage.complete && laughImage.naturalWidth > 0) {
      ctx.drawImage(laughImage, win.x + offsetX, win.y + offsetY, scaledWidth, scaledHeight);
    } else {
      // Fallback if images fail to load
      ctx.fillStyle = '#808080';
      ctx.fillRect(win.x + offsetX, win.y + offsetY, scaledWidth, scaledHeight);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(win.x + offsetX, win.y + offsetY, scaledWidth, scaledHeight);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('HAHA!', win.x + win.width/2, win.y + win.height/2);
    }
    ctx.restore();
  }
}

  ctx.save();
  if(shake > 0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  drawWallpaper();
  drawWindows();
  drawWordWindowAttack();
  drawDeadPixels(); // Draw dead pixel traps
  drawPickups();
  drawCaches();
  drawEnemies();
  drawBullets();
  drawWindowProjectiles();
  drawParticles();
  drawMarquee();
  drawPlayer();

  if(waveState === 'banner'){
    ctx.save();
    ctx.globalAlpha = clamp(bannerTimer,0,1);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px "DOS VGA", "Courier New", monospace';
    ctx.textAlign = 'center';
    
    // Draw black background behind text
    ctx.fillStyle = '#000';
    ctx.fillRect(W/2 - 280, H/2 - 80, 560, 160);
    
    ctx.fillStyle = '#fff';
    ctx.fillText('WAVE ' + wave + ' COMPLETE', W/2, H/2 - 20);
    ctx.font = '24px "DOS VGA", "Courier New", monospace';
    ctx.fillText('system update...', W/2, H/2 + 28);
    ctx.textAlign = 'left';
    ctx.restore();
  } else if(waveState === 'victory'){
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px "DOS VGA", "Courier New", monospace';
    ctx.textAlign = 'center';
    
    // Draw black background
    ctx.fillStyle = '#000';
    ctx.fillRect(W/2 - 400, H/2 - 100, 800, 200);
    
    ctx.fillStyle = '#00ff00';
    ctx.fillText('VISI ON ERA COMPLETE', W/2, H/2 - 30);
    ctx.font = '24px "DOS VGA", "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('You have mastered the Classic GUI!', W/2, H/2 + 30);
    ctx.fillText('Press R for Main Menu', W/2, H/2 + 70);
    ctx.textAlign = 'left';
    ctx.restore();
  }
  ctx.restore();
}

function loop(now){
  const dt = Math.min(0.05, (now-lastTime)/1000);
  lastTime = now;
  update(dt);
  draw();
  updateIpHud();
  requestAnimationFrame(loop);
}

// ---------- Game Initialization ----------
function initGame(){
  const cursorStats = CURSOR_TYPES[player.cursorType];
  player.hp = player.maxHp = cursorStats.maxHp;
  player.ip = 0;
  player.ultCharge = 0;
  player.shieldActive = false;
  player.invuln = 2;
  player.pickupRadius = 30;
  player.basicDmgMult = player.chargeDmgMult = player.ultGainMult = player.ipGainMult = 1;
  player.armorPlating = 0;
  player.dodgeBuffer = 0;
  player.backupPower = 0;
  player.debounceWindow = 0;
  player.debounceTimer = 0;
  player.activeFirewall = false;
  player.chargedPierceBonus = 0;
  player.basicPierceChance = 0;
  player.cascadeChance = 0;
  player.antivirusDamage = 0;
  player.antivirusRadius = 0;
  player.systemBeaconRadius = 0;
  player.fasterDecrypt = 0;
  player.ipDropRateBonus = 0;
  player.memDropRateBonus = 0;
  player.hasSplitShot = false;
  player.hasRicochet = false;
  player.basicCooldownTimer = 0;
  player.chargeCooldownTimer = 0;
  player.basicCooldownReduction = 0;
  player.chargeCooldownReduction = 0;
  enemies = []; playerBullets = []; enemyBullets = []; particles = []; pickups = []; caches = []; deadPixels = []; windows = [];
  cacheSpawnTimer = 6 + Math.random()*4;
  kills = 0; wave = 1; waveState = 'fighting';
  killTextEl.textContent = 'Kills 0';
  gameOver = false;
  overlay.classList.add('hidden');
  upgradeOverlay.classList.add('hidden');
  player.invuln = 1.5; // Invulnerability at game start
  // Don't spawn windows here - let pointer lock handler do it
  // spawnWindows();
  
  console.log('=== GAME INIT DEBUG ===');
  console.log('Game state:', gameState.currentState);
  console.log('Wave:', wave);
  console.log('Wave state:', waveState);
  console.log('Canvas size:', canvas.width, canvas.height);
  console.log('W/H variables:', W, H);
}

// ---------- Restart / Main Menu ----------
restartBtn.addEventListener('click', () => {
  showMainMenu(); // Return to main menu instead of restarting
});

updateIpHud();
loadWindowImage();

// Hide lock overlay initially since we start with main menu
lockOverlay.classList.add('hidden');

initMainMenu(); // Initialize main menu system

// Add resize listener for main menu
window.addEventListener('resize', () => {
  if(gameState.currentState === 'mainMenu'){
    resizeCanvasForMainMenu();
    scaleMainMenu();
  }
});

requestAnimationFrame(loop);
})();
</script>

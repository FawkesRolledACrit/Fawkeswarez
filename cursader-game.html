    ctx.fillText(en.buttonName, buttonX + buttonW/2, buttonY + buttonH/2);
    ctx.globalAlpha = 1;
  } else {
    // Draw as flying enemy - white background, red text for corrupted
    ctx.translate(en.x, en.y);
    drawButtonBody(0, 0);
    
    // Draw text - red for corrupted, black for normal; fades as it chips away
    ctx.globalAlpha = 1 - damageFrac * 0.6;
    ctx.fillStyle = en.isCorrupted ? '#ff0000' : '#000000';
    ctx.font = '12px "DOS VGA", "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(en.buttonName, 0, 0);
    ctx.globalAlpha = 1;
    
    // Draw explosion radius ring during death tell
    if(en.deathTell){
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, en.explosionRadius, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  
  ctx.restore();
}

// ---------- Button chunk / debris helpers ----------
// Build the button's body as contiguous chunk clusters (2x2 / 3x2 groups), so
// damage pops whole chunks off instead of a scattered pixel checkerboard.
function buildButtonChunks(cols, rows){
  const total = cols * rows;
  const owner = new Array(total).fill(-1);
  const chunks = [];
  const adj = (i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const out = [];
    if(c > 0) out.push(i - 1);
    if(c < cols - 1) out.push(i + 1);
    if(r > 0) out.push(i - cols);
    if(r < rows - 1) out.push(i + cols);
    return out;
  };
  // Grow each chunk from a random seed by BFS, targeting 2-4 contiguous blocks
  const seeds = [];
  for(let i = 0; i < total; i++) seeds.push(i);
  for(let i = seeds.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [seeds[i], seeds[j]] = [seeds[j], seeds[i]];
  }
  for(const seed of seeds){
    if(owner[seed] !== -1) continue;
    const target = 2 + Math.floor(Math.random() * 3); // 2-4 blocks per chunk
    const chunk = [seed];
    owner[seed] = chunks.length;
    const frontier = adj(seed).filter(j => owner[j] === -1);
    while(chunk.length < target && frontier.length){
      const j = frontier.splice(Math.floor(Math.random() * frontier.length), 1)[0];
      if(owner[j] !== -1) continue;
      owner[j] = chunks.length;
      chunk.push(j);
      for(const k of adj(j)){
        if(owner[k] === -1 && !frontier.includes(k)) frontier.push(k);
      }
    }
    chunks.push(chunk);
  }
  // Merge any leftover 1-block chunks into an adjacent chunk so nothing reads as
  // a scattered single pixel - damage should pop whole chunks, not a checkerboard.
  for(let c = 0; c < chunks.length; c++){
    if(chunks[c].length > 1) continue;
    const single = chunks[c][0];
    for(const j of adj(single)){
      const other = owner[j];
      if(other !== -1 && other !== c){
        chunks[other].push(single);
        owner[single] = other;
        chunks[c] = [];
        break;
      }
    }
  }
  const finalChunks = chunks.filter(c => c.length > 0);
  // Shuffle removal order so erosion feels organic
  for(let i = finalChunks.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [finalChunks[i], finalChunks[j]] = [finalChunks[j], finalChunks[i]];
  }
  return finalChunks;
}

// ---------- Generic chunk-damage machinery (shared by all enemies) ----------
// Initialize an enemy's chip state for a body of w x h pixels. The body is
// carved into contiguous chunk clusters; as HP drops, chunks pop off in order,
// each throwing debris, until the enemy is ground down.
function initEnemyChips(en, w, h){
  const block = 4;
  const cols = Math.max(1, Math.floor(w / block));
  const rows = Math.max(1, Math.floor(h / block));
  en.chunkCols = cols;
  en.chunkRows = rows;
  en.chunkW = w;
  en.chunkH = h;
  en.chunks = buildButtonChunks(cols, rows);
  en.chipProgress = 0;
  en.removedChunks = 0;
  en.hitFlash = 0;
  return en;
}

// Ease chipProgress toward the damage fraction, popping chunks off one at a
// time (each releasing debris) as the bar drains.
function updateEnemyChips(en, dt){
  const chipTarget = en.maxHp > 0 ? clamp(1 - en.hp / en.maxHp, 0, 1) : 0;
  en.chipProgress = (en.chipProgress || 0) + (chipTarget - (en.chipProgress || 0)) * Math.min(1, dt * 3);
  const wantRemoved = Math.floor(en.chipProgress * (en.chunks || []).length);
  while((en.removedChunks || 0) < wantRemoved){
    spawnEnemyDebris(en, en.removedChunks || 0);
    en.removedChunks = (en.removedChunks || 0) + 1;
  }
  if(en.hitFlash > 0) en.hitFlash = Math.max(0, en.hitFlash - dt * 5);
}

// Set of block indices currently blown off the enemy's body.
function removedBlockSet(en){
  const set = new Set();
  const chunks = en.chunks || [];
  for(let c = 0; c < (en.removedChunks || 0) && c < chunks.length; c++){
    for(const bi of chunks[c]) set.add(bi);
  }
  return set;
}

// Spawn the debris burst for a chunk being blown off any enemy body.
function spawnEnemyDebris(en, chunkIndex){
  const chunks = en.chunks || [];
  const chunk = chunks[chunkIndex];
  if(!chunk || !chunk.length) return;
  const block = 4;
  const cols = en.chunkCols || Math.max(1, Math.floor((en.chunkW || getButtonWidth() - 4) / block));
  const w = en.chunkW !== undefined ? en.chunkW : (getButtonWidth() - 4);
  const h = en.chunkH !== undefined ? en.chunkH : (MENU_BAR_HEIGHT - 4);
  // Center of the removed chunk, relative to the enemy body
  let sx = 0, sy = 0;
  for(const bi of chunk){
    sx += (bi % cols) * block + block / 2;
    sy += Math.floor(bi / cols) * block + block / 2;
  }
  sx /= chunk.length; sy /= chunk.length;
  const wx = en.x + sx - w / 2;
  const wy = en.y + sy - h / 2;
  // A burst of little square chips that tumble outward with gravity
  const n = 2 + Math.floor(Math.random() * 3);
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 90;
    particles.push({
      x: wx, y: wy,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 25,
      life: 0.35 + Math.random() * 0.35, maxLife: 0.7,
      color: en.isCorrupted ? '#ff8888' : '#ffffff',
      size: 1.5 + Math.random() * 2,
      grav: 180, rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 12,
      square: true
    });
  }
  // Small impact spark at the chunk's old location
  spawnParticles(wx, wy, 2, '#ffffff');
}

function drawEnemies(){
  // Draw mages last so they always render on top of the swarm ("hovering above")
  const drawOrder = enemies.slice().sort((a, b) => {
    const aMage = a.type === 'macfile' || a.type === 'corruptedmacfile' ? 1 : 0;
    const bMage = b.type === 'macfile' || b.type === 'corruptedmacfile' ? 1 : 0;
    return aMage - bMage;
  });
  for(const en of drawOrder){
    const isTarget = player.currentTarget === en;
    if(isTarget){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2,2]);
      ctx.beginPath();
      ctx.arc(en.x, en.y, en.radius+6, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
    
    // Draw using enemy type
    const type = ENEMY_TYPES[en.type];
    if(type && type.draw){
      type.draw(en);
    }
    
    // Shielded enemies (Mac File aura): black ring, Mac 1.0 style
    if(en.shielded){
      ctx.save();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(en.x, en.y, en.radius + 5, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
    
    // HP bar for rushing enemies and stage 2 mages
    if(en.state === 'rushing' || en.state === 'jumping' || en.type === 'macfile' || en.type === 'corruptedmacfile'){
      const hpPct = clamp(en.hp/en.maxHp,0,1);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(en.x-en.radius, en.y-en.radius-6, en.radius*2, 3);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(en.x-en.radius, en.y-en.radius-6, en.radius*2*hpPct, 3);
    }
  }
}

function drawPickups(){
  for(const p of pickups){
    const bob = Math.sin(performance.now()/300 + p.bob) * 3;
    const alpha = clamp(p.life/3, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(p.x, p.y + bob);
    
    if(p.type === 'mine'){
      // Draw mine as red circle with warning indicator
      ctx.fillStyle = '#ff0000';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, p.radius, 0, Math.PI*2);
      ctx.fill();
      
      // Draw warning symbol (X)
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-8, -8);
      ctx.lineTo(8, 8);
      ctx.moveTo(8, -8);
      ctx.lineTo(-8, 8);
      ctx.stroke();
    } else if(p.type === 'mem'){
      // Draw MEM drop as "+" symbol with thicker lines
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 8;
      ctx.fillRect(-3, -8, 6, 16); // Thicker vertical bar
      ctx.fillRect(-8, -3, 16, 6); // Thicker horizontal bar
    } else {
      // Draw IP drop as square (rotated diamond)
      ctx.rotate(Math.PI/4);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 8;
      ctx.fillRect(-5,-5,10,10);
    }
    
    ctx.restore();
  }
}

function drawCaches(){
  for(const c of caches){
    const urgent = c.life < 2;
    const blink = urgent ? (Math.sin(performance.now()/80) > 0) : true;
    if(!blink) continue;
    ctx.save();
    ctx.translate(c.x, c.y);
    // Visi On style file - simple rectangle
    ctx.fillStyle = '#000';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.rect(-12,-14,24,28);
    ctx.fill();
    ctx.stroke();
    // folded corner
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-12,-14);
    ctx.lineTo(0,-14);
    ctx.lineTo(-12,0);
    ctx.closePath();
    ctx.fill();
    // level indicator (number in center)
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px "DOS VGA", "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.level.toString(), 0, 0);
    // countdown ring (expiry)
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0,0,20,-Math.PI/2,-Math.PI/2 + (c.life/c.maxLife)*Math.PI*2);
    ctx.stroke();
    ctx.restore();
    
    // Draw decryption progress around you if being decrypted
    if(c.decrypting && c.decryptProgress < c.decryptTime){
      ctx.save();
      ctx.translate(player.x, player.y);
      const progress = c.decryptProgress / c.decryptTime;
      // Decryption ring
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#00ff00';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0,0,player.radius + 8,-Math.PI/2,-Math.PI/2 + progress*Math.PI*2);
      ctx.stroke();
      // Level indicator
      ctx.fillStyle = '#00ff00';
      ctx.font = 'bold 10px "DOS VGA", "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("LVL " + c.level, 0, -player.radius - 15);
      ctx.restore();
    }
  }
}

function drawBullets(){
  ctx.save();
  ctx.fillStyle = '#fff';
  for(const b of playerBullets){
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = '#ff0000'; // Enemy bullets are red so they read as danger
  for(const b of enemyBullets){
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawWindows(){
  for(const win of windows){
    ctx.save();
    if(windowImage && windowImage.complete && windowImage.naturalWidth > 0){
      ctx.drawImage(windowImage, win.x, win.y, win.width, win.height);
    } else {
      // Fallback if image fails to load
      ctx.fillStyle = '#808080';
      ctx.fillRect(win.x, win.y, win.width, win.height);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(win.x, win.y, win.width, win.height);
      // Draw simple window decoration
      ctx.fillStyle = '#606060';
      ctx.fillRect(win.x, win.y, win.width, 24);
      ctx.fillStyle = '#404040';
      ctx.fillRect(win.x + 4, win.y + 4, 20, 16);
    }
    
    // Stage 2: resize warning text
    if(gameState.currentStage === 2 && win.resizeState === 'warning'){
      ctx.save();
      ctx.font = 'bold 22px "DOS VGA", "Courier New", monospace';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('RESIZING...', win.x + win.width/2, win.y + win.height/2);
      ctx.restore();
    }
    ctx.restore();
  }
}

function drawWordWindowAttack() {
  if (!wordWindowAttack.active || !wordWindowAttack.window) return;
  
  const win = wordWindowAttack.window;
  
  // Draw typing text on the word window
  if (wordWindowAttack.phase === 'typing' || wordWindowAttack.phase === 'warning') {
    ctx.save();
    ctx.font = 'bold 28px "DOS VGA", "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // Text position with specified offsets, centered in the text area
    const textX = win.x + 20 + (win.width - 50) / 2; // Left offset + half of available width
    const textY = win.y + 44 + (win.height - 74) / 2; // Top offset + half of available height (44 + 30 = 74)
    
    ctx.fillText(wordWindowAttack.typedText, textX, textY);
    ctx.restore();
  }
  
  // Draw red warning line
  if (wordWindowAttack.phase === 'warning' || wordWindowAttack.phase === 'firing') {
    const centerX = win.x + win.width / 2;
    const centerY = win.y + win.height / 2;
    
    ctx.save();
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 5]);
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(wordWindowAttack.targetX, wordWindowAttack.targetY);
    ctx.stroke();
    ctx.restore();
  }
  
  // Draw laugh animation
  if (wordWindowAttack.phase === 'laughing') {
    const laughImage = wordWindowAttack.laughFrame === 1 ? laugh1Image : laugh2Image;
    
    // Shrink by 40% horizontally, stretch vertically by 15%
    const scaleX = 0.6; // 60% of original width
    const scaleY = 0.6 * 1.15; // 60% width stretched 15% vertically = 69% of original height
    const scaledWidth = win.width * scaleX;
    const scaledHeight = win.height * scaleY;
    const offsetX = (win.width - scaledWidth) / 2;
    const offsetY = (win.height - scaledHeight) / 2;
    
    ctx.save();
    if (laughImage && laughImage.complete && laughImage.naturalWidth > 0) {
      ctx.drawImage(laughImage, win.x + offsetX, win.y + offsetY, scaledWidth, scaledHeight);
    } else {
      // Fallback if images fail to load
      ctx.fillStyle = '#808080';
      ctx.fillRect(win.x + offsetX, win.y + offsetY, scaledWidth, scaledHeight);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(win.x + offsetX, win.y + offsetY, scaledWidth, scaledHeight);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('HAHA!', win.x + win.width/2, win.y + win.height/2);
    }
    ctx.restore();
  }
}

function drawWindowProjectiles() {
  for (const proj of windowProjectiles) {
    ctx.save();
    ctx.translate(proj.x + proj.width / 2, proj.y + proj.height / 2);
    ctx.rotate(proj.rotation);
    
    if (graphWindowImage && graphWindowImage.complete && graphWindowImage.naturalWidth > 0) {
      ctx.drawImage(graphWindowImage, -proj.width / 2, -proj.height / 2, proj.width, proj.height);
    } else {
      // Fallback
      ctx.fillStyle = '#808080';
      ctx.fillRect(-proj.width / 2, -proj.height / 2, proj.width, proj.height);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(-proj.width / 2, -proj.height / 2, proj.width, proj.height);
    }
    
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    const a = clamp(p.life/p.maxLife,0,1);
    ctx.save();
    ctx.globalAlpha = a;
    if(p.ring){
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.stroke();
    } else if(p.square){
      // Tumbling square chip
      ctx.translate(p.x, p.y);
      if(p.rot) ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawMarquee(){
  if(isDraggingUlt && player.ultCharge >= 500){
    const rx = Math.min(rmbDownX, mouse.x), ry = Math.min(rmbDownY, mouse.y);
    const rw = Math.abs(mouse.x - rmbDownX), rh = Math.abs(mouse.y - rmbDownY);
    const ready = player.ultCharge >= 500;
    ctx.save();
    ctx.strokeStyle = ready ? '#ffffff' : '#888888';
    ctx.fillStyle = ready ? 'rgba(255,255,255,0.15)' : 'rgba(136,136,136,0.15)';
    ctx.setLineDash([4,3]);
    ctx.lineWidth = 1;
    ctx.fillRect(rx,ry,rw,rh);
    ctx.strokeRect(rx,ry,rw,rh);
    ctx.restore();
  }
}

function drawPlayer(){
  // Visi On style simple cursor
  if(player.invuln > 0 && Math.floor(player.invuln*20)%2===0) return;

  // Draw charge indicator
  if(lmbDown && !isDraggingUlt){
    const held = performance.now() - lmbDownTime;
    if(held > CHARGE_THRESHOLD){
      const p = clamp((held-CHARGE_THRESHOLD)/(MAX_CHARGE-CHARGE_THRESHOLD),0,1);
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(player.x, player.y, 12 + p*10, 0, p*Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Draw line to target if exists
  if(player.currentTarget){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2,2]);
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.currentTarget.x, player.currentTarget.y);
    ctx.stroke();
    ctx.restore();
  }

  // Draw simple white cursor - point directly at target
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.aimAngle);
  
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  
  // Draw arrow pointing right (0 degrees in standard math)
  ctx.beginPath();
  ctx.moveTo(8, 0);
  ctx.lineTo(-5, -5);
  ctx.lineTo(-2, 0);
  ctx.lineTo(-5, 5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  
  ctx.restore();
}

function draw(){
  ctx.save();
  if(shake > 0 && SETTINGS.screenShake !== false){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  drawWallpaper();
  drawWindows();
  drawTrashCan();
  drawWordWindowAttack();
  drawDeadPixels(); // Draw dead pixel traps
  drawPickups();
  drawCaches();
  drawEnemies();
  drawBullets();
  drawWindowProjectiles();
  drawParticles();
  drawMarquee();
  drawPlayer();

  if(waveState === 'banner'){
    ctx.save();
    ctx.globalAlpha = clamp(bannerTimer,0,1);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px "DOS VGA", "Courier New", monospace';
    ctx.textAlign = 'center';
    
    // Draw black background behind text
    ctx.fillStyle = '#000';
    ctx.fillRect(W/2 - 280, H/2 - 80, 560, 160);
    
    ctx.fillStyle = '#fff';
    ctx.fillText('WAVE ' + wave + ' COMPLETE', W/2, H/2 - 20);
    ctx.font = '24px "DOS VGA", "Courier New", monospace';
    ctx.fillText('system update...', W/2, H/2 + 28);
    ctx.textAlign = 'left';
    ctx.restore();
  } else if(waveState === 'victory'){
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px "DOS VGA", "Courier New", monospace';
    ctx.textAlign = 'center';
    
    // Draw black background
    ctx.fillStyle = '#000';
    ctx.fillRect(W/2 - 400, H/2 - 100, 800, 200);
    
    ctx.fillStyle = '#00ff00';
    ctx.fillText(getStageName().toUpperCase() + ' ERA COMPLETE', W/2, H/2 - 30);
    ctx.font = '24px "DOS VGA", "Courier New", monospace';
    ctx.fillStyle = '#fff';
    if(gameState.currentStage < Object.keys(STAGE_CONFIG).length){
      ctx.fillText('Press R for the next stage', W/2, H/2 + 30);
    } else {
      ctx.fillText('You have mastered the GUI!', W/2, H/2 + 30);
      ctx.fillText('Press R for Main Menu', W/2, H/2 + 70);
    }
    ctx.textAlign = 'left';
    ctx.restore();
  }
  ctx.restore();
}

function loop(now){
  const dt = Math.min(0.05, (now-lastTime)/1000);
  lastTime = now;
  try {
    update(dt);
    draw();
    updateIpHud();
  } catch(err){
    // One bad frame shouldn't kill the whole loop
    console.error('Frame error:', err);
  }
  requestAnimationFrame(loop);
}

// ---------- Game Initialization ----------
function initGame(){
  const cursorStats = CURSOR_TYPES[player.cursorType];
  player.hp = player.maxHp = cursorStats.maxHp;
  player.ip = 0;
  player.ultCharge = 0;
  player.shieldActive = false;
  player.invuln = 2;
  player.pickupRadius = 30;
  player.basicDmgMult = player.chargeDmgMult = player.ultGainMult = player.ipGainMult = 1;
  player.armorPlating = 0;
  player.dodgeBuffer = 0;
  player.backupPower = 0;
  player.debounceWindow = 0;
  player.debounceTimer = 0;
  player.activeFirewall = false;
  player.chargedPierceBonus = 0;
  player.basicPierceChance = 0;
  player.cascadeChance = 0;
  player.antivirusDamage = 0;
  player.antivirusRadius = 0;
  player.systemBeaconRadius = 0;
  player.fasterDecrypt = 0;
  player.ipDropRateBonus = 0;
  player.memDropRateBonus = 0;
  player.hasSplitShot = false;
  player.hasRicochet = false;
  player.basicCooldownTimer = 0;
  player.chargeCooldownTimer = 0;
  player.basicCooldownReduction = 0;
  player.chargeCooldownReduction = 0;
  enemies = []; playerBullets = []; enemyBullets = []; particles = []; pickups = []; caches = []; deadPixels = []; windows = [];
  cacheSpawnTimer = 6 + Math.random()*4;
  gameState.currentStage = 1; // Fresh run always starts at stage 1
  resizeCanvasForGameplay(); // Stage-1 canvas dims (640x400)
  trashCan = null;
  kills = 0; wave = 1; waveState = 'fighting';
  killTextEl.textContent = 'Kills 0';
  gameOver = false;
  overlay.classList.add('hidden');
  upgradeOverlay.classList.add('hidden');
  player.invuln = 1.5; // Invulnerability at game start
  // Don't spawn windows here - let pointer lock handler do it
  // spawnWindows();
  
  console.log('=== GAME INIT DEBUG ===');
  console.log('Game state:', gameState.currentState);
  console.log('Wave:', wave);
  console.log('Wave state:', waveState);
  console.log('Canvas size:', canvas.width, canvas.height);
  console.log('W/H variables:', W, H);
}

// ---------- Restart / Main Menu ----------
restartBtn.addEventListener('click', () => {
  showMainMenu(); // Return to main menu instead of restarting
});

updateIpHud();
loadWindowImage();

// Hide lock overlay initially since we start with main menu
lockOverlay.classList.add('hidden');

initMainMenu(); // Initialize main menu system

// Add resize listener for main menu
window.addEventListener('resize', () => {
  if(gameState.currentState === 'mainMenu'){
    resizeCanvasForMainMenu();
    scaleMainMenu();
  }
});


requestAnimationFrame(loop);

// DEV/testing hook - reachable only from the browser console, harmless in the packaged app
window.__dd = {
  state(){
    return {
      stage: gameState.currentStage,
      wave: wave,
      waveState: waveState,
      pointerLocked: pointerLocked,
      gameOver: gameOver,
      waveTimer: waveTimer,
      enemies: enemies.length,
      wads: enemyBullets.filter(b => b.type === 'trashwad').length,

    };
  },
  setPointerLocked: (v) => { pointerLocked = v; },
  setWave: (v) => { wave = v; },
  beginStage: beginStage,
  startWave: startWave,
  get waveSpawnCount(){ return enemiesToSpawn; },
  get filesSpawnedThisWave(){ return filesSpawnedThisWave; },
  set filesSpawnedThisWave(v){ filesSpawnedThisWave = v; },
  get killsThisWave(){ return killsThisWave; },
  set killsThisWave(v){ killsThisWave = v; },
  get cacheSpawnTimer(){ return cacheSpawnTimer; },
  set cacheSpawnTimer(v){ cacheSpawnTimer = v; },
  spawnMacFile: spawnMacFile,
  spawnCorruptedMacFile: spawnCorruptedMacFile,
  spawnMenuButton: spawnMenuButton,
  makeTrashCan: makeTrashCan,
  player: player,
  damageEnemy: damageEnemy,
  // Live getters - the game reassigns these arrays via .filter(), so a direct
  // reference would go stale
  get enemies(){ return enemies; },
  get pickups(){ return pickups; },
  get caches(){ return caches; },
  get enemyBullets(){ return enemyBullets; },
  get playerBullets(){ return playerBullets; },
  get windows(){ return windows; },
  get deadPixels(){ return deadPixels; },
  get particles(){ return particles; },
  get canvasW(){ return W; },
  get canvasH(){ return H; },
  get menuButtons(){ return getMenuButtons(); },
  get menuBarY(){ return getMenuBarY(); },
  getTrashCan: () => trashCan,
  spawnWindows: spawnWindows,
  findTarget: findTarget,
  cycleTarget: cycleTarget
};
})();

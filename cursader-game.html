<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desktop Dungeon</title>
<style>
  :root{
    --bezel: #808080;
    --bezel-dark: #404040;
    --screen-bg: #000000;
    --hp-color: #ffffff;
    --ip-color: #ffffff;
    --ult-color: #ffffff;
    --accent: #ffffff;
  }
  @font-face {
    font-family: 'DOS VGA';
    src: url('assets/PerfectDOSVGA437.ttf') format('truetype');
  }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: #202020;
    font-family: "DOS VGA", "Courier New", monospace;
    color:#ffffff;
    overflow:hidden;
  }
  #appRoot{
    position: fixed;
    top: 50%;
    left: 50%;
    transform-origin: center center;
  }
  #monitor{
    background: linear-gradient(180deg,var(--bezel),var(--bezel-dark));
    border-radius: 8px;
    padding: 16px 16px 20px 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,.8), inset 0 2px 0 rgba(255,255,255,.2);
  }
  #screenWrap{
    position:relative;
    border: 4px solid #000;
    border-radius: 2px;
    box-shadow: inset 0 0 20px rgba(0,0,0,.8);
    overflow:hidden;
  }
  canvas{
    display:block;
    background: var(--screen-bg);
    cursor:none;
    image-rendering: pixelated;
  }
  #hud{
    box-sizing: border-box;
    width: 680px;
    max-width: 100%;
    margin: 0 auto 10px auto;
    padding:6px 10px;
    display:flex; gap:5px; align-items:center; flex-wrap:wrap;
    font-size:20px;
    background: rgba(0,0,0,.85);
    border: 2px solid #000;
    box-shadow: 0 4px 10px rgba(0,0,0,.5);
    letter-spacing:0px;
    font-family: "DOS VGA", "Courier New", monospace;
  }
  
  #hud.hidden{ display:none; }
  .bar-label{ width:50px; text-transform:uppercase; font-weight:700; opacity:.9; }
  .ip-group .bar-label{ width:auto; }
  .mem-group .bar-label{ width:auto; }
  .purge-group .bar-label{ width:auto; }
  .bar{
    width:100px; height:12px; background:rgba(255,255,255,.2);
    border:1px solid rgba(255,255,255,.5); overflow:hidden;
  }
  .bar > div{ height:100%; width:0%; transition: width .08s linear; }
  #hpFill{ background: #ffffff; }
  #ultFill{ background: #ffffff; }
  #ultBarWrap.ready .bar{ box-shadow: 0 0 8px rgba(255,255,255,.8); animation: pulseUlt 1s infinite; }
  @keyframes pulseUlt{ 0%,100%{ opacity:1;} 50%{ opacity:.5; } }
  .stat-group{ display:flex; align-items:center; gap:1px; }
  .ip-group{ gap:0; }
  .mem-group{ gap:10px; margin-right:25px; }
  .purge-group{ gap:10px; margin-right:25px; }
  #ipText{
    font-family: "DOS VGA", "Courier New", monospace;
    font-size:18px; font-weight:700; letter-spacing:0px;
  }
  #spellName{
    font-weight:700; color: #ffffff; text-shadow:none;
  }
  #statusRight{
    margin-left:auto; display:flex; gap:12px; font-weight:700; opacity:.9;
  }
  #floatLayer{ position:absolute; inset:0; pointer-events:none; }
  
  /* Main Menu Styles */
  #mainMenu{
    position:absolute; inset:0;
    background: #000080; /* Visi On Era navy blue */
    font-family: "DOS VGA", "Courier New", monospace;
    z-index: 1000; /* Ensure it's above everything */
  }
  
  #mainMenu.hidden{ display:none; }
  
  #mainMenuContainer{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    background: url('assets/MainMenuBackground.png') no-repeat center center;
    background-size: contain;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
  }
  
  #cursaderLogo{
    position: absolute;
    top: 170px; /* Final position */
    left: 50%;
    transform: translateX(-50%) scale(0.65); /* 35% smaller */
    width: 739px;
    height: 195px;
    background-image: url('assets/Cursader_Logo.png');
    background-size: 38428px 195px; /* 52 frames * 739px width, 195px height */
    image-rendering: pixelated;
    opacity: 0; /* Start hidden */
    transition: opacity 0.3s ease-in; /* Smooth fade in */
  }
  
  #newsFeed{
    position: absolute;
    top: 210px; /* Moved up 20px more (was 230px) */
    transform: scale(2.28, 2.4); /* 2.4x tall, 5% thinner (2.28x wide) */
    transform-origin: top left;
    width: 300px; /* Layout size stays 300x500; the 2x is visual only so scroll math is unchanged */
    height: 500px;
    background-image: url('assets/News_Feed_Background.png?v=2');
    background-size: contain;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    left: 0; /* Will be positioned dynamically */
  }
  
  #newsFeedSubWindow{
    position: absolute;
    /*
      This is the little clipping window the notices scroll inside of.
      It must line up with the light-blue dotted square drawn in
      News_Feed_Background.png, otherwise notices bleed out past the
      dotted border or get cut off by it.

      The background is a 436x793 image shown with `background-size: contain`
      inside this 300x500 box, so it is scaled by 500/793 (~0.6305) and
      anchored at the top-left (background-position defaults to 0% 0%).

      In the source image the dotted square's inside edge runs from
      x=43..368 and y=66..525. Multiplying those by 500/793 gives:
        left   = 43 * 500/793 = 27.1px
        top    = 66 * 500/793 = 41.6px
        width  = 326 * 500/793 = 205.5px
        height = 460 * 500/793 = 290.0px
    */
    left: 27.1px;
    top: 41.6px;
    width: 195.5px; /* right edge pulled in 10px to shrink the clip box */
    height: 290px;
    overflow: hidden; /* Hide content outside bounds */
  }
  
  #noticeList{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  
  .noticeBox{
    position: absolute;
    left: 0;
    top: 0;
    cursor: pointer;
    user-select: none;
  }
  .noticeImg{
    display: block;
    width: auto;
    height: auto;
    image-rendering: pixelated;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    vertical-align: top !important;
    line-height: 0 !important;
    font-size: 0 !important;
  }
  .noticeLabel{
    position: absolute;
    left: 71px; /* pushed toward the left edge so it stays inside the clip box */
    top: calc(50% + 5px); /* nudged down ~5px from vertical center */
    transform: translateY(-50%);
    color: #000;
    font-family: "DOS VGA", "Courier New", monospace;
    font-size: 14px;
    white-space: nowrap;
    pointer-events: none;
  }
  .noticeBox:hover .noticeLabel{
    color: #2827ed;
  }
  .noticeNewBadge{
    position: absolute;
    left: 25px;
    top: calc(50% - 8px);
    transform: translateY(-50%);
    z-index: 2;
    color: #ff0000;
    font-family: "DOS VGA", "Courier New", monospace;
    font-size: 16px;
    font-weight: 700;
    text-shadow:
      -1px -1px 0 #000,
       1px -1px 0 #000,
      -1px  1px 0 #000,
       1px  1px 0 #000;
    white-space: nowrap;
    pointer-events: none;
  }
  
  #scrollBar{
    position: absolute;
    inset: 0; /* full-frame sprite aligned with the feed background */
    background-image: url('assets/News_Feed_Scroll_Bar.png');
    background-size: contain;
    background-position: top left;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    pointer-events: none;
  }
  
  #scrollKnob{
    position: absolute;
    inset: 0; /* full-frame sprite; thumb is drawn near the top of the track */
    background-image: url('assets/News_Feed_Scroll_Knob.png');
    background-size: contain;
    background-position: top left;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    pointer-events: none;
  }
  
  #statusReport{
    position: absolute;
    transform: scale(1.68);
    transform-origin: top left;
  }
  #statusReportBar{
    position: absolute;
    left: 0;
    top: 0;
    width: 754px;
    height: 68px;
    background-image: url('assets/Status_Report_Bar.png?v=2');
    background-size: contain;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }
  .statValue{
    position: absolute;
    top: 38px;
    transform: translateX(-50%);
    color: #63e763;
    font-family: "DOS VGA", "Courier New", monospace;
    font-size: 15px;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
  }
  .statusArrowWrap{
    position: absolute;
    width: 44px;
    height: 52px;
    overflow: hidden;
    cursor: pointer;
    image-rendering: pixelated;
    transform: scale(0.95); /* 5% smaller */
    transform-origin: top left;
  }
  .statusArrowWrap img{
    position: absolute;
    top: 0;
    width: 92px;
    height: 52px;
    max-width: none;
    image-rendering: pixelated;
  }
  #statusUpButton{ left: -2px; }
  #statusDownButton{ left: -48px; }
  
  #leaderboards{
    position: absolute;
    width: 490px;
    height: 722px;
    background-image: url('assets/Leaderboards.png?v=3');
    background-size: contain;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    transform: scale(1.311, 1.0944); /* 15% wider, 20% taller, 5% shorter, 5% narrower */
    transform-origin: top left;
  }
  #leaderboardScrollBar{
    position: absolute;
    left: 24px;
    top: 92px;
    width: 22px;
    height: 609px;
    background-image: url('assets/News_Feed_Scroll_Bar.png');
    background-size: 384px 1028px;
    background-position: -336px -82px;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    pointer-events: none;
  }
  #leaderboardScrollKnob{
    position: absolute;
    inset: 0;
    background-image: url('assets/News_Feed_Scroll_Knob.png');
    background-size: 384px 1028px;
    background-position: -336px -82px;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    pointer-events: none;
  }
  #leaderboardClip{
    position: absolute;
    left: 60px;
    top: 92px;
    width: 364px;
    height: 609px;
    box-sizing: border-box;
    overflow: hidden;
  }
  #leaderboardList{
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .lbRow{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 6px 12px 6px 42px; /* 30px extra left padding */
    border-bottom: 1px dashed #42e2e8;
    color: #fff;
    font-family: "DOS VGA", "Courier New", monospace;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .lbRow:last-child{ border-bottom: none; }
  .lbName{ font-size: 42px; line-height: 1; min-width: 100px; text-align: left; }
  .lbCursor{ width: 40px; height: 40px; border: 2px dashed #888; box-sizing: border-box; flex-shrink: 0; }
  .lbTime{ font-size: 28px; line-height: 1; min-width: 100px; text-align: right; }
  
  .menuButton{
    position: absolute;
    cursor: pointer;
    image-rendering: pixelated;
    /* Let images use their natural dimensions for proper scaling */
    max-width: none;
    max-height: none;
    /* Ensure buttons are positioned relative to the container */
    left: 0;
    top: 0;
    transition: none; // We'll handle transitions manually with image swapping
  }
  
  .menuButton:hover{
    /* Hover state will be handled by image swapping */
  }
  
  .menuButton:active{
    /* Active state will be handled by image swapping */
  }
  
  #startButton{
    /* Position will be set based on original button location */
  }
  
  #settingsButton{
    /* Position will be set based on original button location */
  }
  
  #achievementsButton{
    /* Position will be set based on original button location */
  }
  
  #quitButton{
    /* Position will be set based on original button location */
  }
  .modal{
    position:absolute; inset:0;
    background: rgba(0,0,0,.9);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; font-size:24px;
    font-family: "DOS VGA", "Courier New", monospace;
  }
  .modal.hidden{ display:none; }
  #lockOverlay{ cursor:pointer; z-index:5; }
  #noticeModal{
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent; /* main menu shows through as the backdrop */
  }
  #noticeModalBox{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0; /* keep the 1920px design layout from being squeezed by the flex container */
    image-rendering: pixelated;
    background-size: contain;
    background-position: center center;
    background-repeat: no-repeat;
    color: #fff;
    font-family: "DOS VGA", "Courier New", monospace;
  }
  /* Modal is laid out at its native 1920x1080 design size and scaled as a
     whole (background + text together) to fit the screen area, so the text
     always stays in proportion with the window image at any resolution. */
  #noticeModalPage{
    flex: 1;
    width: 100%;
    box-sizing: border-box;
    padding: 18px 64px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 32px;
    white-space: normal;
    overflow: hidden;
  }
  #noticeModalPage .pageTitle{
    font-size: 46px;
    font-weight: 700;
    color: #fff;
    text-shadow: 2px 2px #000;
    letter-spacing: 1px;
    margin-bottom: 30px;
  }
  #noticeModalPage .pageBody{
    width: 100%;
    max-width: 1780px;
    text-align: left;
    line-height: 1.55;
  }
  #noticeModalPage .muted{ opacity: .55; }
  #noticeModalPage .kvRow{
    display: flex;
    gap: 21px;
    margin: 18px 0;
    text-align: left;
  }
  #noticeModalPage .kvKey{
    flex: 0 0 205px;
    font-weight: 700;
    color: #63e763;
    text-align: right;
    white-space: nowrap;
  }
  #noticeModalPage .kvDesc{ flex: 1; }
  #noticeModalPage .upRow{ margin: 18px 0; text-align: left; }
  #noticeModalPage .upName{ font-weight: 700; color: #63e763; }
  #noticeModalPage .upGroup{
    color: #42e2e8;
    font-weight: 700;
    margin: 18px 0 6px;
    text-align: left;
  }
  #noticeModalPage .pickupRow{
    display: flex;
    align-items: center;
    gap: 27px;
    margin: 26px 0;
    text-align: left;
  }
  #noticeModalPage .pickupIcon{
    width: 96px;
    height: 96px;
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.45));
  }
  #noticeModalPage .pickupName{ font-weight: 700; color: #63e763; }
  /* colon after every green label */
  #noticeModalPage .kvKey::after,
  #noticeModalPage .upName::after,
  #noticeModalPage .pickupName::after{ content: ':'; }
  #noticeModalPage .credUrl{ color: #42e2e8; }
  #noticeModalPage a.credUrl{ text-decoration: underline; }
  #noticeModalPage .upGroup.gapTop{ margin-top: 63px; }
  #noticeModalNav{
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 42px;
  }
  #noticeModalNav button{
    background: #c0c0c0;
    border: 2px solid #000;
    color: #000;
    font-size: 44px;
    line-height: 1;
    font-weight: 700;
    padding: 6px 30px;
    cursor: pointer;
    font-family: "DOS VGA", "Courier New", monospace;
  }
  #noticeModalNav button:active{ transform: translateY(1px); }
  #noticeModalNav button:disabled{ opacity: .35; cursor: default; }
  #pageIndicator{
    font-size: 32px;
    color: #fff;
    text-shadow: 2px 2px #000;
    min-width: 100px;
    text-align: center;
  }
  /* Settings menu (reuses the modal frame + scaling pattern) */
  #settingsModal{
    position: absolute;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  #settingsBox{
    position: relative;
    flex-shrink: 0;
    width: 1920px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: url('assets/MainMenuModal.png') no-repeat center center;
    background-size: contain;
    color: #fff;
    font-family: "DOS VGA", "Courier New", monospace;
    transform-origin: center center;
  }
  #settingsPage{
    flex: 1;
    width: 100%;
    box-sizing: border-box;
    padding: 18px 64px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 32px;
    overflow: hidden;
  }
  #settingsPage .pageTitle{
    font-size: 46px;
    font-weight: 700;
    color: #fff;
    text-shadow: 2px 2px #000;
    letter-spacing: 1px;
    margin-bottom: 30px;
  }
  #settingsPage .pageBody{
    width: 100%;
    max-width: 1780px;
    text-align: left;
    line-height: 1.55;
  }
  #settingsPage .upGroup{
    color: #42e2e8;
    font-weight: 700;
    margin: 18px 0 6px;
    text-align: left;
  }
  #settingsPage .kvRow{
    display: flex;
    gap: 21px;
    margin: 18px 0;
    text-align: left;
  }
  #settingsPage .kvKey{
    flex: 0 0 260px;
    font-weight: 700;
    color: #63e763;
    text-align: right;
    white-space: nowrap;
  }
  #settingsPage .kvKey::after{ content: ':'; }
  #settingsPage .kvDesc{ flex: 1; }
  #settingsPage .settingRow{
    display: flex;
    align-items: center;
    gap: 30px;
    margin: 26px 0;
    text-align: left;
  }
  #settingsPage .settingLabel{
    flex: 0 0 260px;
    font-weight: 700;
    color: #63e763;
    text-align: right;
    white-space: nowrap;
  }
  #settingsPage .settingLabel::after{ content: ':'; }
  #settingsPage input[type="range"]{
    flex: 1;
    height: 10px;
    accent-color: #63e763;
  }
  #settingsPage .settingVal{
    flex: 0 0 100px;
    text-align: left;
    color: #42e2e8;
  }
  #settingsPage select{
    font-family: "DOS VGA", "Courier New", monospace;
    font-size: 28px;
    background: #000;
    color: #fff;
    border: 2px solid #42e2e8;
    padding: 6px 12px;
    max-width: 760px;
  }
  #settingsPage .settingNote{
    color: #9fb3c8;
    font-size: 26px;
    margin: 20px 0;
    text-align: left;
  }
  #settingsPage .toggleBtn{
    background: #c0c0c0;
    border: 2px solid #000;
    color: #000;
    font-size: 28px;
    font-weight: 700;
    padding: 6px 26px;
    cursor: pointer;
    font-family: "DOS VGA", "Courier New", monospace;
  }
  #settingsPage .toggleBtn:active{ transform: translateY(1px); }
  #settingsPage .toggleBtn.active{ background: #63e763; color: #000; }
  #settingsNav{
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 42px;
  }
  #settingsNav button{
    background: #c0c0c0;
    border: 2px solid #000;
    color: #000;
    font-size: 44px;
    line-height: 1;
    font-weight: 700;
    padding: 6px 30px;
    cursor: pointer;
    font-family: "DOS VGA", "Courier New", monospace;
  }
  #settingsNav button:active{ transform: translateY(1px); }
  #settingsNav button:disabled{ opacity: .35; cursor: default; }
  #settingsPageInd{
    font-size: 32px;
    color: #fff;
    text-shadow: 2px 2px #000;
    min-width: 100px;
    text-align: center;
  }
  .modal h1{ margin:0; font-size:40px; letter-spacing:0px; color:#fff; font-family: "DOS VGA", "Courier New", monospace; }
  .modal button{
    background: #ffffff;
    border:2px solid #000; color:#000;
    padding:12px 24px; font-size:24px; font-weight:700; cursor:pointer;
    font-family: "DOS VGA", "Courier New", monospace;
  }
  .modal button:active{ transform: translateY(1px); }
  #upgradeCards{ display:flex; gap:12px; }
  #cursorSelection{ display:flex; gap:12px; }
  .upgradeCard{
    background: #000;
    border:2px solid #fff;
    padding:12px 16px; width:160px; cursor:pointer;
    text-align:left; transition: transform .12s ease, box-shadow .12s ease;
    font-family: "DOS VGA", "Courier New", monospace;
  }
  .upgradeCard:hover{ transform: translateY(-2px); box-shadow: 0 4px 8px rgba(255,255,255,.3); }
  .cursorCard{
    background: #000;
    border:2px solid #fff;
    padding:12px 16px; width:180px; cursor:pointer;
    text-align:left; transition: transform .12s ease, box-shadow .12s ease;
    font-family: "DOS VGA", "Courier New", monospace;
  }
  .cursorCard:hover{ transform: translateY(-2px); box-shadow: 0 4px 8px rgba(255,255,255,.3); }
  .cursorCard.selected{ border-color: #00ff00; }
  .upgradeCard .u-path{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .upgradeCard .u-path.offensive{ color: #ff4444; }
  .upgradeCard .u-path.defensive{ color: #44ff44; }
  .upgradeCard .u-path.utility{ color: #4444ff; }
  .upgradeCard .u-title{ font-weight:700; color:#fff; font-size:18px; margin-bottom:6px; }
  .upgradeCard .u-desc{ font-size:14px; opacity:.8; line-height:1.3; }
  #title{ text-align:center; margin-bottom:8px; font-size:18px; letter-spacing:1px; opacity:.8; font-family: "DOS VGA", "Courier New", monospace; }
  #title.hidden{ display:none; }
</style>
</head>
<body>

<div id="appRoot">
  <div id="title">DESKTOP DUNGEON - Visi On Era (1983)</div>
  <div id="hud">
    <div class="stat-group mem-group">
      <div class="bar-label">MEM</div>
      <div class="bar"><div id="hpFill"></div></div>
    </div>
    <div class="stat-group purge-group" id="ultBarWrap">
      <div class="bar-label">PURGE</div>
      <div class="bar"><div id="ultFill"></div></div>
    </div>
    <div class="stat-group ip-group">
      <div class="bar-label">IP:</div>
      <div id="ipText">000:000:000</div>
    </div>
    <div id="spellName">SPELL: -</div>
    <div id="statusRight">
      <span id="waveText">Wave 1</span>
      <span id="killText">Kills 0</span>

<script>
// Auto-fit: scales the whole #appRoot (title + monitor + controls) down to
// whatever window size actually exists, so nothing is ever clipped or needs
// scrolling, at any screen resolution or aspect ratio. Runs independently of
// the game logic below - purely a presentation-layer fit.
(function(){
  "use strict";
  var root = document.getElementById('appRoot');
  var naturalW = 0, naturalH = 0;

  function measureNatural(){
    var prevTransform = root.style.transform;
    root.style.transform = 'translate(-50%, -50%)';
    var r = root.getBoundingClientRect();
    naturalW = r.width;
    naturalH = r.height;
    root.style.transform = prevTransform;
  }

  function applyScale(){
    var margin = 16; // small breathing room from the window edge
    var availW = window.innerWidth - margin;
    var availH = window.innerHeight - margin;
    var scale = Math.min(availW / naturalW, availH / naturalH, 1);
    if(!isFinite(scale) || scale <= 0) scale = 1;
    root.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
  }

  function recalc(){
    measureNatural();
    applyScale();
  }

  window.addEventListener('resize', applyScale);
  recalc();
  window.addEventListener('load', recalc);
})();
</script>

let logoAnimationId = null;

let logoAnimationPlayed = false; // Track if animation has played
const LOGO_FRAMES = 52; // Updated to 52 frames
const LOGO_FRAME_WIDTH = 739;
const LOGO_HEIGHT = 195;
const LOGO_FPS = 12; // Frames per second

function startLogoAnimation(){
  // Only play animation if it hasn't been played yet
  if(logoAnimationPlayed) return; // Already played, do nothing
  
  if(logoAnimationId) return; // Already running
  
  // Add 1 second delay before starting animation
  logoAnimationId = setTimeout(() => {
    logoAnimationId = null; // Clear the delay timeout
    
    // Show logo when animation starts
    cursaderLogo.style.opacity = "1";
    
    logoFrame = 0;
    const frameDuration = 1000 / LOGO_FPS;
    
    function animateLogo(){
      // Update background position to show current frame
      const xPos = -(logoFrame * LOGO_FRAME_WIDTH);
      cursaderLogo.style.backgroundPosition = `${xPos}px 0px`;
      
      // Advance frame
      logoFrame++;
      
      // Check if animation is complete
      if(logoFrame >= LOGO_FRAMES){
        // Switch to stationary image on final frame
        cursaderLogo.style.backgroundImage = "url('assets/Cursader_Logo_Stationary.png')";
        cursaderLogo.style.backgroundSize = "739px 195px"; // Single frame size
        cursaderLogo.style.backgroundPosition = "0px 0px";
        logoAnimationPlayed = true; // Mark as played
        logoAnimationId = null;
        return; // Stop animation
      }
      
      logoAnimationId = setTimeout(animateLogo, frameDuration);
    }
    
    animateLogo();
  }, 1000); // 1 second delay
}

function stopLogoAnimation(){
  if(logoAnimationId){
    clearTimeout(logoAnimationId);
    logoAnimationId = null;
  }
  // Always show stationary image after animation has been played
  if(logoAnimationPlayed){
    cursaderLogo.style.backgroundImage = "url('assets/Cursader_Logo_Stationary.png')";
    cursaderLogo.style.backgroundSize = "739px 195px";
    cursaderLogo.style.backgroundPosition = "0px 0px";

}

// ---------- "New!" badge tracking ----------
// A notice shows a "New!" badge over its file icon until the player has
// viewed every page listed in its `newPages` at the current `newVersion`.
// Developers flag fresh content by adding `newPages: [n], newVersion: v` to
// a notice entry; future cursor-unlock / enemy-discovery code will do the
// same at runtime. Seen state is persisted so badges stick across sessions
// until the new page is actually opened.
function loadSeenPages(){
  try{ return JSON.parse(localStorage.getItem('desktopDungeonSeenPages')) || {}; }
  catch(e){ return {}; }
}
let seenPages = loadSeenPages();

function saveSeenPages(){
  try{ localStorage.setItem('desktopDungeonSeenPages', JSON.stringify(seenPages)); }catch(e){}
}

function hasUnseenNew(noticeIndex){
  const data = NOTICE_DATA[noticeIndex];
  if(!data || !data.newPages || !data.newPages.length) return false;
  const version = data.newVersion || 1;
  return data.newPages.some(p => {
    const seen = seenPages[noticeIndex] && seenPages[noticeIndex][p];
    return !seen || seen < version;
  });
}

function markPageSeen(noticeIndex, pageIndex){
  const data = NOTICE_DATA[noticeIndex];
  if(!data || !data.newPages || data.newPages.indexOf(pageIndex) < 0) return;
  if(!seenPages[noticeIndex]) seenPages[noticeIndex] = {};
  seenPages[noticeIndex][pageIndex] = data.newVersion || 1;
  saveSeenPages();
  updateNewBadges();
}

function updateNewBadges(){
  document.querySelectorAll('.noticeBox').forEach(box => {
    const idx = parseInt(box.dataset.noticeIndex, 10);
    const shouldShow = hasUnseenNew(idx);
    let badge = box.querySelector('.noticeNewBadge');
    if(shouldShow && !badge){
      badge = document.createElement('span');
      badge.className = 'noticeNewBadge';
      badge.textContent = 'New!';
      box.appendChild(badge);
    } else if(!shouldShow && badge){
      badge.remove();
    }
  });
}

function initNewsFeed(){
  // Create notice boxes dynamically - all using Notice1.png
  noticeList.innerHTML = '';
  
  // Load Notice1.png to get natural dimensions
  const testImg = new Image();
  testImg.src = NOTICE_IMG;
  testImg.onload = function(){
    noticeHeight = testImg.naturalHeight; // Use natural height without extra spacing
    
    // Preload the pressed image so the swap is instant on mousedown
    const pressedImg = new Image();
    pressedImg.src = NOTICE_PRESSED_IMG;
    
    for(let i = 1; i <= totalNotices; i++){
      const position = (i - 1) * noticeHeight;

      const wrapper = document.createElement('div');
      wrapper.className = 'noticeBox';
      wrapper.style.top = `${position}px`; // Stack edge to edge - NO SPACING

      const notice = document.createElement('img');
      notice.className = 'noticeImg';
      notice.src = NOTICE_IMG; // Use Notice1.png for all
      notice.draggable = false;

      const label = document.createElement('span');
      label.className = 'noticeLabel';
      label.textContent = (NOTICE_DATA[i - 1] && NOTICE_DATA[i - 1].title) || '';

      wrapper.appendChild(notice);
      wrapper.appendChild(label);
      wrapper.dataset.noticeIndex = i - 1;

      // "New!" badge over the green file icon until new pages are viewed
      if(hasUnseenNew(i - 1)){
        const badge = document.createElement('span');
        badge.className = 'noticeNewBadge';
        badge.textContent = 'New!';
        wrapper.appendChild(badge);
      }

      // Button behavior: show pressed image while held, open modal on release
      wrapper.addEventListener('mousedown', ()=>{
        notice.src = NOTICE_PRESSED_IMG;
      });
      wrapper.addEventListener('mouseup', ()=>{
        notice.src = NOTICE_IMG;
        openNoticeModal(i - 1);
      });
      wrapper.addEventListener('mouseleave', ()=>{
        notice.src = NOTICE_IMG;
      });

      noticeList.appendChild(wrapper);
    }
    
    // Add scroll wheel event listener
    newsFeed.addEventListener('wheel', handleNewsFeedScroll);
    
    // Update scroll knob position
    updateScrollKnob();
  };
}

// Modal design size (1920x1080, matching MainMenuModal.png). The box is laid
// out at this fixed size and then scaled as a whole against the screen area
// (layout units, like scaleMainMenu), so the background and the text stay in
// proportion at any window resolution or aspect ratio.
const NOTICE_MODAL_W = 1920;
const NOTICE_MODAL_H = 1080;

function fitNoticeModal(){
  if(!noticeModal) return;
  const box = noticeModal.querySelector('#noticeModalBox');
  // Fit against the main menu's screen area (falls back to #screenWrap),
  // using offsetWidth/Height so the outer #appRoot auto-fit scale isn't
  // applied twice and the modal always fits inside the screen.
  const host = mainMenu || document.getElementById('screenWrap');
  if(!host) return;
  const s = Math.min(
    (host.offsetWidth * 0.85) / NOTICE_MODAL_W,
    (host.offsetHeight * 0.85) / NOTICE_MODAL_H
  );
  box.style.transform = `scale(${s})`;
}

window.addEventListener('resize', fitNoticeModal);
window.addEventListener('resize', fitSettingsModal);

function openNoticeModal(index){
  closeNoticeModal(); // Remove any existing modal first

  activeNoticeIndex = index;
  activePageIndex = 0;

  noticeModal = document.createElement('div');
  noticeModal.id = 'noticeModal';
  noticeModal.innerHTML = `
    <div id="noticeModalBox">
      <div id="noticeModalPage"></div>
      <div id="noticeModalNav">
        <button id="noticePrev" aria-label="Previous page">&lt;</button>
        <span id="pageIndicator"></span>
        <button id="noticeNext" aria-label="Next page">&gt;</button>
      </div>
    </div>
  `;
  document.body.appendChild(noticeModal);

  const box = noticeModal.querySelector('#noticeModalBox');
  box.style.width = NOTICE_MODAL_W + 'px';
  box.style.height = NOTICE_MODAL_H + 'px';
  box.style.backgroundImage = "url('assets/MainMenuModal.png')";
  fitNoticeModal();

  noticeModal.querySelector('#noticePrev').addEventListener('click', ()=> changeNoticePage(-1));
  noticeModal.querySelector('#noticeNext').addEventListener('click', ()=> changeNoticePage(1));

  renderNoticePage();
}

function changeNoticePage(delta){
  const data = NOTICE_DATA[activeNoticeIndex];
  if(!data) return;
  const next = activePageIndex + delta;
  if(next < 0 || next >= data.pages.length) return;
  activePageIndex = next;
  renderNoticePage();
}

function renderNoticePage(){
  if(!noticeModal) return;
  const data = NOTICE_DATA[activeNoticeIndex] || { pages: [''] };
  noticeModal.querySelector('#noticeModalPage').innerHTML = data.pages[activePageIndex] || '';
  noticeModal.querySelector('#noticePrev').disabled = (activePageIndex <= 0);
  noticeModal.querySelector('#noticeNext').disabled = (activePageIndex >= data.pages.length - 1);
  noticeModal.querySelector('#pageIndicator').textContent = `${activePageIndex + 1} / ${data.pages.length}`;
  markPageSeen(activeNoticeIndex, activePageIndex);
}

function closeNoticeModal(){
  if(noticeModal){
    noticeModal.remove();
    noticeModal = null;
  }
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){ closeNoticeModal(); closeSettingsModal(); }
});

function handleNewsFeedScroll(e){
  const delta = e.deltaY;
  const scrollAmount = delta > 0 ? newsFeedScrollSpeed : -newsFeedScrollSpeed;
  
  // Calculate max scroll offset
  const totalNoticeHeight = totalNotices * noticeHeight;
  const subWindowHeight = newsFeedSubWindow.offsetHeight;
  const maxScrollOffset = Math.max(0, totalNoticeHeight - subWindowHeight);
  
  // Update scroll offset with bounds checking
  newsFeedScrollOffset = Math.max(0, Math.min(maxScrollOffset, newsFeedScrollOffset + scrollAmount));
  
  // Apply scroll offset to notice list
  noticeList.style.transform = `translateY(-${newsFeedScrollOffset}px)`;
  
  // Update scroll knob position
  updateScrollKnob();
}

function updateScrollKnob(){
  const totalNoticeHeight = totalNotices * noticeHeight;
  const subWindowHeight = newsFeedSubWindow.offsetHeight;
  const maxScrollOffset = Math.max(0, totalNoticeHeight - subWindowHeight);
  const scrollPercentage = maxScrollOffset > 0 ? newsFeedScrollOffset / maxScrollOffset : 0;
  // The knob is a full-frame sprite with the thumb drawn at the top of the
  // track; translate the whole overlay down to move the thumb.
  scrollKnob.style.transform = `translateY(${scrollPercentage * THUMB_TRAVEL}px)`;
}

function setupButtonStates(button, normalSrc, hoverSrc, pressedSrc){
  const normalPath = 'assets/' + normalSrc;
  const hoverPath = hoverSrc ? 'assets/' + hoverSrc : normalPath;
  const pressedPath = pressedSrc ? 'assets/' + pressedSrc : normalPath;
  
  button.dataset.normal = normalPath;
  button.dataset.hover = hoverPath;
  button.dataset.pressed = pressedPath;
  
  button.addEventListener('mouseenter', () => {
    ensureAudio();
    button.src = button.dataset.hover;
    SFX.menuHighlight();
  });
  
  button.addEventListener('mouseleave', () => {
    button.src = button.dataset.normal;
  });
  
  button.addEventListener('mousedown', () => {
    ensureAudio();
    if(button.dataset.pressed !== button.dataset.normal){
      button.src = button.dataset.pressed;
    }
    SFX.menuClick();
  });
  
  button.addEventListener('mouseup', () => {
    button.src = button.dataset.hover;
  });
}

function scaleMainMenu(){
  if(gameState.currentState !== 'mainMenu') return;
  
  // Fit the 1920x1080 menu inside the monitor's screen area (#mainMenu fills
  // #screenWrap). offsetWidth/Height are layout units, so the outer #appRoot
  // auto-fit scale doesn't affect this ratio - the menu always ends up filling
  // the screen box edge-to-edge regardless of how the window is scaled.
  const scale = Math.min(mainMenu.offsetWidth / 1920, mainMenu.offsetHeight / 1080, 1);
  mainMenuContainer.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
}

function showMainMenu(){
  gameState.currentState = 'mainMenu';
  mainMenu.classList.remove('hidden');
  lockOverlay.classList.add('hidden'); // Hide lock overlay in main menu
  hud.classList.add('hidden'); // Hide HUD in main menu
  titleElement.classList.add('hidden'); // Hide title in main menu
  
  // Reset logo animation for fresh playback
  logoAnimationPlayed = false;
  logoFrame = 0;
  if(logoAnimationId){
    clearTimeout(logoAnimationId);
    logoAnimationId = null;
  }
  cursaderLogo.style.backgroundImage = "url('assets/Cursader_Logo.png')";
  cursaderLogo.style.backgroundSize = `${LOGO_FRAMES * LOGO_FRAME_WIDTH}px ${LOGO_HEIGHT}px`;
  cursaderLogo.style.backgroundPosition = "0px 0px";
  cursaderLogo.style.opacity = "0"; // Hide logo initially

  startLogoAnimation();
  
  // Initialize news feed
  initNewsFeed();
  
  // Set canvas to fullscreen for main menu
  resizeCanvasForMainMenu();

  setTimeout(() => {
    positionButtons();

function hideMainMenu(){
  mainMenu.classList.add('hidden');
  hud.classList.remove('hidden'); // Show HUD in gameplay
  titleElement.classList.remove('hidden'); // Show title in gameplay

  stopLogoAnimation();

function resizeCanvasForMainMenu(){

  canvas.height = window.innerHeight;

function resizeCanvasForGameplay(){

  const isStage2 = gameState.currentStage === 2;
  canvas.width = isStage2 ? 800 : 640;
  canvas.height = isStage2 ? 500 : 400;

// Advance to the next stage within the same run (player keeps upgrades/IP)
function beginStage(n){
  gameState.currentStage = n;
  resizeCanvasForGameplay(); // Ensure gameplay canvas dims before placing stage fixtures
  player.x = W/2; player.y = H/2; // Recenter in the new arena
  mouse.x = W/2; mouse.y = H/2;
  wave = 1;
  waveState = 'fighting';
  enemies = []; playerBullets = []; enemyBullets = []; particles = []; pickups = []; caches = []; deadPixels = []; windows = [];
  cacheSpawnTimer = 6 + Math.random()*4;
  gameOver = false;
  trashCan = (n === 2) ? makeTrashCan() : null;
  overlay.classList.add('hidden');
  upgradeOverlay.classList.add('hidden');

// Re-apply saved display settings on launch (desktop build only). The
// renderer can't resize or reframe its own Electron window, so it asks the
// main process. The window was created with a mode passed via ?mode=...;
// only act when the saved setting differs (prevents a recreate/reload loop).
(function applySavedDisplaySettings(){
  const bridge = window.desktopDungeon;
  if(!bridge || typeof bridge.setDisplayMode !== 'function') return;
  const initialMode = new URLSearchParams(location.search).get('mode') || 'windowed';
  const savedMode = SETTINGS.displayMode || 'windowed';
  // 1. Reconcile display mode with what the window was created as.
  if(savedMode !== initialMode){
    bridge.setDisplayMode(savedMode);
    return; // window is recreated; resolution is handled on the next load
  }
  // 2. Modes match: apply saved resolution (windowed mode only).
  if(savedMode === 'windowed' && SETTINGS.resolution && typeof bridge.setResolution === 'function'){
    const parts = String(SETTINGS.resolution).split('x').map(Number);
    if(parts.length === 2 && parts[0] > 0 && parts[1] > 0){
      bridge.setResolution(parts[0], parts[1]);
    }
  }
})();

// ---------- Audio (procedural, no assets) ----------
let actx = null;
let masterGain = null;
let sfxGain = null;
function applyAudioSettings(){
  if(!masterGain || !sfxGain) return;
  masterGain.gain.value = (typeof SETTINGS.master === 'number' ? SETTINGS.master : 1);
  sfxGain.gain.value = (typeof SETTINGS.sfx === 'number' ? SETTINGS.sfx : 1);
}
function ensureAudio(){
  if(!actx){
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      masterGain = actx.createGain();
      sfxGain = actx.createGain();
      sfxGain.connect(masterGain);
      masterGain.connect(actx.destination);
      applyAudioSettings();
    }catch(e){}
  }
}
function beep(freq, dur, type, vol){
  if(!actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.value = (vol!==undefined?vol:0.06);
  o.connect(g); g.connect(sfxGain || actx.destination);
  const now = actx.currentTime;
  g.gain.setValueAtTime(g.gain.value, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.start(now);
  o.stop(now + dur);
}

// ---------- Utility ----------
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function circleRectCollide(cx,cy,cr, rx,ry,rw,rh){
  const nx = clamp(cx, rx, rx+rw);
  const ny = clamp(cy, ry, ry+rh);
  return dist(cx,cy,nx,ny) < cr;
}
function shortestAngleDiff(a,b){
  let d = b - a;
  while(d > Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  return d;
}

// ---------- IP meter display ----------
// Pure function of total IP (0-300). The in-progress remainder always sits in the
// rightmost slot; completed 100-blocks stack immediately to its left.
function ipSegments(T){
  T = clamp(Math.round(T), 0, 300);
  const numFull = Math.floor(T/100);
  const remainder = T % 100;
  const seg = [0,0,0];
  if(remainder > 0){
    seg[2] = remainder;
    for(let k=1; k<=numFull; k++) seg[2-k] = 100;
  } else {
    for(let k=0; k<numFull; k++) seg[2-k] = 100;
  }
  return seg;
}
function updateIpHud(){
  const seg = ipSegments(player.ip);
  const spans = seg.map(v=>{
    const color = v===100 ? '#ffffff' : (v>0 ? '#ffffff' : '#555');
    return `<span style="color:${color}">${String(v).padStart(3,'0')}</span>`;
  });
  ipTextEl.innerHTML = spans.join(':');
}

function getCanvasPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

// ---------- Pointer lock ----------
// Requesting pointer lock hides the OS cursor entirely and captures raw
// mouse movement (movementX/movementY) instead of on-screen position - the
// system cursor physically never moves, so it can't be dragged out past the
// window edge and "escape" into the OS. We keep our own virtual mouse.x/y,
// advanced by those deltas and clamped to the play area, exactly like before.
let pointerLocked = false;
// Some webviews (Freebuff preview, Itch.io iframes) can't request real pointer
// lock - it throws WrongDocumentError or silently no-ops. In that case we
// emulate it: keep pointerLocked=true (so the loop runs) but track the mouse
// by absolute canvas position instead of movementX/Y deltas.
let pointerLockEmulated = false;
let lockFallbackTimer = null;
let cursorSelectionOverlay;

function onLockEngaged(){

function emulatePointerLock(){
  if(pointerLocked) return;
  console.warn('Pointer lock unavailable in this environment, emulating');
  pointerLockEmulated = true;
  pointerLocked = true;
  onLockEngaged();
}

function requestLock(){
  clearTimeout(lockFallbackTimer);
  // Real pointer lock hides the OS cursor and captures raw mouse deltas, so
  // the cursor can't leave the play area. Try it everywhere; if the host
  // can't do native lock (some webviews throw or silently no-op), the
  // catch below or the fallback timer drops us into emulated lock.
  try {
    if(canvas.requestPointerLock) canvas.requestPointerLock();
  } catch(err) {
    // e.g. WrongDocumentError in webviews - fall straight to emulation
    emulatePointerLock();
    return;
  }
  // Some webviews have requestPointerLock but silently no-op it. If nothing
  // engaged shortly after asking, fall back to emulation. Real browsers and
  // Electron lock fast, so the pointerlockchange handler clears this timer
  // first.
  lockFallbackTimer = setTimeout(() => {
    if(!pointerLocked) emulatePointerLock();
  }, 400);
}

document.addEventListener('pointerlockchange', ()=>{
  pointerLocked = (document.pointerLockElement === canvas);
  clearTimeout(lockFallbackTimer);
  console.log('=== POINTER LOCK CHANGE ===');
  console.log('Pointer locked:', pointerLocked);
  console.log('Wave:', wave);
  console.log('Wave state:', waveState);
  console.log('Enemies:', enemies.length);
  console.log('Windows:', windows.length);
  
  if(pointerLocked){
    pointerLockEmulated = false;
    onLockEngaged();
  } else if(!gameOver && waveState !== 'upgrade'){
    // Covers both a deliberate Esc release and losing lock by e.g. alt-tabbing -
    // either way, pause and ask for a click rather than let stale input keep firing.
    lockOverlay.classList.remove('hidden');
  }
});

document.addEventListener('pointerlockerror', ()=>{
  lockOverlay.classList.remove('hidden');
});

canvas.addEventListener('mousemove', (e)=>{
  if(pointerLockEmulated){
    // Emulated lock: no OS cursor capture, so track the real on-screen position.
    const p = getCanvasPos(e);
    mouse.x = clamp(p.x, 4, W-4);
    mouse.y = clamp(p.y, 4, H-4);
  } else if(!pointerLocked){
    // Not locked yet (e.g. before the first click) - track normally so the
    // very first click-to-lock still has a sane starting position.
    const p = getCanvasPos(e);
    mouse.x = clamp(p.x, 4, W-4);
    mouse.y = clamp(p.y, 4, H-4);
  } else {
    mouse.x = clamp(mouse.x + e.movementX, 4, W-4);
    mouse.y = clamp(mouse.y + e.movementY, 4, H-4);
  }
  if(rmbDown && !isDraggingUlt){
    const d = dist(mouse.x,mouse.y,rmbDownX,rmbDownY);
    if(d > DRAG_THRESHOLD){
      // Check if purge meter is fully charged before allowing selection
      if(player.ultCharge >= 500){
        isDraggingUlt = true;
      } else {
        floatText(mouse.x, mouse.y - 30, "Can't Purge yet", '#fff');
      }
    }
  }
});

canvas.addEventListener('mousedown', (e)=>{
  if(!pointerLocked){
    requestLock();
    return;
  }
  ensureAudio();
  e.preventDefault();
  if(gameOver || waveState==='upgrade') return;
  if(e.button === 0){
    lmbDown = true;
    lmbDownTime = performance.now();
    lmbDownX = mouse.x; lmbDownY = mouse.y;
  } else if(e.button === 2){
    rmbDown = true;
    rmbDownTime = performance.now();
    rmbDownX = mouse.x; rmbDownY = mouse.y;
    isDraggingUlt = false;
  }
});

  if(e.key === 'q' || e.key === 'Q'){
    cycleTarget('next');
  } else if(e.key === 'e' || e.key === 'E'){
    cycleTarget('prev');
  } else if(e.key === 'r' || e.key === 'R'){
    if(waveState === 'victory'){
      // Continue to the next stage, or back to the main menu after the final stage
      if(gameState.currentStage < Object.keys(STAGE_CONFIG).length){
        beginStage(gameState.currentStage + 1);
      } else {
        showMainMenu();
      }
    }
  } else if(e.key === '['){
    // DEV: skip straight to the next stage for testing
    if(gameState.currentState === 'gameplay' && !gameOver && waveState !== 'upgrade'){
      if(gameState.currentStage < Object.keys(STAGE_CONFIG).length){
        pointerLocked = true; // Let the loop run even without real pointer lock (browser testing)
        beginStage(gameState.currentStage + 1);
      }
    }
  } else if(e.key === 'Escape' && pointerLockEmulated && !gameOver && waveState !== 'upgrade'){
    // No real pointer lock to release with Esc - emulate the pause instead.
    pointerLocked = false;
    lockOverlay.classList.remove('hidden');
  }
});

function cycleTarget(direction){
  // Shielded enemies can't be targeted - you need to find the mage first
  const aliveEnemies = enemies.filter(en => !en.dead && !en.shielded);
  if(aliveEnemies.length === 0) return;
  
  // Update cycle index based on current target to maintain consistency
  if(player.currentTarget && aliveEnemies.includes(player.currentTarget)){
    targetCycleIndex = aliveEnemies.indexOf(player.currentTarget);
  } else {
    targetCycleIndex = 0;
  }
  
  if(direction === 'next'){
    targetCycleIndex = (targetCycleIndex + 1) % aliveEnemies.length;
  } else {
    targetCycleIndex = (targetCycleIndex - 1 + aliveEnemies.length) % aliveEnemies.length;
  }
  
  player.currentTarget = aliveEnemies[targetCycleIndex];
  
  // Visual feedback for target change
  if(player.currentTarget){
    floatText(player.currentTarget.x, player.currentTarget.y - 20, "TARGETED", '#00ff00');
  }
}

// Recycle Bin - melee rusher. Idles until you enter range, shakes
// through a telegraph, then charges in a straight line toward wherever
// you were the instant the telegraph ended (not homing mid-charge). Teaches
// that commitment-based enemies can be baited and juked, not just kited.
function spawnRecycleBin(){
  let x,y, tries=0;
  do {
    x = 40 + Math.random()*(W-80);
    y = 40 + Math.random()*(H-80);
    tries++;
  } while(dist(x,y,player.x,player.y) < 260 && tries < 20); // spawns further out - it closes distance fast once triggered

    level: 1,

    stateTimer: 0,
    chargeDir: { x: 0, y: 0 },
    hasHitThisCharge: false,
    shakeOffsetX: 0, shakeOffsetY: 0,

// System Tray Turret - stationary area-denial. Anchors to a fixed point
// (docked to an edge of the "My Computer" obstacle window, like a real
// docked tray icon), never moves, and periodically fires a 3-bullet fan
// spread. Low HP, easy to kill, but punishes standing still in its arc.
function spawnTrayTurret(){
  const edge = Math.floor(Math.random()*4);
  const pad = 14;
  let x, y;
  if(edge === 0){ x = obstacle.x + Math.random()*obstacle.w; y = obstacle.y - pad; }
  else if(edge === 1){ x = obstacle.x + Math.random()*obstacle.w; y = obstacle.y + obstacle.h + pad; }
  else if(edge === 2){ x = obstacle.x - pad; y = obstacle.y + Math.random()*obstacle.h; }
  else { x = obstacle.x + obstacle.w + pad; y = obstacle.y + Math.random()*obstacle.h; }
  x = clamp(x, 20, W-20);
  y = clamp(y, 20, H-20);
  enemies.push({
    x, y, vx: 0, vy: 0,
    radius: 15,
    hp: 14, maxHp: 14,
    level: 1,
    type: 'trayturret',
    shootTimer: 1.2 + Math.random()*1.2,
    telegraph: 0,
    blink: 0
  });
}

// ---- per-type update behavior ----

function updatePopup(en, dt){
  en.wobble += dt*2;
  en.x += (en.vx + Math.sin(en.wobble)*20) * dt;
  en.y += (en.vy + Math.cos(en.wobble*0.8)*20) * dt;
  en.x = clamp(en.x, 24, W-24);
  en.y = clamp(en.y, 24, H-24);
  en.vx *= 0.98; en.vy *= 0.98;

  en.shootTimer -= dt;
  if(en.shootTimer <= 0 && en.telegraph <= 0){
    en.telegraph = 0.45;
  }
  if(en.telegraph > 0){
    en.telegraph -= dt;
    en.blink = (en.blink + dt*20) % (Math.PI*2);
    if(en.telegraph <= 0){
      const dx = player.x - en.x, dy = player.y - en.y;
      const len = Math.hypot(dx,dy) || 1;
      enemyBullets.push({
        x: en.x, y: en.y,
        vx: dx/len*220, vy: dy/len*220,
        radius: 5
      });
      en.shootTimer = 1.6 + Math.random()*1.4;
    }
  }
}

const RECYCLEBIN_TRIGGER_RADIUS = 220;
const RECYCLEBIN_TELEGRAPH_TIME = 0.5;
const RECYCLEBIN_CHARGE_SPEED = 460;
const RECYCLEBIN_CHARGE_MAX_TIME = 1.0;
const RECYCLEBIN_RECOVER_TIME = 0.7;
const RECYCLEBIN_CONTACT_DAMAGE = 14;

function updateRecycleBin(en, dt){
  switch(en.state){
    case 'idle': {
      // small idle jitter so it doesn't look frozen - not real movement
      en.wobble += dt*1.5;
      en.x = clamp(en.x + Math.sin(en.wobble)*4*dt, 24, W-24);
      en.y = clamp(en.y + Math.cos(en.wobble*0.7)*4*dt, 24, H-24);
      if(dist(en.x,en.y,player.x,player.y) < RECYCLEBIN_TRIGGER_RADIUS){
        en.state = 'telegraph';
        en.stateTimer = RECYCLEBIN_TELEGRAPH_TIME;
        en.blink = 0;
      }
      break;
    }
    case 'telegraph': {
      en.stateTimer -= dt;
      en.blink = (en.blink + dt*26) % (Math.PI*2);
      const progress = 1 - clamp(en.stateTimer / RECYCLEBIN_TELEGRAPH_TIME, 0, 1);
      en.shakeOffsetX = (Math.random()-0.5) * 6 * progress;
      en.shakeOffsetY = (Math.random()-0.5) * 6 * progress;
      if(en.stateTimer <= 0){
        // Commit to your position at THIS instant - never homes afterward.
        const dx = player.x - en.x, dy = player.y - en.y;
        const len = Math.hypot(dx,dy) || 1;
        en.chargeDir = { x: dx/len, y: dy/len };
        en.state = 'charging';
        en.stateTimer = RECYCLEBIN_CHARGE_MAX_TIME;
        en.hasHitThisCharge = false;
        en.shakeOffsetX = 0; en.shakeOffsetY = 0;
        SFX.chargeLaunch();
      }
      break;
    }
    case 'charging': {
      en.stateTimer -= dt;
      en.x += en.chargeDir.x * RECYCLEBIN_CHARGE_SPEED * dt;
      en.y += en.chargeDir.y * RECYCLEBIN_CHARGE_SPEED * dt;

      if(!en.hasHitThisCharge && player.invuln <= 0 && dist(en.x,en.y,player.x,player.y) < en.radius + player.radius){
        takeDamage(RECYCLEBIN_CONTACT_DAMAGE);
        player.invuln = 0.6;
        en.hasHitThisCharge = true;
        shake = 10;
      }

      const offscreen = en.x < 10 || en.x > W-10 || en.y < 10 || en.y > H-10;
      if(en.stateTimer <= 0 || offscreen){
        en.x = clamp(en.x, 24, W-24);
        en.y = clamp(en.y, 24, H-24);
        en.state = 'recover';
        en.stateTimer = RECYCLEBIN_RECOVER_TIME;
      }
      break;
    }
    case 'recover': {
      en.stateTimer -= dt;
      if(en.stateTimer <= 0) en.state = 'idle';
      break;
    }
  }
}

function updateTrayTurret(en, dt){
  // Fixed in place - no wobble, no wandering, no movement at all.
  en.shootTimer -= dt;
  if(en.shootTimer <= 0 && en.telegraph <= 0){
    en.telegraph = 0.4;
  }
  if(en.telegraph > 0){
    en.telegraph -= dt;
    en.blink = (en.blink + dt*20) % (Math.PI*2);
    if(en.telegraph <= 0){
      const baseAngle = Math.atan2(player.y-en.y, player.x-en.x);
      const spreadOffsets = [-0.32, 0, 0.32]; // roughly +/-18 degrees either side of center
      for(const off of spreadOffsets){
        const a = baseAngle + off;
        enemyBullets.push({
          x: en.x, y: en.y,
          vx: Math.cos(a)*200, vy: Math.sin(a)*200,
          radius: 5
        });
      }
      en.shootTimer = 2.2 + Math.random()*1.0;
    }
  }
}

// ---- per-type drawing ----

function drawPopupEnemy(en){
  ctx.save();
  const flashing = en.telegraph > 0 && Math.sin(en.blink) > 0;
  ctx.shadowColor = flashing ? '#ffffff' : 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = flashing ? 18 : 5;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(en.x-en.radius, en.y-en.radius, en.radius*2, en.radius*1.6);
  ctx.fillStyle = flashing ? '#000000' : '#000000';
  ctx.fillRect(en.x-en.radius, en.y-en.radius, en.radius*2, 10);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 9px "DOS VGA", "Courier New", monospace';
  ctx.fillText('AD', en.x-en.radius+4, en.y-en.radius+8);
  ctx.fillStyle = '#000000';
  ctx.fillRect(en.x+en.radius-12, en.y-en.radius+1, 9, 8);
  ctx.restore();
}

function drawRecycleBinEnemy(en){
  ctx.save();
  const shakeX = en.shakeOffsetX || 0, shakeY = en.shakeOffsetY || 0;
  const flashing = en.state === 'telegraph' && Math.sin(en.blink) > 0;
  ctx.translate(en.x + shakeX, en.y + shakeY);

  if(en.state === 'charging'){
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-en.chargeDir.x*26, -en.chargeDir.y*26);
    ctx.lineTo(0,0);
    ctx.stroke();
    ctx.restore();
  }

  ctx.shadowColor = flashing ? '#ffffff' : 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = flashing ? 16 : 5;

  ctx.fillStyle = flashing ? '#888888' : '#555555';
  ctx.beginPath();
  ctx.moveTo(-en.radius*0.8, -en.radius*0.7);
  ctx.lineTo(en.radius*0.8, -en.radius*0.7);
  ctx.lineTo(en.radius*0.65, en.radius);
  ctx.lineTo(-en.radius*0.65, en.radius);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#333333';
  ctx.fillRect(-en.radius*0.95, -en.radius*0.95, en.radius*1.9, en.radius*0.3);

  ctx.strokeStyle = flashing ? '#fff' : '#cccccc';
  ctx.lineWidth = 1.5;
  for(let i=0;i<3;i++){
    const a = (Math.PI*2/3)*i - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*3, Math.sin(a)*3);
    ctx.lineTo(Math.cos(a)*en.radius*0.5, Math.sin(a)*en.radius*0.5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTrayTurretEnemy(en){
  ctx.save();
  const flashing = en.telegraph > 0 && Math.sin(en.blink) > 0;
  ctx.translate(en.x, en.y);
  ctx.shadowColor = flashing ? '#ffffff' : 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = flashing ? 16 : 5;

  ctx.fillStyle = flashing ? '#666666' : '#444444';
  ctx.fillRect(-en.radius*0.75, -en.radius*0.75, en.radius*1.5, en.radius*1.5);
  ctx.strokeStyle = '#cccccc';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-en.radius*0.75, -en.radius*0.75, en.radius*1.5, en.radius*1.5);

  ctx.strokeStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0,0, en.radius*0.4, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,-en.radius*0.3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(en.radius*0.2,0);
  ctx.stroke();

  ctx.restore();
}

const ENEMY_TYPES = {
  menubutton: { update: updateMenuButton, draw: drawMenuButtonEnemy },
  macfile: { update: updateMacFile, draw: drawMacFile },

// Visi On Era Wave Structure
// Button swarms that spawn from the menu bar
let waveSpawnTimer = 0;
let enemiesToSpawn = 0; // Total enemies to spawn this wave
let enemiesSpawned = 0; // Count of enemies actually spawned
let buttonSpawnStaggerTimer = 0; // Timer for staggering individual enemy spawns
let buttonSpawnIndex = 0; // Index for staggering spawns
let waveTimer = 0; // Minimum wave duration
const MIN_WAVE_DURATION = 3; // Minimum seconds before wave can clear
let hasStartedSpawning = false; // Track if spawning has begun

function startWave(n){
  console.log('=== START WAVE FUNCTION ===');
  console.log('Starting wave:', n);
  console.log('Current wave state:', waveState);
  
  // Reset wave state
  enemiesSpawned = 0;
  hasStartedSpawning = false;
  buttonSpawnStaggerTimer = 0;
  buttonSpawnIndex = 0;
  killsThisWave = 0;
  filesSpawnedThisWave = 0;
  
  // Apply cursor type stats at wave start
  const cursorStats = CURSOR_TYPES[player.cursorType];
  player.maxHp = cursorStats.maxHp;
  if(wave === 1) player.hp = cursorStats.maxHp; // Only reset HP on first wave
  
  // Give you invulnerability at wave start to avoid window damage
  player.invuln = 2.0;
  
  // Respawn window each wave, ensuring it doesn't spawn near you
  spawnWindows();
  
  // Each wave has a fixed number of enemies to spawn
  if(gameState.currentStage === 2){
    // Stage 2: base of 20 on wave 1, exponential growth to exactly 120 on wave 20
    enemiesToSpawn = Math.min(120, Math.floor(20 * Math.pow(6, (n - 1) / 19)));
  } else {
    // Stage 1: linear ramp, Wave 1: 12 enemies, Wave 15: 60 enemies (15-wave structure)
    const baseEnemies = 12;
    const maxEnemies = 60;
    const progress = Math.min((n - 1) / 14, 1); // 0 to 1 over waves 1-15
    enemiesToSpawn = Math.floor(baseEnemies + (maxEnemies - baseEnemies) * progress);
  }
  
  waveSpawnTimer = 0;
  waveTimer = MIN_WAVE_DURATION;
  
  waveTextEl.textContent = "Wave " + wave;
  SFX.wave();
  
  // Initial spawn with delay
  waveSpawnTimer = 1.0; // Start with 1 second delay
  
  // Reset word window attack for this wave
  wordWindowAttack.projectilesFiredThisWave = 0;
  wordWindowAttack.active = false;
  wordWindowAttack.phase = 'idle';
}

function spawnButtonSwarm(){
  if(enemiesSpawned >= enemiesToSpawn) return;
  
  const isStage2 = gameState.currentStage === 2;
  const dpMin = isStage2 ? 12 : 9;
  const dpMax = isStage2 ? 20 : 15;
  
  // Spawn dead pixels instead of enemies occasionally (stage 1: waves 9-15, stage 2: waves 12-20)
  if(wave >= dpMin && wave <= dpMax && Math.random() < 0.3 && deadPixels.length < 3){
    spawnDeadPixel();
    enemiesSpawned++; // Count toward total enemies
    return;
  }
  
  // Stage 2: file mages protect nearby enemies (max 1 active at a time). Waves 6+
  if(isStage2 && wave >= 6 && !enemies.some(e => e.type === 'macfile' || e.type === 'corruptedmacfile') && Math.random() < 0.12){
    if(wave >= 10 && Math.random() < 0.15){
      spawnCorruptedMacFile(); // Rare corrupted variant - hoovers up drops
    } else {
      spawnMacFile();
    }
    enemiesSpawned++; // Count toward total enemies
    return;
  }
  
  // Spawn a wave of buttons (up to 8, or remaining count)
  const waveMultiplier = 1 + (wave * 0.1); // Increase HP per wave
  
  // Calculate stagger time based on cursor type
  // Non-default cursors get longer stagger times to compensate for their cooldowns
  let staggerTime = 0.4; // Reduced base stagger time (was 0.6)
  if(player.cursorType === 'shotgun') staggerTime = 0.5; // Reduced (was 0.8)
  if(player.cursorType === 'grenade') staggerTime = 0.6; // Reduced (was 1.0)
  if(player.cursorType === 'laser') staggerTime = 0.5; // Reduced (was 0.9)
  
  // Spawn a batch of buttons per stagger tick (stage 2 releases 2 at a time)
  const batch = isStage2 ? 2 : 1;
  if(buttonSpawnStaggerTimer <= 0){
    for(let i = 0; i < batch; i++){
      if(enemiesSpawned >= enemiesToSpawn) break;
      // Waves 5-8: Add corrupted (explosive) enemies (stage 2: all waves)
      if(wave >= (isStage2 ? 1 : 5) && wave <= (isStage2 ? 20 : 8) && Math.random() < 0.15){
        // Force corrupted variant
        spawnMenuButton(buttonSpawnIndex % getMenuButtons().length, waveMultiplier, true);
      } else {
        spawnMenuButton(buttonSpawnIndex % getMenuButtons().length, waveMultiplier);
      }
      enemiesSpawned++;
      buttonSpawnIndex++;
    }
    buttonSpawnStaggerTimer = staggerTime;
  }
}

// ---------- Stage 2: File Mage (Mac_File) + Corrupted variant ----------
function spawnMacFile(){
  let x,y, tries=0;
  do {
    x = 50 + Math.random()*(W-100);
    y = 50 + Math.random()*(H-120);
    tries++;
  } while(dist(x,y,player.x,player.y) < 200 && tries < 20);
  enemies.push({
    x, y, vx: 0, vy: 0,
    radius: 16,
    hp: 40, maxHp: 40,
    level: 1,
    type: 'macfile',
    auraRadius: 200,
    driftTimer: Math.random()*Math.PI*2,
    blink: 0,
    ...initEnemyChips({}, 43, 38) // 20% larger sprite body, chippable
  });
}

function spawnCorruptedMacFile(){
  let x,y, tries=0;
  do {
    x = 50 + Math.random()*(W-100);
    y = 50 + Math.random()*(H-120);
    tries++;
  } while(dist(x,y,player.x,player.y) < 200 && tries < 20);
  enemies.push({
    x, y, vx: 0, vy: 0,
    radius: 16,
    hp: 80, maxHp: 80,
    level: 2,
    type: 'corruptedmacfile',
    auraRadius: 200,
    driftTimer: Math.random()*Math.PI*2,
    isCorrupted: true, // Inherits the corrupted death-tell explosion
    deathTell: false,
    deathTellTimer: 0,
    explosionRadius: 55,
    // Hoover mechanic: soaks up drops, redrops everything if killed in time
    hoovered: [],
    hooverTimer: 12,
    destructWarn: 0,
    timeoutDeath: false,
    blink: 0,
    ...initEnemyChips({}, 43, 38) // 20% larger sprite body, chippable
  });
}

function updateMacFile(en, dt){
  // A dead mage lingers in the array until the end-of-loop filter; never let it
  // re-apply shields after clearMageShields() has run on its death.
  if(en.dead) return;
  updateEnemyChips(en, dt); // chunk erosion like every other enemy
  // Mark shielded enemies inside the aura (black ring). Mages never shield mages.
  for(const other of enemies){
    if(other === en) continue;
    if(other.dead || other.type === 'macfile' || other.type === 'corruptedmacfile'){
      other.shielded = false;
      continue;
    }
    other.shielded = dist(en.x, en.y, other.x, other.y) < en.auraRadius;
  }
  driftMage(en, dt);
}

function updateCorruptedMacFile(en, dt){
  updateMacFile(en, dt);

  // Hoover: absorb nearby IP/MEM drops and encrypted files
  for(let i = pickups.length - 1; i >= 0; i--){
    const p = pickups[i];
    if(p.type === 'mine') continue;
    if(dist(en.x, en.y, p.x, p.y) < 45){
      pickups.splice(i, 1);
      en.hoovered.push({ kind: 'pickup', obj: p });
    }
  }
  for(let i = caches.length - 1; i >= 0; i--){
    const c = caches[i];
    if(dist(en.x, en.y, c.x, c.y) < 45){
      caches.splice(i, 1);
      en.hoovered.push({ kind: 'cache', obj: c });
    }
  }

  // Self-destruct countdown - if the player doesn't kill it in time the drops are lost
  en.hooverTimer -= dt;
  if(en.hooverTimer <= 3 && !en.timeoutDeath){
    en.destructWarn -= dt;
    if(en.destructWarn <= 0){
      en.destructWarn = 0.5;
      floatText(en.x, en.y - 26, "SELF DESTRUCT!", '#ff0000');
    }
    if(en.hooverTimer <= 0){
      en.timeoutDeath = true;
      en.hoovered = []; // Drops are lost
      en.deathTell = true;
      en.deathTellTimer = 0.6;
    }
  }
}

function driftMage(en, dt){
  // Drift toward clusters of enemies to keep them inside the aura
  let tx = en.x, ty = en.y, count = 0;
  for(const other of enemies){
    if(other.dead || other === en || other.type === 'macfile' || other.type === 'corruptedmacfile') continue;
    const d = dist(en.x, en.y, other.x, other.y);
    if(d < 320){ tx += other.x; ty += other.y; count++; }
  }
  let targetX, targetY;
  if(count > 0){
    targetX = tx / count;
    targetY = ty / count;
  } else {
    // Wander toward the play area center with a slow bob
    targetX = W/2 + Math.sin(performance.now()/2000 + en.driftTimer) * 60;
    targetY = H/2 + Math.cos(performance.now()/2500 + en.driftTimer) * 50;
  }
  const dx = targetX - en.x, dy = targetY - en.y;
  const len = Math.hypot(dx, dy) || 1;
  const speed = 55;
  en.x = clamp(en.x + (dx/len) * speed * dt, 25, W-25);
  en.y = clamp(en.y + (dy/len) * speed * dt, 35, H-35);
}

function clearMageShields(){
  for(const en of enemies){
    en.shielded = false;
  }
}

function redropHoovered(en){
  for(const item of en.hoovered){
    const px = clamp(en.x + (Math.random()-0.5) * 80, 15, W-15);
    const py = clamp(en.y + (Math.random()-0.5) * 80, 25, H-15);
    if(item.kind === 'pickup'){
      const p = item.obj;
      p.x = px; p.y = py;
      p.life = Math.max(p.life, 10); // Fresh enough to grab
      p.dead = false;
      pickups.push(p);
    } else {
      const c = item.obj;
      c.x = px; c.y = py;
      c.dead = false;
      caches.push(c);
    }
  }
  en.hoovered = [];
}

function drawMacFile(en){
  ctx.save();
  ctx.translate(en.x, en.y);

  // Faint aura range ring (white - Mac 1.0 era is black & white)
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.arc(0, 0, en.auraRadius, 0, Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);

  const corrupted = en.type === 'corruptedmacfile';
  // 20% larger sprite: 36x32 -> 43x38. Draw clipped to the remaining chunk
  // blocks so damaged mages visibly lose pieces like every other enemy.
  const sW = 43, sH = 38;
  const removedSet = removedBlockSet(en);
  const cols = en.chunkCols || Math.max(1, Math.floor(sW / 4));
  const rows = en.chunkRows || Math.max(1, Math.floor(sH / 4));
  ctx.save();
  if(removedSet.size > 0){
    // Clip to the surviving blocks so holes read as blown-off chunks
    ctx.beginPath();
    for(let i = 0; i < cols * rows; i++){
      if(removedSet.has(i)) continue;
      const ci = i % cols, ri = Math.floor(i / cols);
      ctx.rect(-sW/2 + ci*4, -sH/2 + ri*4, 4, 4);
    }
    ctx.clip();
  }
  if(macFileImg.complete && macFileImg.naturalWidth > 0){
    ctx.drawImage(macFileImg, -sW/2, -sH/2, sW, sH);
  } else {
    // Fallback: simple file icon
    ctx.fillStyle = corrupted ? '#ff0000' : '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.fillRect(-14, -17, 28, 34);
    ctx.strokeRect(-14, -17, 28, 34);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-14, -17);
    ctx.lineTo(0, -17);
    ctx.lineTo(-14, 0);
    ctx.closePath();
    ctx.fill();
  }
  // Impact flash: brief white overlay right after being hit
  if(en.hitFlash > 0){
    ctx.globalAlpha = en.hitFlash * 0.4;
    ctx.fillStyle = '#ffffff';
    if(removedSet.size === 0){
      ctx.fillRect(-sW/2, -sH/2, sW, sH);
    } else {
      for(let i = 0; i < cols * rows; i++){
        if(removedSet.has(i)) continue;
        const ci = i % cols, ri = Math.floor(i / cols);
        ctx.fillRect(-sW/2 + ci*4, -sH/2 + ri*4, 4, 4);
      }
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // Corrupted mage: red self-destruct countdown ring + held item count
  if(corrupted){
    if(en.hooverTimer > 0 && en.hooverTimer <= 3){
      const frac = en.hooverTimer / 3;
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, en.radius + 8, -Math.PI/2, -Math.PI/2 + frac * Math.PI * 2);
      ctx.stroke();
    }
    if(en.hoovered.length > 0){
      ctx.fillStyle = '#fff';
      ctx.font = '10px "DOS VGA", "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(en.hoovered.length, 0, -en.radius - 6);
    }
  }
  ctx.restore();
}

// ---------- Stage 2: Trash can (stationary hazard turret) ----------
const TRASH_FRAME_W = 32, TRASH_FRAME_H = 55, TRASH_FRAMES = 10;
const TRASH_WAD_SPEED = 100, TRASH_WAD_RADIUS = 6, TRASH_WAD_DAMAGE = 10, TRASH_WAD_CAP = 12; // 2x larger wads

function makeTrashCan(){
  return {
    x: W - 18, // bottom-right corner of the play area
    y: H - 28,
    frame: 1,
    animTime: 0,
    firing: false,
    fireTimer: 6 + Math.random()*6,
    volleyWads: 0
  };
}

function updateTrashCan(dt){
  if(!trashCan || gameState.currentStage !== 2) return;
  const tc = trashCan;

  // Harm the player if touched (the can is a hazard from wave 1)
  if(player.invuln <= 0 && Math.abs(player.x - tc.x) < 18 && Math.abs(player.y - tc.y) < 30){
    takeDamage(5);
    player.invuln = 0.3;
    shake = 4;
    floatText(player.x, player.y - 20, "TRASH!", '#fff');
  }

  // Waves 1-7: purely a stationary obstacle. Fires from wave 8 on.
  if(wave < 8){
    tc.frame = 1;
    tc.animTime = 0;
    tc.firing = false;
    return;
  }

  if(!tc.firing){
    tc.frame = 1;
    tc.fireTimer -= dt;
    if(tc.fireTimer <= 0){
      // Start a volley if under the live-wad cap
      const live = enemyBullets.filter(b => b.type === 'trashwad').length;
      if(live < TRASH_WAD_CAP){
        tc.firing = true;
        tc.animTime = 0;
        tc.volleyWads = 0;
      } else {
        tc.fireTimer = 2; // At cap - re-check soon
      }
    }
  } else {
    tc.animTime += dt;
    tc.frame = Math.floor(tc.animTime * 5) + 1; // 5fps animation, frames 1-10
    if(tc.frame > TRASH_FRAMES){
      tc.firing = false;
      tc.frame = 1;
      tc.fireTimer = 6 + Math.random()*6;
    } else if((tc.frame === 3 || tc.frame === 5 || tc.frame === 7) && tc.volleyWads < 3){
      // 3 wads spread across the 1.2s firing window (frames 3-8)
      spawnTrashWad(tc, tc.volleyWads);
      tc.volleyWads++;
    }
  }
}

function spawnTrashWad(tc, index){
  // Fan upward out of the top of the can. Wide spread + per-wad speed variance
  // so the three wads visibly separate instead of traveling as a clump.
  const baseAngle = -Math.PI/2;
  const spread = [-0.85, 0, 0.85][index % 3];
  const speedMult = [0.95, 0.75, 1.1][index % 3]; // middle one lags, edges pull ahead
  const a = baseAngle + spread;
  enemyBullets.push({
    x: tc.x, y: tc.y - 27,
    vx: Math.cos(a) * TRASH_WAD_SPEED * speedMult,
    vy: Math.sin(a) * TRASH_WAD_SPEED * speedMult,
    radius: TRASH_WAD_RADIUS,
    damage: TRASH_WAD_DAMAGE,
    type: 'trashwad',
    dead: false
  });
  SFX.enemyShoot();
}

function drawTrashCan(){
  if(!trashCan || gameState.currentStage !== 2) return;
  const tc = trashCan;
  ctx.save();
  const frame = clamp(tc.frame, 1, TRASH_FRAMES);
  if(trashShotImg.complete && trashShotImg.naturalWidth > 0){
    ctx.drawImage(trashShotImg, (frame-1)*TRASH_FRAME_W, 0, TRASH_FRAME_W, TRASH_FRAME_H,
                  tc.x - TRASH_FRAME_W/2, tc.y - TRASH_FRAME_H/2, TRASH_FRAME_W, TRASH_FRAME_H);
  } else {
    // Fallback while the sprite loads: simple white can
    ctx.fillStyle = '#fff';
    ctx.fillRect(tc.x-12, tc.y-20, 24, 40);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(tc.x-12, tc.y-20, 24, 40);
  }
  // (No extra outline - the sprite is drawn as-is; the can itself reads fine)
  ctx.restore();
}

function updateWindowResize(dt){
  // Stage 2: obstacle windows start small and randomly grow/shrink after a warning
  if(gameState.currentStage !== 2) return;
  for(const win of windows){
    if(win.resizeState === 'idle'){
      win.resizeTimer -= dt;
      if(win.resizeTimer <= 0){
        win.resizeState = 'warning';
        win.resizeTimer = 1.4;
      }
    } else if(win.resizeState === 'warning'){
      win.resizeTimer -= dt;
      if(win.resizeTimer <= 0){
        win.startW = win.width;
        win.startH = win.height;
        const scale = 0.45 + Math.random() * 0.75;
        win.targetW = Math.round(Math.max(160, Math.min(win.baseW * scale, W - win.x - 20)));
        win.targetH = Math.round(Math.max(100, Math.min(win.baseH * scale, H - win.y - 20)));
        win.resizeState = 'changing';
        win.resizeTimer = 0.6;
      }
    } else if(win.resizeState === 'changing'){
      win.resizeTimer -= dt;
      const t = clamp(1 - win.resizeTimer / 0.6, 0, 1);
      win.width = Math.round(win.startW + (win.targetW - win.startW) * t);
      win.height = Math.round(win.startH + (win.targetH - win.startH) * t);
      if(win.resizeTimer <= 0){
        win.resizeState = 'idle';
        win.resizeTimer = 5 + Math.random()*4;
      }
    }
  }
}

// ---------- Dead Pixel Trap System (Waves 9-15) ----------
function spawnDeadPixel(){
  // Get word window bounds if active
  let winX, winY, winW, winH, hasWindow = false;
  if(windows.length > 0){
    const win = windows[0]; // Use first window for reference
    winX = win.x;
    winY = win.y;
    winW = win.width;
    winH = win.height;
    hasWindow = true;
  }
  
  // Spawn dead pixel - calculate safe position outside word window
  let x, y, valid = false, tries = 0;
  const margin = 50; // Additional margin around window
  
  while(!valid && tries < 100){
    // Try different spawn strategies
    const strategy = tries % 4;
    
    switch(strategy){
      case 0: // Try spawning in left side
        x = margin + Math.random() * (W / 3);
        y = margin + Math.random() * (H - 2 * margin);
        break;
      case 1: // Try spawning in right side
        x = (W * 2 / 3) + Math.random() * (W / 3 - margin);
        y = margin + Math.random() * (H - 2 * margin);
        break;
      case 2: // Try spawning in top area
        x = margin + Math.random() * (W - 2 * margin);
        y = margin + Math.random() * (H / 3);
        break;
      case 3: // Try spawning in bottom area
        x = margin + Math.random() * (W - 2 * margin);
        y = (H * 2 / 3) + Math.random() * (H / 3 - margin);
        break;
    }
    
    // Check if position is valid (outside word window if exists)
    valid = true;
    if(hasWindow){
      // Check if point is inside window bounds (with margin)
      if(x > winX - margin && x < winX + winW + margin &&
         y > winY - margin && y < winY + winH + margin){
        valid = false;
      }
    }
    
    tries++;
  }
  
  deadPixels.push({
    x: x,
    y: y,
    radius: 15,
    state: 'flashing', // flashing -> spiderweb -> clear
    stateTimer: 1.5, // Flash duration
    flashCount: 0,
    maxFlashes: 3,
    spiderwebRadius: 0,
    maxSpiderwebRadius: 160, // Doubled from 80px to 160px
    spiderwebDuration: 2.0, // How long spiderweb lasts
    spiderwebTimer: 0,
    damage: 10,
    dead: false
  });
}

function isNearWordWindow(x, y, threshold){
  if(!wordWindowAttack.window) return false;
  const win = wordWindowAttack.window;
  const centerX = win.x + win.width / 2;
  const centerY = win.y + win.height / 2;
  
  // Check if point is inside the window or too close to it
  if(x > win.x - threshold && x < win.x + win.width + threshold &&
     y > win.y - threshold && y < win.y + win.height + threshold){
    return true;
  }
  
  return dist(x, y, centerX, centerY) < threshold;
}

function updateDeadPixels(dt){
  for(const dp of deadPixels){
    dp.stateTimer -= dt;
    
    if(dp.state === 'flashing'){
      dp.flashCount += dt * 8; // Flash speed
      if(dp.stateTimer <= 0){
        dp.state = 'spiderweb';
        dp.stateTimer = dp.spiderwebDuration;
        dp.spiderwebTimer = 0;
      }
    } else if(dp.state === 'spiderweb'){
      dp.spiderwebTimer += dt;
      dp.spiderwebRadius = Math.min(dp.maxSpiderwebRadius, dp.spiderwebRadius + dt * 40);
      
      // Check player collision with spiderweb
      if(player.invuln <= 0 && dist(dp.x, dp.y, player.x, player.y) < dp.spiderwebRadius + player.radius){
        takeDamage(dp.damage);
        player.invuln = 0.5;
        shake = 8;
        floatText(player.x, player.y - 20, "DEAD PIXEL HIT!", '#ff0000');
      }
      
      if(dp.stateTimer <= 0){
        dp.dead = true;
      }
    }
  }
  
  deadPixels = deadPixels.filter(dp => !dp.dead);
}

function drawDeadPixels(){
  for(const dp of deadPixels){
    ctx.save();
    
    if(dp.state === 'flashing'){
      // Flashing pixel effect
      const flashIntensity = Math.sin(dp.flashCount * Math.PI) * 0.5 + 0.5;
      ctx.fillStyle = `rgba(255, 0, 0, ${flashIntensity})`;
      ctx.fillRect(dp.x - 5, dp.y - 5, 10, 10);
      
      // Warning ring
      ctx.strokeStyle = `rgba(255, 0, 0, ${flashIntensity})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(dp.x, dp.y, 20, 0, Math.PI * 2);
      ctx.stroke();
    } else if(dp.state === 'spiderweb'){
      // Spiderweb effect
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)';
      ctx.lineWidth = 1;
      
      // Draw spiderweb lines
      for(let i = 0; i < 8; i++){
        const angle = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(dp.x, dp.y);
        ctx.lineTo(
          dp.x + Math.cos(angle) * dp.spiderwebRadius,
          dp.y + Math.sin(angle) * dp.spiderwebRadius
        );
        ctx.stroke();
      }
      
      // Draw web center
      ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
      ctx.fillRect(dp.x - 3, dp.y - 3, 6, 6);
    }
    
    ctx.restore();
  }
}

// Wave state machine for continuous spawning
function updateWaveSpawning(dt){
  if(waveState !== 'fighting') return;
  
  // Update stagger timer for individual enemy spawns
  buttonSpawnStaggerTimer -= dt;
  
  // Continuously check if we need to spawn more enemies
  if(enemiesSpawned < enemiesToSpawn && buttonSpawnStaggerTimer <= 0){
    spawnButtonSwarm();
  }
  
  // Reset wave spawn timer logic - sub-waves are now handled by stagger
  if(!hasStartedSpawning && enemiesSpawned > 0){
    hasStartedSpawning = true;
  }
}

// ---------- Encrypted files: temporary hold-to-decrypt pickups. One at a time.
// Files have levels 1-5 based on wave progression, requiring hold time: 0.3s-1.5s (level * 0.3s).
function spawnCache(){
  let x,y, tries=0;
  do {
    x = 50 + Math.random()*(W-100);
    y = 50 + Math.random()*(H-100);
    tries++;
    // Check if position overlaps with any window
    let inWindow = false;
    for(const win of windows){
      if(x + 15 > win.x && x - 15 < win.x + win.width &&
         y + 15 > win.y && y - 15 < win.y + win.height){
        inWindow = true;
        break;
      }
    }
    if(!inWindow) break;
  } while(tries < 50);
  
  // Determine level based on wave progression and rarity weighting
  let level = 1;
  const r = Math.random() * 100;
  
  if(wave <= 4){
    // Waves 1-4: Level 1 100%
    level = 1;
  } else if(wave <= 8){
    // Waves 5-8: Level 1 90%, Level 2 10%
    level = r < 90 ? 1 : 2;
  } else if(wave <= 11){
    // Waves 9-11: Level 1 80%, Level 2 10%, Level 3 10%
    if(r < 80) level = 1;
    else if(r < 90) level = 2;
    else level = 3;
  } else if(wave <= 15){
    // Waves 12-15: Level 1 60%, Level 2 20%, Level 3 10%, Level 4 10%
    if(r < 60) level = 1;
    else if(r < 80) level = 2;
    else if(r < 90) level = 3;
    else level = 4;
  } else {
    // Waves 16-20: (Not used in 15-wave structure, but kept for future)
    level = 1;
  }
  
  const kind = Math.random() < 0.5 ? 'ip' : 'heal';
  // Higher level files give better rewards and last longer
  const baseAmount = kind === 'ip' ? 12 : 8;
  const levelMultiplier = 1 + (level - 1) * 0.5; // Level 1: 1x, Level 5: 3x
  const amount = Math.round((baseAmount + Math.random() * 8) * levelMultiplier);
  const lifeTime = 6 + level * 2; // Level 1: 8s, Level 5: 16s
  const decryptTime = level * 0.3; // Level 1: 0.3s, Level 5: 1.5s
  
  caches.push({
    x, y, radius: 15,
    life: lifeTime, maxLife: lifeTime,
    kind,
    amount,
    level,
    decryptTime,
    decryptProgress: 0, // Progress 0 to decryptTime
    decrypting: false
  });
}

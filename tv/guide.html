<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Guide - Fawkeswarez</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Fallback styles in case CSS fails to load */
        body {
            background: #000 !important;
            color: #0F0 !important;
            font-family: 'Chakra Petch', monospace;
            margin: 0;
            padding: 0;
        }
        
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #000 25%, #0a0a0a 25%, #0a0a0a 50%, #000 50%, #000 75%, #0a0a0a 75%, #0a0a0a);
            background-size: 20px 20px;
            z-index: -2;
        }
        
        .y2k-header {
            background: linear-gradient(45deg, #FF00FF, #00FFFF, #FFFF00);
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid #0F0;
        }
        
        .glitch-text {
            font-size: 2rem;
            color: #000;
            text-shadow: 2px 2px 0 #FF00FF, -2px -2px 0 #00FFFF;
        }
        
        .y2k-nav {
            background: #111;
            padding: 15px;
            border-bottom: 2px solid #0F0;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: linear-gradient(45deg, #0F0, #0a0);
            border: 2px solid #0F0;
            color: #000;
            padding: 10px 20px;
            font-family: 'Chakra Petch', monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .nav-btn:hover {
            background: linear-gradient(45deg, #0a0, #0F0);
            color: #0F0;
            box-shadow: 0 0 15px rgba(0,255,0,0.8);
        }
        
        .main-content {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .section-title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #0F0;
            text-shadow: 0 0 10px rgba(0,255,0,0.8);
        }
        
        .guide-container {
            background: rgba(0,20,0,0.8);
            border: 2px solid #0F0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .calendar-nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 30px;
        }
        
        .calendar-day-header {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background: rgba(0,255,255,0.2);
            border-radius: 4px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border: 1px solid #0F0;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }
        
        .calendar-day:hover {
            background: rgba(0,255,0,0.1);
            box-shadow: 0 0 10px rgba(0,255,0,0.5);
        }
        
        .calendar-day.selected {
            background: rgba(0,255,0,0.3);
            border-color: #0F0;
            box-shadow: 0 0 15px rgba(0,255,0,0.8);
        }
        
        .calendar-day.other-month {
            opacity: 0.3;
        }
        
        .lineup-date {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #0F0;
        }
        
        .lineup-slots {
            display: grid;
            gap: 10px;
        }
        
        .slot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-left: 3px solid #0F0;
        }
        
        .slot-time {
            font-weight: bold;
            color: #0F0;
            min-width: 80px;
        }
        
        .slot-program {
            flex: 1;
            margin: 0 20px;
        }
        
        .slot-status {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            min-width: 80px;
            text-align: center;
        }
        
        .slot-status.on-air {
            background: rgba(0,255,0,0.2);
            color: #0F0;
            border: 1px solid #0F0;
        }
        
        .slot-status.off-air {
            background: rgba(255,0,0,0.2);
            color: #F00;
            border: 1px solid #F00;
        }
        
        .slot-episode {
            font-size: 0.9em;
            color: #0F0;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="matrix-bg"></div>
    <div class="stars"></div>
    
    <!-- Header -->
    <header class="y2k-header">
        <div class="header-content">
            <h1 class="glitch-text" data-text="TV Guide">TV Guide</h1>
            <div class="under-construction">
                <marquee behavior="scroll" direction="left">📅 MONTHLY PROGRAM GUIDE 📅 SELECT ANY DAY TO VIEW LINEUP 📅</marquee>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="y2k-nav">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='./'">⬅ BACK TO TV</button>
            <button class="nav-btn" onclick="window.location.href='../'">🏠 HOME</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <section class="content-section active">
            <h2 class="section-title">📅 PROGRAM SCHEDULE 📅</h2>

            <div class="guide-container">
                <div class="calendar-header">
                    <button class="nav-btn" onclick="changeMonth(-1)">◀ PREV</button>
                    <h3 id="calendar-month">April 2026</h3>
                    <button class="nav-btn" onclick="changeMonth(1)">NEXT ▶</button>
                </div>
                
                <div class="calendar-grid" id="calendar">
                    <!-- Calendar will be generated here -->
                </div>
            </div>

            <div class="guide-container">
                <h3 class="lineup-date" id="lineup-date">Select a date to view lineup</h3>
                <div class="lineup-slots" id="lineup-slots">
                    <!-- Lineup will be displayed here -->
                </div>
            </div>
        </section>
    </main>

    <script>
        let currentDate = new Date();
        let selectedDate = new Date();
        let weeklyLineup = null;

        const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

        async function loadData() {
            try {
                const timestamp = new Date().getTime();
                console.log('Loading weekly lineup with timestamp:', timestamp);
                const response = await fetch('weekly-lineup.json?t=' + timestamp);
                weeklyLineup = await response.json();
                console.log('Loaded weekly lineup, total entries:', weeklyLineup.length);
                console.log('First few entries:', weeklyLineup.slice(0, 3));
                renderCalendar();
                renderLineup();
            } catch (error) {
                console.error('Failed to load weekly lineup:', error);
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Update month display
            document.getElementById('calendar-month').textContent = `${monthNames[month]} ${year}`;
            
            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            let html = '';
            
            // Add day headers
            const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayHeaders.forEach(day => {
                html += `<div class="calendar-day-header">${day}</div>`;
            });
            
            // Add previous month's trailing days
            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="calendar-day other-month">${daysInPrevMonth - i}</div>`;
            }
            
            // Add current month's days
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const isToday = date.toDateString() === new Date().toDateString();
                const isSelected = date.toDateString() === selectedDate.toDateString();
                
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (isSelected) classes += ' selected';
                
                html += `<div class="${classes}" onclick="selectDate(${year}, ${month}, ${day})">${day}</div>`;
            }
            
            // Add next month's leading days
            const totalCells = firstDay + daysInMonth;
            const nextMonthDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let day = 1; day <= nextMonthDays; day++) {
                html += `<div class="calendar-day other-month">${day}</div>`;
            }
            
            document.getElementById('calendar').innerHTML = html;
        }

        function selectDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            renderCalendar();
            renderLineup();
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function renderLineup() {
            if (!weeklyLineup) return;
            
            const dayName = dayNames[selectedDate.getDay()];
            console.log('Rendering lineup for day:', dayName);
            const daySlots = weeklyLineup.filter(slot => slot.day === dayName);
            console.log('Found slots for', dayName, ':', daySlots.length);
            console.log('Day slots:', daySlots);
            
            document.getElementById('lineup-date').textContent = 
                `${dayName}, ${monthNames[selectedDate.getMonth()]} ${selectedDate.getDate()}, ${selectedDate.getFullYear()}`;
            
            let html = '';
            let dexterSlotCount = 0;
            
            daySlots.forEach(slot => {
                console.log(`Processing slot: ${slot.program}`);
                
                // Check if this is any show that should have episodes
                const allShows = [
                    "Dexter's Laboratory", "The Powerpuff Girls", "Ed, Edd n Eddy", 
                    "Johnny Bravo", "Courage the Cowardly Dog", "Cow & Chicken", 
                    "I Am Weasel", "Billy & Mandy", "Foster's Home",
                    "Samurai Jack", "Teen Titans", "Justice League", "Dragon Ball Z",
                    "Space Ghost Coast to Coast", "Aqua Teen Hunger Force", "Sealab 2021", 
                    "Brak Show", "Home Movies", "The Venture Bros", 
                    "Harvey Birdman, Attorney at Law", "Tom Goes to the Mayor"
                ];
                
                const hasEpisodes = allShows.includes(slot.program);
                console.log(`Show ${slot.program} has episodes: ${hasEpisodes}`);
                
                let episodeInfo = '';
                
                if (hasEpisodes) {
                    const episodeData = getEpisodeForDate(selectedDate, slot.time, slot.program);
                    console.log(`Episode for ${slot.program}:`, episodeData);
                    
                    let episodeDisplay;
                    if (slot.program === "Dexter's Laboratory") {
                        episodeDisplay = `S${episodeData.season.toString().padStart(2, '0')}E${episodeData.episode.toString().padStart(2, '0')}`;
                    } else {
                        episodeDisplay = `Episode ${episodeData.episode}`;
                    }
                    
                    episodeInfo = `<div class="slot-episode">${episodeDisplay}</div>`;
                }
                
                const statusClass = hasEpisodes ? 'on-air' : 'off-air';
                const statusText = hasEpisodes ? '▶' : 'OFF AIR';
                
                html += `
                    <div class="slot">
                        <div class="slot-time">${slot.time}</div>
                        <div class="slot-program">
                            ${slot.program}
                            ${episodeInfo}
                        </div>
                        <div class="slot-status ${statusClass}">${statusText}</div>
                    </div>
                `;
            });
            
            if (html === '') {
                html = '<div style="text-align: center; padding: 40px; color: #0F0;">No programming scheduled for this day</div>';
            }
            
            document.getElementById('lineup-slots').innerHTML = html;
        }

        function getEpisodeForDate(date, timeStr, program) {
            // Calculate total 30-minute slots since April 1, 2026 at 00:00
            const april1 = new Date(2026, 3, 1, 0, 0, 0); // Month is 0-indexed
            
            // Parse the time string to get minutes since midnight
            const timeMatch = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (!timeMatch) return { episode: 1, season: 1 };
            
            let hour = parseInt(timeMatch[1], 10);
            const minute = parseInt(timeMatch[2], 10);
            const ampm = timeMatch[3].toUpperCase();
            
            if (hour === 12) hour = 0;
            if (ampm === 'PM') hour += 12;
            
            // Create date at the given time
            const slotDate = new Date(date.getFullYear(), date.getMonth(), date.getDate(), hour, minute, 0);
            
            // Calculate total 30-minute slots since April 1, 2026 00:00
            const msDiff = slotDate - april1;
            const totalSlots = Math.floor(msDiff / (1000 * 60 * 30)); // 30-minute slots
            
            // Special handling for Dexter's Laboratory
            if (program === "Dexter's Laboratory") {
                const episodeCount = 20; // 20 episodes total
                const offset = 0;
                const adjustedSlots = totalSlots + offset;
                const episodeIndex = adjustedSlots % episodeCount;
                const episodeNum = episodeIndex + 1; // 1-indexed
                
                // Determine season and episode
                let season, episode;
                if (episodeNum <= 13) {
                    season = 1;
                    episode = episodeNum;
                } else {
                    season = 2;
                    episode = episodeNum - 13;
                }
                
                return { episode, season };
            }
            
            // Different episode counts for other shows
            let episodeCount;
            if (["The Powerpuff Girls", "Ed, Edd n Eddy", "Johnny Bravo"].includes(program)) {
                episodeCount = 20; // Frequent shows have 20 episodes
            } else {
                episodeCount = 15; // Regular shows have 15 episodes
            }
            
            // Add program-specific offset to prevent all shows showing same episode number
            const programOffsets = {
                "The Powerpuff Girls": 100,
                "Ed, Edd n Eddy": 200,
                "Johnny Bravo": 300,
                "Courage the Cowardly Dog": 400,
                "Cow & Chicken": 500,
                "I Am Weasel": 600,
                "Billy & Mandy": 700,
                "Foster's Home": 800,
                "Samurai Jack": 900,
                "Teen Titans": 1000,
                "Justice League": 1100,
                "Dragon Ball Z": 1200,
                "Space Ghost Coast to Coast": 1300,
                "Aqua Teen Hunger Force": 1400,
                "Sealab 2021": 1500,
                "Brak Show": 1600,
                "Home Movies": 1700,
                "The Venture Bros": 1800,
                "Harvey Birdman, Attorney at Law": 1900,
                "Tom Goes to the Mayor": 2000
            };
            
            const offset = programOffsets[program] || 0;
            const adjustedSlots = totalSlots + offset;
            const episodeIndex = adjustedSlots % episodeCount;
            
            return { episode: episodeIndex + 1, season: 1 }; // Episodes are 1-indexed, default to season 1
        }

        function getDexterEpisodeForDate(date, timeStr) {
            // Keep for backward compatibility
            return getEpisodeForDate(date, timeStr, "Dexter's Laboratory");
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>

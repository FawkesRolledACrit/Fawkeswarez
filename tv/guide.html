<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Guide - Fawkeswarez</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .guide-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .calendar-nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
        }
        .calendar-day-header {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background: rgba(0,255,255,0.2);
            border-radius: 4px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .calendar-day:hover {
            background: rgba(0,255,255,0.3);
            transform: scale(1.05);
        }
        .calendar-day.other-month {
            opacity: 0.3;
        }
        .calendar-day.today {
            background: rgba(0,255,0,0.3);
            font-weight: bold;
        }
        .calendar-day.selected {
            background: rgba(0,255,255,0.5);
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0,255,255,0.8);
        }
        .lineup-section {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 8px;
        }
        .lineup-date {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #0ff;
        }
        .lineup-grid {
            display: grid;
            gap: 10px;
        }
        .lineup-slot {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 15px;
            padding: 10px;
            background: rgba(0,255,255,0.1);
            border-radius: 4px;
            border-left: 4px solid #0ff;
        }
        .slot-time {
            font-weight: bold;
            color: #0ff;
        }
        .slot-program {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-title {
            font-weight: bold;
        }
        .slot-episode {
            font-size: 12px;
            opacity: 0.8;
        }
        .slot-off-air {
            opacity: 0.5;
            font-style: italic;
        }
        @media (max-width: 768px) {
            .calendar-grid {
                gap: 2px;
                padding: 5px;
            }
            .calendar-day {
                font-size: 12px;
            }
            .lineup-slot {
                grid-template-columns: 80px 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header class="y2k-header">
        <div class="header-content">
            <h1 class="site-title">📅 TV GUIDE</h1>
            <div class="header-subtitle">Fawkeswarez Cartoon Network Lineup</div>
        </div>
    </header>

    <nav class="y2k-nav">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='./'">⬅ BACK TO TV</button>
            <button class="nav-btn" onclick="window.location.href='../'">🏠 HOME</button>
        </div>
    </nav>

    <main class="main-content">
        <div class="guide-container">
            <div class="calendar-header">
                <h2 id="calendar-month">April 2026</h2>
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="changeMonth(-1)">◀ PREV</button>
                    <button class="nav-btn" onclick="goToToday()">TODAY</button>
                    <button class="nav-btn" onclick="changeMonth(1)">NEXT ▶</button>
                </div>
            </div>

            <div class="calendar-grid" id="calendar">
                <!-- Calendar will be generated here -->
            </div>

            <div class="lineup-section">
                <div class="lineup-date" id="lineup-date">Today's Lineup</div>
                <div class="lineup-grid" id="lineup-grid">
                    <!-- Lineup will be generated here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentDate = new Date();
        let selectedDate = new Date();
        let weeklyLineup = null;

        const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

        async function loadData() {
            try {
                const response = await fetch('weekly-lineup.json');
                weeklyLineup = await response.json();
                renderCalendar();
                renderLineup();
            } catch (error) {
                console.error('Failed to load weekly lineup:', error);
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendar-month').textContent = `${monthNames[month]} ${year}`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const prevLastDay = new Date(year, month, 0);
            
            const firstDayOfWeek = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            const daysInPrevMonth = prevLastDay.getDate();
            
            let html = '';
            
            // Day headers
            dayNames.forEach(day => {
                html += `<div class="calendar-day-header">${day.substring(0,3)}</div>`;
            });
            
            // Previous month days
            for (let i = firstDayOfWeek - 1; i >= 0; i--) {
                html += `<div class="calendar-day other-month">${daysInPrevMonth - i}</div>`;
            }
            
            // Current month days
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const isToday = year === today.getFullYear() && 
                               month === today.getMonth() && 
                               day === today.getDate();
                const isSelected = year === selectedDate.getFullYear() && 
                                  month === selectedDate.getMonth() && 
                                  day === selectedDate.getDate();
                
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (isSelected) classes += ' selected';
                
                html += `<div class="${classes}" onclick="selectDate(${year}, ${month}, ${day})">${day}</div>`;
            }
            
            // Next month days
            const remainingCells = 42 - (firstDayOfWeek + daysInMonth);
            for (let day = 1; day <= remainingCells; day++) {
                html += `<div class="calendar-day other-month">${day}</div>`;
            }
            
            document.getElementById('calendar').innerHTML = html;
        }

        function selectDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            renderCalendar();
            renderLineup();
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function goToToday() {
            const today = new Date();
            currentDate = new Date(today);
            selectedDate = new Date(today);
            renderCalendar();
            renderLineup();
        }

        function getDexterEpisodeForDate(date) {
            // Calculate days since April 1, 2026
            const april1 = new Date(2026, 3, 1); // Month is 0-indexed
            const daysDiff = Math.floor((date - april1) / (1000 * 60 * 60 * 24));
            
            // Each day has 48 half-hour slots, Dexter advances every 30 minutes
            const totalSlots = daysDiff * 48;
            const episodeIndex = totalSlots % 11; // 11 episodes in rotation
            
            return episodeIndex + 1; // Episodes are 1-indexed
        }

        function renderLineup() {
            if (!weeklyLineup) return;
            
            const dayName = dayNames[selectedDate.getDay()];
            const daySlots = weeklyLineup.filter(slot => slot.day === dayName);
            
            document.getElementById('lineup-date').textContent = 
                `${dayName}, ${monthNames[selectedDate.getMonth()]} ${selectedDate.getDate()}, ${selectedDate.getFullYear()}`;
            
            let html = '';
            let dexterSlotCount = 0;
            
            daySlots.forEach(slot => {
                const isDexter = slot.program.includes("Dexter");
                let episodeInfo = '';
                
                if (isDexter) {
                    const episodeNum = getDexterEpisodeForDate(selectedDate);
                    episodeInfo = `<div class="slot-episode">Episode ${episodeNum}</div>`;
                    dexterSlotCount++;
                }
                
                html += `
                    <div class="lineup-slot">
                        <div class="slot-time">${slot.time}</div>
                        <div class="slot-program">
                            <div>
                                <div class="slot-title">${slot.program}</div>
                                ${episodeInfo}
                            </div>
                            ${isDexter ? '<div style="color: #0ff;">▶</div>' : '<div class="slot-off-air">OFF AIR</div>'}
                        </div>
                    </div>
                `;
            });
            
            if (html === '') {
                html = '<div style="text-align: center; opacity: 0.7;">No programming scheduled for this day</div>';
            }
            
            document.getElementById('lineup-grid').innerHTML = html;
        }

        // Initialize
        loadData();
    </script>
</body>
</html>

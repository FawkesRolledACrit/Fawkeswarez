<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>TV Guide - Fawkeswarez</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Fallback styles in case CSS fails to load */
        body {
            background: #000 !important;
            color: #0F0 !important;
            font-family: 'Chakra Petch', monospace;
            margin: 0;
            padding: 0;
        }
        
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #000 25%, #0a0a0a 25%, #0a0a0a 50%, #000 50%, #000 75%, #0a0a0a 75%, #0a0a0a);
            background-size: 20px 20px;
            z-index: -2;
        }
        
        .y2k-header {
            background: linear-gradient(45deg, #FF00FF, #00FFFF, #FFFF00);
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid #0F0;
        }
        
        .glitch-text {
            font-size: 2rem;
            color: #000;
            text-shadow: 2px 2px 0 #FF00FF, -2px -2px 0 #00FFFF;
        }
        
        .y2k-nav {
            background: #111;
            padding: 15px;
            border-bottom: 2px solid #0F0;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: linear-gradient(45deg, #0F0, #0a0);
            border: 2px solid #0F0;
            color: #000;
            padding: 10px 20px;
            font-family: 'Chakra Petch', monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .nav-btn:hover {
            background: linear-gradient(45deg, #0a0, #0F0);
            color: #0F0;
            box-shadow: 0 0 15px rgba(0,255,0,0.8);
        }
        
        .main-content {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .section-title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #0F0;
            text-shadow: 0 0 10px rgba(0,255,0,0.8);
        }
        
        .guide-container {
            background: rgba(0,20,0,0.8);
            border: 2px solid #0F0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .calendar-nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 30px;
        }
        
        .calendar-day-header {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background: rgba(0,255,255,0.2);
            border-radius: 4px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border: 1px solid #0F0;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }
        
        .calendar-day:hover {
            background: rgba(0,255,0,0.1);
            box-shadow: 0 0 10px rgba(0,255,0,0.5);
        }
        
        .calendar-day.selected {
            background: rgba(0,255,0,0.3);
            border-color: #0F0;
            box-shadow: 0 0 15px rgba(0,255,0,0.8);
        }
        
        .calendar-day.other-month {
            opacity: 0.3;
        }
        
        .lineup-date {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #0F0;
        }
        
        .lineup-slots {
            display: grid;
            gap: 10px;
        }
        
        .slot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-left: 3px solid #0F0;
        }

        .slot.block-header {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.22), rgba(0, 255, 255, 0.22));
            border-left: 3px solid #0FF;
            font-weight: bold;
        }

        .slot.block-item {
            border-left: 3px solid rgba(0, 255, 255, 0.8);
            padding-left: 22px;
        }

        .slot.timeblock-item {
            border-left: 3px solid rgba(0, 255, 0, 0.65);
            padding-left: 22px;
        }

        .slot-program .block-subtitle {
            display: block;
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        .slot-time {
            font-weight: bold;
            color: #0F0;
            min-width: 80px;
        }
        
        .slot-program {
            flex: 1;
            margin: 0 20px;
        }
        
        .slot-status {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            min-width: 80px;
            text-align: center;
        }
        
        .slot-status.on-air {
            background: linear-gradient(135deg, #0F0, #090);
            color: #000;
        }
        
        .slot-status.off-air {
            background: linear-gradient(135deg, #F00, #900);
            color: #FFF;
        }
        
        .slot-status.special {
            background: linear-gradient(135deg, #FF0, #F90);
            color: #000;
            font-weight: bold;
        }
        
        .slot-episode {
            font-size: 0.9em;
            color: #0F0;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="matrix-bg"></div>
    <div class="stars"></div>
    
    <!-- Header -->
    <header class="y2k-header">
        <div class="header-content">
            <h1 class="glitch-text" data-text="TV Guide">TV Guide</h1>
            <div class="under-construction">
                <marquee behavior="scroll" direction="left">📅 MONTHLY PROGRAM GUIDE 📅 SELECT ANY DAY TO VIEW LINEUP 📅</marquee>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="y2k-nav">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='./'">⬅ BACK TO TV</button>
            <button class="nav-btn" onclick="window.location.href='../'">🏠 HOME</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <section class="content-section active">
            <h2 class="section-title">📅 PROGRAM SCHEDULE 📅</h2>

            <div class="guide-container">
                <div class="calendar-header">
                    <button class="nav-btn" onclick="changeMonth(-1)">◀ PREV</button>
                    <h3 id="calendar-month">April 2026</h3>
                    <button class="nav-btn" onclick="changeMonth(1)">NEXT ▶</button>
                    <button class="nav-btn" onclick="loadData()">RELOAD DATA</button>
                </div>
                
                <div class="calendar-grid" id="calendar">
                    <!-- Calendar will be generated here -->
                </div>
            </div>

            <div class="guide-container">
                <h3 class="lineup-date" id="lineup-date">Select a date to view lineup</h3>
                <div class="lineup-slots" id="lineup-slots">
                    <!-- Lineup will be displayed here -->
                </div>
            </div>
        </section>
    </main>

    <script>
        let currentDate = new Date();
        let selectedDate = new Date();
        let weeklyLineup = null;
        let scheduleData = null;
        let scheduleStartDate = null;

        const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

        async function loadData() {
            try {
                // Aggressive cache bust: commit hash + timestamp + random
                const commitHash = '49d397a';
                const timestamp = new Date().getTime();
                const cacheBuster = `${commitHash}_${timestamp}_${Math.random().toString(36).substr(2, 9)}`;
                console.log('Loading weekly lineup with cache buster:', cacheBuster);
                const response = await fetch('weekly-lineup.json?t=' + cacheBuster);
                weeklyLineup = await response.json();
                console.log('Loaded weekly lineup, total entries:', weeklyLineup.length);
                console.log('First few entries:', weeklyLineup.slice(0, 3));
                console.log('Nostalgia Night entries:', weeklyLineup.filter(s => s.program === 'Nostalgia Night').map(s => s.time));
                
                // Load schedule.json to get startDate and check which shows have videos
                const scheduleResponse = await fetch('schedule.json?t=' + cacheBuster);
                scheduleData = await scheduleResponse.json();
                scheduleStartDate = scheduleData.startDate || '2026-04-01';
                console.log('Loaded schedule, start date:', scheduleStartDate);
                
                // Show cache-bust indicator briefly
                const indicator = document.createElement('div');
                indicator.textContent = `Cache-bust: ${cacheBuster}`;
                indicator.style.cssText = 'position:fixed;top:0;left:0;background:#0F0;color:#000;padding:4px;z-index:9999;font-size:10px;';
                document.body.appendChild(indicator);
                setTimeout(() => indicator.remove(), 3000);
                
                renderCalendar();
                renderLineup();
            } catch (error) {
                console.error('Failed to load data:', error);
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Update month display
            document.getElementById('calendar-month').textContent = `${monthNames[month]} ${year}`;
            
            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            let html = '';
            
            // Add day headers
            const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayHeaders.forEach(day => {
                html += `<div class="calendar-day-header">${day}</div>`;
            });
            
            // Add previous month's trailing days
            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="calendar-day other-month">${daysInPrevMonth - i}</div>`;
            }
            
            // Add current month's days
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const isToday = date.toDateString() === new Date().toDateString();
                const isSelected = date.toDateString() === selectedDate.toDateString();
                
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (isSelected) classes += ' selected';
                
                html += `<div class="${classes}" onclick="selectDate(${year}, ${month}, ${day})">${day}</div>`;
            }
            
            // Add next month's leading days
            const totalCells = firstDay + daysInMonth;
            const nextMonthDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let day = 1; day <= nextMonthDays; day++) {
                html += `<div class="calendar-day other-month">${day}</div>`;
            }
            
            document.getElementById('calendar').innerHTML = html;
        }

        function selectDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            renderCalendar();
            renderLineup();
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function renderLineup() {
            if (!weeklyLineup) return;
            
            const dayName = dayNames[selectedDate.getDay()];
            console.log('Rendering lineup for day:', dayName);
            const daySlots = weeklyLineup
                .filter(slot => slot.day === dayName)
                .slice()
                .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
            console.log('Found slots for', dayName, ':', daySlots.length);
            console.log('Day slots:', daySlots);
            
            document.getElementById('lineup-date').textContent = 
                `${dayName}, ${monthNames[selectedDate.getMonth()]} ${selectedDate.getDate()}, ${selectedDate.getFullYear()}`;
            
            let html = '';

            const CARTOON_CARTOONS_HEADER = 'Cartoon Cartoons';
            const CARTOON_CARTOONS_SHOWS = new Set([
                'Sheep in the Big City',
                'Billy & Mandy',
                "Foster's Home",
                "Dexter's Laboratory",
                'The Powerpuff Girls',
                'Ed, Edd n Eddy',
                'Johnny Bravo',
                'Courage the Cowardly Dog',
                'Cow & Chicken',
                'I Am Weasel'
            ]);

            const SPECIAL_PROGRAMS = new Set([
                'Paid Programming',
                'Boondocks Marathon',
                'Nostalgia Night'
            ]);

            const BLOCK_POOLS = {
                'MORNING MAYHEM': new Set([
                    "Dexter's Laboratory",
                    'The Powerpuff Girls',
                    'Ed, Edd n Eddy',
                    'Johnny Bravo',
                    'Courage the Cowardly Dog',
                    'Tom and Jerry'
                ]),
                'CARTOON CARTOONS': CARTOON_CARTOONS_SHOWS,
                'MIDDAY MADNESS': new Set([
                    "Dexter's Laboratory",
                    'The Powerpuff Girls',
                    'Ed, Edd n Eddy',
                    'Johnny Bravo',
                    'Courage the Cowardly Dog',
                    'Teen Titans',
                    'Dragon Ball Z',
                    'Samurai Jack'
                ]),
                'AFTERNOON ACTION': new Set([
                    'Teen Titans',
                    'Dragon Ball Z',
                    'Samurai Jack',
                    'Ben 10',
                    'Codename: Kids Next Door'
                ]),
                'PRIME TIME POWER': new Set([
                    'Teen Titans',
                    'Dragon Ball Z',
                    'Samurai Jack',
                    'Justice League',
                    'Avatar: The Last Airbender'
                ]),
                'ADULT SWIM': new Set([
                    'Aqua Teen Hunger Force',
                    'Space Ghost Coast to Coast',
                    'Sealab 2021',
                    'Home Movies',
                    'The Venture Bros',
                    'Harvey Birdman, Attorney at Law',
                    'Tom Goes to the Mayor',
                    'Brak Show'
                ])
            };

            function getSlotDisplayData(slot) {
                // Handle special block types and check for regular shows
                let hasEpisodes = false;
                let episodeInfo = '';
                let statusClass = 'off-air';
                let statusText = 'OFF AIR';

                if (slot.program === 'Paid Programming') {
                    hasEpisodes = scheduleData && scheduleData.blocks && scheduleData.blocks.some(block => block.blockType === 'paid');
                    if (hasEpisodes) {
                        episodeInfo = '<div class="slot-episode">Paid Content</div>';
                        statusClass = 'special';
                        statusText = '📺';
                    }
                } else if (slot.program === 'Boondocks Marathon') {
                    hasEpisodes = scheduleData && scheduleData.blocks && scheduleData.blocks.some(block => block.blockType === 'marathon');
                    if (hasEpisodes) {
                        episodeInfo = '<div class="slot-episode">All-Day Marathon</div>';
                        statusClass = 'special';
                        statusText = '🎬';
                    }
                } else if (slot.program === 'Nostalgia Night') {
                    const hasMovies = scheduleData && scheduleData.blocks && scheduleData.blocks.some(block => block.blockType === 'movie');
                    if (hasMovies) {
                        // Show which movie is playing based on occurrence
                        const movieBlocks = scheduleData.blocks.filter(block => block.blockType === 'movie');
                        const occ = getProgramOccurrenceIndex(slot.program, slot.time, selectedDate);
                        const movieIndex = occ % movieBlocks.length;
                        const movieTitle = movieBlocks[movieIndex].title;
                        episodeInfo = `<div class="slot-episode">${movieTitle}</div>`;
                        statusClass = 'special';
                        statusText = '🎥';
                    }
                } else {
                    // Regular shows - check if they have episodes
                    hasEpisodes = scheduleData && scheduleData.blocks && scheduleData.blocks.some(block => {
                        const title = block.title.toLowerCase();
                        const programLower = slot.program.toLowerCase();
                        return !block.blockType && (title === programLower || title.includes(programLower) || programLower.includes(title));
                    });

                    if (hasEpisodes) {
                        const episodeData = getEpisodeForDate(selectedDate, slot.time, slot.program);
                        const episodeDisplay = `S${episodeData.season.toString().padStart(2, '0')}E${episodeData.episode.toString().padStart(2, '0')}`;
                        episodeInfo = `<div class="slot-episode">${episodeDisplay}</div>`;
                        statusClass = 'on-air';
                        statusText = '▶';
                    }
                }

                console.log(`Show ${slot.program} has episodes: ${hasEpisodes}`);
                return { episodeInfo, statusClass, statusText };
            }

            function renderSlot(slot, extraSlotClass, programHtmlOverride) {
                const { episodeInfo, statusClass, statusText } = getSlotDisplayData(slot);
                const programHtml = (programHtmlOverride != null)
                    ? programHtmlOverride
                    : `${slot.program}${episodeInfo}`;

                html += `
                    <div class="slot${extraSlotClass ? ' ' + extraSlotClass : ''}">
                        <div class="slot-time">${slot.time}</div>
                        <div class="slot-program">${programHtml}</div>
                        <div class="slot-status ${statusClass}">${statusText}</div>
                    </div>
                `;
            }

            function slotLooksLikeCartoonCartoonsContext(slot) {
                if (!slot?.program) return false;
                if (slot.program === CARTOON_CARTOONS_HEADER) return true;
                return CARTOON_CARTOONS_SHOWS.has(slot.program);
            }

            function shouldStartImplicitCartoonCartoonsBlock(daySlots, idx) {
                const slot = daySlots[idx];
                if (!slot || !CARTOON_CARTOONS_SHOWS.has(slot.program)) return false;
                const prev = idx > 0 ? daySlots[idx - 1] : null;
                const next = idx + 1 < daySlots.length ? daySlots[idx + 1] : null;
                return (prev && slotLooksLikeCartoonCartoonsContext(prev)) || (next && slotLooksLikeCartoonCartoonsContext(next));
            }

            function getTimeBlockNameForMinutes(mins) {
                const hour = Math.floor((mins || 0) / 60);
                if (hour >= 6 && hour < 10) {
                    return 'MORNING MAYHEM';
                } else if (hour >= 10 && hour < 14) {
                    return 'MIDDAY MADNESS';
                } else if (hour >= 14 && hour < 18) {
                    return 'AFTERNOON ACTION';
                } else if (hour >= 18 && hour < 22) {
                    return 'PRIME TIME POWER';
                } else {
                    return 'ADULT SWIM';
                }
            }

            function canonicalBlockForSlot(daySlots, idx) {
                const slot = daySlots[idx];
                if (!slot) return null;
                if (slot.program === CARTOON_CARTOONS_HEADER) return 'CARTOON CARTOONS';
                if (CARTOON_CARTOONS_SHOWS.has(slot.program) && shouldStartImplicitCartoonCartoonsBlock(daySlots, idx)) {
                    return 'CARTOON CARTOONS';
                }
                const mins = timeToMinutes(slot.time);
                return getTimeBlockNameForMinutes(mins);
            }

            function renderTimeBlockHeader(blockName, timeStr) {
                const headerSlot = { time: timeStr, program: blockName };
                const subtitle = blockName === 'ADULT SWIM'
                    ? 'Late night weirdness'
                    : 'Programming block';
                const programHtml = `${blockName}<span class="block-subtitle">${subtitle}</span>`;
                renderSlot(headerSlot, 'block-header', programHtml);
            }

            let inCartoonCartoons = false;
            let seenExplicitHeaderInCurrentBlock = false;
            let currentTimeBlock = null;

            for (let i = 0; i < daySlots.length; i++) {
                const slot = daySlots[i];
                console.log(`Processing slot: ${slot.program}`);

                const slotTimeBlock = canonicalBlockForSlot(daySlots, i);
                if (!inCartoonCartoons && slotTimeBlock && slotTimeBlock !== currentTimeBlock && slot.program !== CARTOON_CARTOONS_HEADER) {
                    currentTimeBlock = slotTimeBlock;
                    renderTimeBlockHeader(currentTimeBlock, slot.time);
                }

                // Explicit block header
                if (slot.program === CARTOON_CARTOONS_HEADER) {
                    inCartoonCartoons = true;
                    seenExplicitHeaderInCurrentBlock = true;
                    currentTimeBlock = 'CARTOON CARTOONS';
                    const programHtml = `${CARTOON_CARTOONS_HEADER}<span class="block-subtitle">Classic shorts & CN originals</span>`;
                    renderSlot(slot, 'block-header', programHtml);
                    continue;
                }

                // Implicit block start (fix for days where the header slot is missing/shifted)
                if (!inCartoonCartoons && shouldStartImplicitCartoonCartoonsBlock(daySlots, i)) {
                    inCartoonCartoons = true;
                    seenExplicitHeaderInCurrentBlock = false;
                    currentTimeBlock = 'CARTOON CARTOONS';

                    const implicitHeaderSlot = { ...slot, program: CARTOON_CARTOONS_HEADER };
                    const programHtml = `${CARTOON_CARTOONS_HEADER}<span class="block-subtitle">(inferred block)</span>`;
                    renderSlot(implicitHeaderSlot, 'block-header', programHtml);
                }

                if (inCartoonCartoons && CARTOON_CARTOONS_SHOWS.has(slot.program)) {
                    renderSlot(slot, 'block-item');
                } else {
                    // Leaving Cartoon Cartoons context if we hit a non-member show
                    inCartoonCartoons = false;
                    seenExplicitHeaderInCurrentBlock = false;

                    const blockKey = canonicalBlockForSlot(daySlots, i);
                    const pool = BLOCK_POOLS[blockKey];
                    if (slot.program && !SPECIAL_PROGRAMS.has(slot.program) && pool && !pool.has(slot.program)) {
                        console.warn('Program out of pool for time block:', { blockKey, slot, dayName });
                    }

                    renderSlot(slot, currentTimeBlock ? 'timeblock-item' : '');
                }

                // Regression warning: Sheep should not be alone when surrounded by block context
                if (slot.program === 'Sheep in the Big City') {
                    const prev = i > 0 ? daySlots[i - 1] : null;
                    const next = i + 1 < daySlots.length ? daySlots[i + 1] : null;
                    const shouldBeGrouped = (prev && slotLooksLikeCartoonCartoonsContext(prev)) || (next && slotLooksLikeCartoonCartoonsContext(next));
                    if (shouldBeGrouped && !inCartoonCartoons) {
                        console.warn('Sheep slot rendered outside Cartoon Cartoons block context:', { dayName, slot, prev, next, seenExplicitHeaderInCurrentBlock });
                    }
                }
            }
            
            if (html === '') {
                html = '<div style="text-align: center; padding: 40px; color: #0F0;">No programming scheduled for this day</div>';
            }
            
            document.getElementById('lineup-slots').innerHTML = html;
        }

        function getDayIndexFromName(dayName) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return days.indexOf(dayName);
        }

        function getDayName(date) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return days[date.getDay()];
        }

        function timeToMinutes(timeStr) {
            const m = String(timeStr || '').trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
            if (!m) return null;
            let hour = parseInt(m[1], 10);
            const minute = parseInt(m[2], 10);
            const ampm = m[3].toUpperCase();
            if (hour === 12) hour = 0;
            if (ampm === 'PM') hour += 12;
            return hour * 60 + minute;
        }

        function getProgramOccurrencesForDay(program, dayName) {
            if (!weeklyLineup || !dayName) return [];
            const slots = weeklyLineup.filter(s => s.day === dayName && s.program === program);
            return slots
                .map(s => timeToMinutes(s.time))
                .filter(m => m !== null)
                .sort((a, b) => a - b);
        }

        function getProgramWeeklyCount(program) {
            if (!weeklyLineup || !program) return 0;
            let total = 0;
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            for (const dayName of days) {
                total += getProgramOccurrencesForDay(program, dayName).length;
            }
            return total;
        }

        function getProgramOccurrenceIndex(program, timeStr, date) {
            if (!program || !timeStr || !date || !weeklyLineup || !scheduleStartDate) return 0;

            const slotStartMin = timeToMinutes(timeStr);
            if (slotStartMin === null) return 0;

            const slotStart = new Date(date);
            slotStart.setHours(0, 0, 0, 0);
            slotStart.setMinutes(slotStartMin);

            const scheduleStart = new Date(scheduleStartDate + 'T00:00:00');
            const scheduleDayStart = new Date(scheduleStart);
            scheduleDayStart.setHours(0, 0, 0, 0);

            const MS_PER_DAY = 24 * 60 * 60 * 1000;
            const daysDiff = Math.floor((slotStart - scheduleDayStart) / MS_PER_DAY);
            if (daysDiff < 0) return 0;

            const weeklyCount = getProgramWeeklyCount(program);
            if (weeklyCount <= 0) return 0;

            // Whole weeks between anchor and current
            const wholeWeeks = Math.floor(daysDiff / 7);
            let total = wholeWeeks * weeklyCount;

            // Partial week days
            const remDays = daysDiff % 7;
            for (let i = 0; i < remDays; i++) {
                const d = new Date(scheduleDayStart.getTime() + ((wholeWeeks * 7 + i) * MS_PER_DAY));
                const dayName = getDayName(d);
                total += getProgramOccurrencesForDay(program, dayName).length;
            }

            // Current day: count slots strictly before this one
            const currentDayName = getDayName(slotStart);
            const starts = getProgramOccurrencesForDay(program, currentDayName);
            for (const sMin of starts) {
                if (sMin < slotStartMin) total += 1;
            }

            return total;
        }

        function getEpisodeForDate(date, timeStr, program) {
            // Use occurrence counting if we have the data
            if (typeof weeklyLineup !== 'undefined' && typeof scheduleStartDate !== 'undefined') {
                const occ = getProgramOccurrenceIndex(program, timeStr, date);
                
                // Episode counts reflecting what's actually in schedule.json
                const knownCounts = {
                    "Dexter's Laboratory": { episodes: 20, seasons: 2 },
                    "The Powerpuff Girls": { episodes: 20, seasons: 2 },
                    "Ed, Edd n Eddy": { episodes: 20, seasons: 1 },
                    "Space Ghost Coast to Coast": { episodes: 18, seasons: 1 },
                    "Aqua Teen Hunger Force": { episodes: 18, seasons: 1 }
                };
                
                let episodeCount = 15; // Default fallback
                let seasonCount = 1;
                
                if (knownCounts[program]) {
                    episodeCount = knownCounts[program].episodes;
                    seasonCount = knownCounts[program].seasons;
                }
                
                const episodeIndex = ((occ % episodeCount) + episodeCount) % episodeCount;
                const episodeNum = episodeIndex + 1;
                
                // Determine season for multi-season shows
                let season = 1;
                if (program === "Dexter's Laboratory" || program === "The Powerpuff Girls") {
                    season = (episodeNum <= 13) ? 1 : 2;
                }
                
                return { episode: episodeNum, season };
            }
            
            // Fallback if data not available
            return { episode: 1, season: 1 };
        }

        function getDexterEpisodeForDate(date, timeStr) {
            // Keep for backward compatibility
            return getEpisodeForDate(date, timeStr, "Dexter's Laboratory");
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
